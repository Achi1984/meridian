<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05070b"><link rel="manifest" href="../manifest.webmanifest?v=10.0-r74"><title>MERIDIAN v10 · Achi</title><meta name="meridian-build" content="10.0-r74"><link rel="stylesheet" href="../v9/v9.css?v=10.0-r74"><link rel="stylesheet" href="./v10.css?v=10.0-r74"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><script>
(function(){
  const LOCAL_BUILD='10.0-r74';
  const heal=()=>{
    fetch('../version.json?boot='+Date.now(),{cache:'no-store'})
      .then(r=>r.ok?r.json():null)
      .then(v=>{
        const latest=String(v?.terminalBuild||'');
        if(!latest||latest===LOCAL_BUILD)return;
        const m=latest.match(/r\\d+$/),rev=m?m[0]:latest;
        const u=new URL(location.href);
        u.searchParams.set('build',rev);
        u.searchParams.set('fresh',String(Date.now()));
        location.replace(u.toString());
      }).catch(()=>{});
  };
  heal();
  window.addEventListener('pageshow',e=>{if(e.persisted)heal()});
})();
</script></head>

<main><section id="view-command" class="view active"></section><section id="view-depot" class="view"></section><section id="view-bots" class="view"></section><section id="view-market" class="view"></section><section id="view-research" class="view"></section><section id="view-asset-detail" class="view"></section><section id="view-more" class="view"></section></main>
