<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MERIDIAN Reset</title>
<style>
body{background:#05080d;color:#eef5ff;font:18px system-ui;padding:max(24px,env(safe-area-inset-top)) 24px}
b{color:#25aaff}
</style>
<h2>ACHI MERIDIAN v5.1.2</h2>
<p id="s">Alte App-Shell wird entfernt…</p>
<script>
(async()=>{
  try{
    for(const r of await navigator.serviceWorker?.getRegistrations?.()||[]) await r.unregister();
    for(const k of await caches.keys()) await caches.delete(k);
    sessionStorage.setItem('meridianShellVersion','5.1.2');
    document.getElementById('s').innerHTML='<b>Fertig.</b> LocalStorage bleibt erhalten. Weiterleitung…';
    setTimeout(()=>location.replace('./index.html?v=5.1.2-reset-'+Date.now()),600);
  }catch(e){
    location.replace('./index.html?v=5.1.2-'+Date.now());
  }
})();
</script>
