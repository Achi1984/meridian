<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<body style="background:#05080d;color:white;font-family:monospace;padding:30px"><h2>MERIDIAN v5.0.3 SAFE BOOT</h2><p id=s>Cache wird entfernt…</p>
<script>(async()=>{try{if('serviceWorker'in navigator){for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister()}if('caches'in window){for(const k of await caches.keys())if(k.toLowerCase().includes('meridian'))await caches.delete(k)}}catch(e){}document.getElementById('s').textContent='Fertig. MERIDIAN wird frisch geladen.';setTimeout(()=>location.replace('./index.html?v=503&t='+Date.now()),800)})()</script></body>
