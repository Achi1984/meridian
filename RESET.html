<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MERIDIAN RESET v5.25.2</title>
<style>
body{background:#02080e;color:#eaf6ff;font-family:system-ui;padding:32px}
.box{max-width:680px;margin:auto;border:1px solid #149be8;border-radius:22px;padding:24px;background:#071824}
h1{color:#22aaff}.ok{color:#2ee59d}.muted{color:#8ba0b3}
</style>
</head>
<body><div class="box">
<h1>MERIDIAN v5.25.2 RESET</h1>
<p id="s">Cache und Service Worker werden entfernt…</p>
<p class="muted">Danach wirst du automatisch zur frischen Version weitergeleitet.</p>
</div>
<script>
(async()=>{
 try{
   if('serviceWorker' in navigator){
     const regs=await navigator.serviceWorker.getRegistrations();
     await Promise.all(regs.map(r=>r.unregister()));
   }
   if('caches' in window){
     const ks=await caches.keys();
     await Promise.all(ks.map(k=>caches.delete(k)));
   }
   localStorage.removeItem('meridian-cache');
   sessionStorage.clear();
   document.getElementById('s').innerHTML='<span class="ok">Reset fertig.</span> Lade v5.25.2…';
 }catch(e){
   document.getElementById('s').textContent='Reset ausgeführt. Lade neu…';
 }
 setTimeout(()=>location.replace('./index.html?hard=5252&t='+Date.now()),700);
})();
</script>
</body></html>
