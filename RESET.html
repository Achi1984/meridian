<title>MERIDIAN 5.1.4 Reset</title>

<h2>ACHI MERIDIAN v5.1.4</h2><p id="s">DAYTRADE-Hotfix wird aktiviert…</p>
<script>
(async()=>{try{
for(const r of await navigator.serviceWorker?.getRegistrations?.()||[]) await r.unregister();

document.getElementById('s').innerHTML='<b>Fertig.</b> Weiterleitung…';

}catch(e){location.replace('./index.html?v=5.1.4-'+Date.now())}})();
</script>
