<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MERIDIAN Reset</title>
<style>
body{background:#05080d;color:#eef5ff;font:18px system-ui;padding:max(28px,env(safe-area-inset-top)) 28px}
b{color:#25aaff}
</style>
<h2>ACHI MERIDIAN v5.1.1</h2>
<p id="s">Cache und alte App-Shell werden bereinigt…</p>
<script>
(async()=>{
  try{
    for(const r of await navigator.serviceWorker?.getRegistrations?.()||[]) await r.unregister();
    for(const k of await caches.keys()) await caches.delete(k);
    sessionStorage.setItem('meridianShellVersion','5.1.1');
    document.getElementById('s').innerHTML='<b>Fertig.</b> Portfolio-Historie und Cashflows bleiben erhalten. Weiterleitung…';
    setTimeout(()=>location.replace('./index.html?v=5.1.1-reset-'+Date.now()),700);
  }catch(e){
    location.replace('./index.html?v=5.1.1-'+Date.now());
  }
})();
</script>
