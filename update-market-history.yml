name: Update MERIDIAN market history

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"
  push:
    branches: [ "main" ]
    paths-ignore:
      - "history.json"

permissions:
  contents: write

concurrency:
  group: meridian-history
  cancel-in-progress: true

jobs:
  update-history:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build history.json
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.parse, time, datetime, pathlib

          DAYS=2000
          LIMIT=1000
          symbols = {
            "BTC":"BTCUSDT","ETH":"ETHUSDT","SOL":"SOLUSDT","XRP":"XRPUSDT",
            "SUI":"SUIUSDT","ADA":"ADAUSDT","FET":"FETUSDT","HBAR":"HBARUSDT",
            "DOT":"DOTUSDT","ATOM":"ATOMUSDT","NEAR":"NEARUSDT","AVAX":"AVAXUSDT",
            "TAO":"TAOUSDT","INJ":"INJUSDT","PEPE":"PEPEUSDT","XLM":"XLMUSDT"
          }
          cg = {
            "BTC":"bitcoin","ETH":"ethereum","SOL":"solana","XRP":"ripple",
            "SUI":"sui","ADA":"cardano","FET":"fetch-ai","HBAR":"hedera-hashgraph",
            "DOT":"polkadot","VSN":"vision","ATOM":"cosmos","NEAR":"near",
            "AVAX":"avalanche-2","TAO":"bittensor","INJ":"injective-protocol",
            "PEPE":"pepe","XLM":"stellar"
          }
          bases=[
            "https://data-api.binance.vision",
            "https://api.binance.com",
            "https://api1.binance.com"
          ]

          def get_json(url, timeout=20):
              req=urllib.request.Request(url,headers={"User-Agent":"MERIDIAN-GitHub-Actions/3.9"})
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  return json.loads(r.read().decode("utf-8"))

          def binance_history(symbol):
              rows=[]
              end=None
              while len(rows)<DAYS:
                  lim=min(LIMIT,DAYS-len(rows))
                  params={"symbol":symbol,"interval":"1d","limit":lim}
                  if end is not None:
                      params["endTime"]=end
                  chunk=None
                  last=None
                  for base in bases:
                      try:
                          url=base+"/api/v3/klines?"+urllib.parse.urlencode(params)
                          x=get_json(url)
                          if isinstance(x,list) and x:
                              chunk=x
                              break
                      except Exception as e:
                          last=e
                  if not chunk:
                      if rows: break
                      raise last or RuntimeError("No Binance data")
                  normalized=[[int(x[0]),float(x[1]),float(x[2]),float(x[3]),float(x[4]),float(x[5])] for x in chunk]
                  rows=normalized+rows
                  oldest=int(chunk[0][0])
                  end=oldest-1
                  if len(chunk)<lim: break
                  time.sleep(0.12)
              # de-dupe/sort, last DAYS
              d={r[0]:r for r in rows}
              return [d[k] for k in sorted(d)][-DAYS:]

          def coingecko_history(coin_id):
              # Fallback only. CoinGecko public limits may reduce available history.
              url=f"https://api.coingecko.com/api/v3/coins/{coin_id}/market_chart?vs_currency=usd&days=365&interval=daily"
              j=get_json(url)
              prices=j.get("prices",[])
              return [[int(t),float(p),float(p),float(p),float(p),0.0] for t,p in prices]

          result={
            "schemaVersion":2,
            "generatedAt":datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "status":"ok",
            "days":DAYS,
            "source":"GitHub Actions",
            "coins":{},
            "errors":{}
          }

          for coin in cg:
              try:
                  if coin in symbols:
                      candles=binance_history(symbols[coin])
                      source="Binance"
                  else:
                      candles=coingecko_history(cg[coin])
                      source="CoinGecko fallback"
                  if len(candles)<10:
                      raise RuntimeError("Too few candles")
                  result["coins"][coin]={
                    "source":source,
                    "count":len(candles),
                    "candles":candles
                  }
                  print(coin, source, len(candles))
              except Exception as e:
                  result["errors"][coin]=str(e)
                  print("ERROR",coin,e)

          pathlib.Path("history.json").write_text(
              json.dumps(result,separators=(",",":"),ensure_ascii=False),
              encoding="utf-8"
          )
          PY

      - name: Commit updated history
        shell: bash
        run: |
          if git diff --quiet history.json; then
            echo "No history changes."
            exit 0
          fi
          git config user.name "MERIDIAN Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add history.json
          git commit -m "chore: update MERIDIAN market history"
          git push
