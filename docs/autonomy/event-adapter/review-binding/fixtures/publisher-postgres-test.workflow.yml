# INACTIVE CANDIDATE: installation and one-run approval are separate.
name: Publisher isolated PostgreSQL test
'on':
  workflow_dispatch:
    inputs:
      approved_source_sha:
        description: Exact independently reviewed commit for this single test
        required: true
        type: string
      postgres_digest:
        description: Independently verified official PostgreSQL 16 sha256 image digest
        required: true
        type: string
permissions:
  contents: read
jobs:
  isolated-db:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Validate exact source and image pins
        env:
          APPROVED_SHA: ${{ inputs.approved_source_sha }}
          IMAGE_DIGEST: ${{ inputs.postgres_digest }}
        run: |
          [[ "$APPROVED_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$APPROVED_SHA" == "$GITHUB_SHA" ]]
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Explicit publisher preparation tests
        run: |
          node --test docs/autonomy/event-adapter/review-binding/test/publication-*.test.mjs
          python3 -m unittest discover -s docs/autonomy/event-adapter/review-binding/test -p 'test_*.py'
      - name: Actual PostgreSQL schema, claims and crash recovery
        env:
          MERIDIAN_ISOLATED_DB_TEST: 'YES'
          MERIDIAN_POSTGRES_DIGEST: ${{ inputs.postgres_digest }}
        run: node docs/autonomy/event-adapter/review-binding/scripts/publication-postgres-integration.mjs
