# INACTIVE proposal. Future destination: .github/workflows/meridian-database-readiness.yml
# Installation, role provisioning, environment secrets and one run need separate approval.
# Configure meridian-publisher-test externally: required owner review, main-only deployment.
# Node 22.23.3 matches successful TLS diagnostic job 115964404663.
name: Publisher TEST database scoped readiness
'on':
  workflow_dispatch:
permissions:
  contents: read
jobs:
  database-readiness:
    if: >-
      github.repository == 'Achi1984/meridian' &&
      github.event.repository.owner.type == 'User' &&
      github.repository_owner == 'Achi1984' &&
      github.actor == 'Achi1984' &&
      github.triggering_actor == 'Achi1984' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.run_number == 1 &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: meridian-publisher-test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 817e18d06c453bbd6a01fa44abe1de778dc94cc9
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Verify the reviewed lock and install without scripts
        shell: bash
        run: |
          node --input-type=module <<'NODE' >/dev/null 2>&1
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          if (process.version !== 'v22.23.3') process.exit(1);
          const bytes = readFileSync('package-lock.json');
          const blob = createHash('sha1').update(`blob ${bytes.length}\0`).update(bytes).digest('hex');
          const lock = JSON.parse(bytes);
          if (blob !== '55a78f3b27fd823008b77dde8d77219bd0fbef2d' || lock.lockfileVersion !== 3 || lock.packages['node_modules/pg'].version !== '8.23.0') process.exit(1);
          NODE
          if ! npm ci --ignore-scripts --no-audit --no-fund >/dev/null 2>&1; then
            echo 'Dependency installation failed; raw output suppressed.'
            exit 1
          fi
      - name: Run one scoped read-only TEST check
        shell: bash
        env:
          MERIDIAN_PUBLISHER_TEST_DATABASE: publisher_ledger
          MERIDIAN_PUBLISHER_TEST_RESERVATION_USER: ${{ secrets.MERIDIAN_PUBLISHER_TEST_RESERVATION_USER }}
          MERIDIAN_PUBLISHER_TEST_RESERVATION_PASSWORD: ${{ secrets.MERIDIAN_PUBLISHER_TEST_RESERVATION_PASSWORD }}
          MERIDIAN_PUBLISHER_TEST_SENDER_USER: ${{ secrets.MERIDIAN_PUBLISHER_TEST_SENDER_USER }}
          MERIDIAN_PUBLISHER_TEST_SENDER_PASSWORD: ${{ secrets.MERIDIAN_PUBLISHER_TEST_SENDER_PASSWORD }}
          MERIDIAN_PUBLISHER_TEST_READER_USER: ${{ secrets.MERIDIAN_PUBLISHER_TEST_READER_USER }}
          MERIDIAN_PUBLISHER_TEST_READER_PASSWORD: ${{ secrets.MERIDIAN_PUBLISHER_TEST_READER_PASSWORD }}
        run: |
          set +e
          node docs/autonomy/event-adapter/review-binding/scripts/publication-database-readiness-cli.mjs --check-test-db 2>/dev/null
          check_exit=$?
          printf 'Readiness CLI exit code: %s\n' "$check_exit"
          exit "$check_exit"
