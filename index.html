<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05080d">
<link rel="manifest" href="manifest.webmanifest?v=5.3.1-forecast33-hardfix">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles-v5.1.5.css?v=5.4.0-forecast40">
<title>MERIDIAN</title>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="brandline">
        <div class="brandword"><span class="achi">ACHI</span><span class="meridian">MERIDIAN</span></div>
        <span class="version" id="versionBadge">v5.4.0 · LIVE</span>
      </div>
      <div class="live"><span class="dot"></span>LIVE DASHBOARD</div>
    </div>
    <div class="top-actions">
      <div class="pill" id="refreshTime">↻ --:--</div>
      <button class="gear logo-btn" id="settingsBtn"><img src="achi-meridian-logo.png" alt="ACHI Meridian"></button>
    </div>
  </header>

  <main>
    <section id="view-center"></section>
    <section id="view-depot" class="hidden"></section>
    <section id="view-market" class="hidden"></section>
    <section id="view-bottom" class="hidden"></section>
    <section id="view-daytrade" class="hidden"></section>
    <section id="view-grid" class="hidden"></section>
<section id="view-forecast" class="hidden"></section>
    <section id="view-settings" class="hidden"></section>
  </main>
</div>

<nav class="bottom"><div class="inner">
  <button class="nav active" data-view="center"><span>⌾</span>CENTER</button>
  <button class="nav" data-view="depot"><span>◔</span>DEPOT</button>
  <button class="nav" data-view="market"><span>▥</span>MARKT</button>
  <button class="nav" data-view="bottom"><span>◎</span>BODEN</button>
  <button class="nav" data-view="daytrade"><span>⌁</span>TRADE</button>
  <button class="nav" data-view="grid"><span>⌗</span><b>GRID</b></button>
<button class="nav" data-view="forecast"><span>↗</span>FCST</button>
</div></nav>
<script src="app-v5.4.0.js?v=5.4.0-forecast40"></script>
</body></html>
