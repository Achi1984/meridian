<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05080d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
<title>MERIDIAN</title>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <h1>MERIDIAN <span class="version" id="versionBadge">v4.0</span></h1>
      <div class="live"><span class="dot"></span>LIVE DASHBOARD</div>
    </div>
    <div class="top-actions">
      <div class="pill" id="refreshTime">↻ --:--</div>
      <button class="gear" id="settingsBtn">⚙️</button>
    </div>
  </header>

  <main>
    <section id="view-depot"></section>
    <section id="view-market" class="hidden"></section>
    <section id="view-bottom" class="hidden"></section>
    <section id="view-daytrade" class="hidden"></section>
    <section id="view-forecast" class="hidden"></section>
    <section id="view-settings" class="hidden"></section>
  </main>
</div>

<nav class="bottom"><div class="inner">
  <button class="nav active" data-view="depot"><span>◔</span>DEPOT</button>
  <button class="nav" data-view="market"><span>▥</span>MARKT</button>
  <button class="nav" data-view="bottom"><span>◎</span>BODEN</button>
  <button class="nav" data-view="daytrade"><span>⌁</span>DAY-TRADE</button>
  <button class="nav" data-view="forecast"><span>⌁</span>FORECAST</button>
  <button class="nav" data-view="settings"><span>⚙</span>SETTINGS</button>
</div></nav>
<script src="app.js"></script>
</body></html>
