<script id="meridian-dynamic-liq-guard-v5103">
(function(){
  const CLASSIFY = b => b < 8 ? ["CRITICAL","#ff5f70"] : b < 15 ? ["DANGER","#ffb84d"] : b < 30 ? ["TIGHT","#ffca55"] : ["SAFE","#35dc93"];
  // For SHORT positions liquidation is above market: distance = (liq/current - 1)*100.
  // For LONG positions liquidation is below market: distance = (1 - liq/current)*100.
  function liqBuffer(side,current,liq){
    current=Number(current); liq=Number(liq);
    if(!current||!liq) return null;
    return Math.max(0, side==="SHORT" ? (liq/current-1)*100 : (1-liq/current)*100);
  }
  window.MERIDIAN_LIQ_GUARD={
    version:"1.0",
    liqBuffer,
    classify:CLASSIFY,
    evaluate(bot,current){
      if(!bot || bot.status==="CLOSED") return null;
      const b=liqBuffer(String(bot.side||bot.direction||"").toUpperCase(),current,bot.liquidationPrice||bot.liq);
      if(b==null) return {state:"SNAPSHOT",buffer:null};
      const [state,color]=CLASSIFY(b);
      return {state,buffer:b,color,priority:b<8?1:b<15?2:b<30?3:4};
    }
  };
  function sync(){
    // Update visible cards when a live price and liquidation price are available in DOM/data attributes.
    document.querySelectorAll("[data-bot-side][data-liq-price]").forEach(el=>{
      const side=(el.dataset.botSide||"").toUpperCase();
      const liq=parseFloat(el.dataset.liqPrice);
      const current=parseFloat(el.dataset.livePrice || document.body.dataset.btcPrice || document.body.dataset.livePrice);
      const b=liqBuffer(side,current,liq);
      if(b==null) return;
      const [state,color]=CLASSIFY(b);
      el.dataset.liqBuffer=b.toFixed(2);
      el.dataset.riskState=state;
      const out=el.querySelector("[data-dynamic-liq-buffer]");
      if(out){ out.textContent=b.toFixed(1).replace(".",",")+"% LIQ"; out.style.color=color; }
      const st=el.querySelector("[data-dynamic-risk-state]");
      if(st){ st.textContent=state; st.style.color=color; }
    });
  }
  window.addEventListener("load",sync);
  setInterval(sync,1000);
})();
</script>
