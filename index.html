:root{
  --bg:#03070c;--panel:#07111a;--panel2:#08131d;--line:#0f4b78;--line2:#17354f;

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
body{padding-bottom:72px}

.app{max-width:900px;margin:0 auto;padding:calc(8px + env(safe-area-inset-top)) 12px 18px}

.brandword .achi{display:block;font-family:system-ui,-apple-system,sans-serif;font-size:30px;letter-spacing:7px;font-weight:800}

.dot{display:inline-block;width:8px;height:8px;background:var(--blue);border-radius:50%;margin-right:7px}

.pill,.gear{border:1px solid var(--line2);background:#06101a;border-radius:14px;color:#a3b1c2;font-weight:800}
.pill{padding:8px 10px;font-size:10px}
.gear{padding:0;width:46px;height:46px;overflow:hidden}

.card{border:1px solid var(--line);background:linear-gradient(145deg,#06111b,#08131d 70%,rgba(32,164,255,.05));border-radius:18px;padding:14px;margin-bottom:12px}
.hero{padding:15px}

.big{font-family:system-ui,-apple-system,sans-serif;font-size:38px;font-weight:900;letter-spacing:-1.7px;margin:9px 0 0;line-height:1}
.sub{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.35}
.green{color:var(--green)}.red{color:var(--red)}.amber{color:var(--amber)}.cyan{color:var(--blue)}.muted{color:var(--muted)}

.hidden{display:none!important}

.donut{width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--blue) 0 61.1%,var(--blue2) 61.1% 97.3%,var(--violet) 97.3% 99.4%,var(--pink) 99.4%);position:relative;margin:auto}
.donut:after{content:"";position:absolute;inset:17px;background:#07111a;border-radius:50%}

  .pill{padding:7px 9px;font-size:9px}
  .gear{width:42px;height:42px}
  .card{padding:12px;border-radius:16px;margin-bottom:11px}
  .hero{padding:13px}
  .big{font-size:34px}
  .metric{padding:9px;border-radius:12px}
  .metric .value{font-size:13px}
  .row{font-size:10px;padding:6px 0}
  .donut{width:88px;height:88px}
  .donut:after{inset:16px}
  .forecast-main{font-size:21px}
  .confidence{min-width:72px;padding:8px 9px}

/* v4.8.1 — unmistakable live-data pulse */
.live-badge{
  display:inline-flex;
  align-items:center;
  gap:5px;
  vertical-align:middle;
  font-size:7.5px;
  font-weight:900;

}

<script>
/* MERIDIAN v6.23 — remove legacy PWA cache / service worker.
   The cloud dashboard must always load the current GitHub Pages build. */
window.addEventListener('load', async () => {
  try {
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.unregister()));
    }
    if ('caches' in window) {
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
  } catch (e) { console.warn('MERIDIAN legacy cache cleanup', e); }
});
</script>

<script id="v731-paper-tabs-controller">
(function(){
  'use strict';
  const KEY='meridian_paper_bot_tab_v731';
  const ALLOWED=new Set(['baseline','shadow','challenger','regime','compare']);
  function read(){
    try{
      const v=localStorage.getItem(KEY);
      if(ALLOWED.has(v)) return v;
    }catch(_e){}
    return 'baseline';
  }
  window.meridianPaperBotTab=function(){
    const v=window.MERIDIAN_PAPER_BOT_TAB||read();
    return ALLOWED.has(v)?v:'baseline';
  };
  window.meridianPaperSetBotTab=function(v){
    if(!ALLOWED.has(v))v='baseline';
    window.MERIDIAN_PAPER_BOT_TAB=v;
    try{localStorage.setItem(KEY,v)}catch(_e){}
    try{renderOne('paper')}catch(_e){}
    try{window.scrollTo({top:document.getElementById('v731-paper-tabs')?.getBoundingClientRect().top+window.scrollY-12||0,behavior:'auto'})}catch(_e){}
  };
  window.MERIDIAN_PAPER_BOT_TAB=read();
})();
</script>

function calcRSI(values,p=14){
 if(!Array.isArray(values)||values.length<p+1)return null;
 let g=0,l=0;
 for(let i=values.length-p;i<values.length;i++){const d=values[i]-values[i-1]; if(d>=0)g+=d; else l-=d}
 if(l===0)return 100;
 const rs=(g/p)/(l/p); return 100-(100/(1+rs));
}
function calcVWAP(klines){

 (klines||[]).forEach(k=>{const h=+k[2],l=+k[3],c=+k[4],vol=+k[5],tp=(h+l+c)/3;pv+=tp*vol;v+=vol});
 return v?pv/v:null;
}

/* v5.24.1 — BREAK-EVEN PROTECTION
   A valid protective SL neutralizes the bot as a primary capital-loss blocker.
   LONG: live > BE and SL >= BE and SL < live.
   SHORT: live < BE and SL <= BE and SL > live.
   SL must also sit before liquidation. Residual execution/slippage risk remains. */
function breakEvenProtectionState(bot){
 if(!bot)return {active:false,label:'UNPROTECTED',reason:'Kein Bot'};
 const side=String(bot.side||'').toUpperCase();
 const live=Number(bot.live ?? DATA.livePrices?.[bot.symbol]?.price ?? bot.currentPrice);
 const be=Number(bot.breakEven);
 const sl=Number(bot.stopLoss ?? bot.sl);
 const liq=Number(bot.liquidation ?? bot.liquidationPrice);
 if(![live,be,sl].every(Number.isFinite) || live<=0 || be<=0 || sl<=0){
   return {active:false,label:'UNPROTECTED',reason:'SL/BE nicht vollständig verifiziert',side,live,be,sl,liq};
 }
 let active=false, favorable=false, stopBeforeLiq=true;
 if(side==='LONG'){
   favorable=live>be;
   stopBeforeLiq=!Number.isFinite(liq) || sl>liq;
   active=favorable && sl>=be && sl<live && stopBeforeLiq;
 }else if(side==='SHORT'){
   favorable=live<be;
   stopBeforeLiq=!Number.isFinite(liq) || sl<liq;
   active=favorable && sl<=be && sl>live && stopBeforeLiq;
 }
 const cushionPct=be>0 ? (side==='SHORT' ? (be-sl)/be*100 : (sl-be)/be*100) : NaN;
 return {
   active,
   label:active?'BE PROTECTED':'UNPROTECTED',
   side,live,be,sl,liq,favorable,stopBeforeLiq,cushionPct,
   reason:active
     ? `SL schützt Break-even (${side==='LONG'?'SL ≥ BE':'SL ≤ BE'}). Primäres Kapitalverlustrisiko dieses Bots wird nicht mehr als CRITICAL/DANGER-Block gewertet; Rest-Risiko: Slippage/Fees/Gap/Execution.`
     : 'Kein gültiger Break-even-Schutz aktiv.'
 };
}

function canonicalBotState(b){
 if(!b)return null;
 const liquidation=Number(b.liquidationPrice??b.liquidation);

  // 1) Existing BTC short: never suggest adding risk when the position is already critically stressed.
  if(critical && critical.symbol==='BTC'){
    push(1,'red','BTC SHORT','FREEZE / LIQ-DATEN PRÜFEN',

  if(xrp){

      `Bestehenden Bot halten${Number.isFinite(lp)?`; Liq.-Puffer ${fmt(lp,1)}%`:''}. Für neuen Bot auf Retracement warten.`,
      82,'Pionex Snapshot');
  }

  // 4) Day trade gate.
  const gate=Number(d.gateScore)||0;
  if(gate < 70){
    push(2,'amber','DAY-TRADE','BLOCKED',
      `Gate ${gate}/100. Keine neue Intraday-Position, bis die technische Konfluenz ≥70 erreicht.`,
      Math.max(70,100-gate/2),'Live Technik');
  } else {
    push(4,'green','DAY-TRADE','READY / MANUELL PRÜFEN',
      `Gate ${gate}/100. Setup technisch freigegeben; Ausführung bleibt manuell.`,
      gate,'Live Technik');
  }

  // 5) Spot / portfolio risk.
  if(risk.score >= 80){
    push(2,'red','SPOT / PORTFOLIO','KEINE NEUEN KÄUFE',
      `MERIDIAN Risk ${risk.score}/100. Bestehende Positionen nicht aggressiv ausbauen; Kapitalreserve priorisieren.`,
      Math.min(96,risk.score+7),'Cross-Risk');
  } else if(risk.score >= 70){
    push(4,'amber','SPOT / PORTFOLIO','WATCH',
      `MERIDIAN Risk ${risk.score}/100. Nur selektiv und klein aufstocken.`,
      risk.score,'Cross-Risk');
  }

  // 6) Market regime informs, but does not override the concrete risk actions above.
  const reg=(DATA.btcRegime&&DATA.btcRegime.label)||(DATA.market&&DATA.market.regime)||'—';
  if((reg||'').includes('SHORT-SQUEEZE')){
    push(5,'cyan','MARKTREGIME','RISK-ON, ABER NICHT JAGEN',
      'Momentum bleibt positiv, gleichzeitig ist das Setup nach dem Squeeze überdehnungsgefährdet.',
      Number(DATA.btcRegime&&DATA.btcRegime.score)||76,'Regime Model');
  }

  // De-duplicate by target, keeping the highest-priority action.
  const seen=new Set();
  const queue=items.sort((a,b)=>a.priority-b.priority||b.confidence-a.confidence).filter(x=>{
    if(seen.has(x.target)) return false;
    seen.add(x.target); return true;
  }).slice(0,6);

  const central = risk.score>=80 ? 'RISIKO NICHT ERHÖHEN'
    : gate<70 ? 'WARTEN / KEIN NEUER TRADE'
    : c.headline;
  const centralTone = risk.score>=80 ? 'red' : gate<70 ? 'amber' : ({REDUCE:'red',WATCH:'amber',ADD:'green',HOLD:'cyan'}[c.posture]||'cyan');
  const centralScore = Math.max(c.score||0, risk.score>=80?88:0, gate<70?76:0);

  return {central,centralTone,centralScore,queue,risk:risk.score,gate};
 }catch(e){
  console.warn('Action Engine isolated',e);
  return {central:'DATEN PRÜFEN',centralTone:'amber',centralScore:40,queue:[],risk:0,gate:0};
 }

function exactRiskSolver(){
 const opt=recoveryOptimizerState();
 const bot=opt?.bot||null;
 const live=Number(DATA.livePrices?.BTC?.price);
 const liq=Number(bot?.liquidationPrice ?? bot?.liquidation);
 const side=String(bot?.side||'SHORT').toUpperCase();
 const gate=8.0;

 let buffer=NaN;
 if(Number.isFinite(live)&&live>0&&Number.isFinite(liq)&&liq>0){
   buffer=Math.max(0,side==='SHORT'?((liq-live)/live*100):((live-liq)/live*100));
 } else if(Number.isFinite(Number(bot?.buffer))){
   buffer=Number(bot.buffer);
 }

 const gap=Number.isFinite(buffer)?Math.max(0,gate-buffer):NaN;

 // Model response inferred from the current optimizer's 3%-point recommendation.
 // This lets MERIDIAN estimate the smallest percentage-point exposure reduction
 // required to cross the gate, instead of always surfacing the coarse 3% step.
 const coarse=opt?.best8||null;
 let sensitivity=NaN;
 if(coarse?.mode==='reduce' && Number.isFinite(Number(coarse.value)) && Number(coarse.value)>0 &&
    Number.isFinite(Number(coarse.after)) && Number.isFinite(buffer)){
   sensitivity=(Number(coarse.after)-buffer)/Number(coarse.value);
 }

 let exactExposure=NaN;
 if(Number.isFinite(gap) && gap<=0){
   exactExposure=0;
 } else if(Number.isFinite(gap) && Number.isFinite(sensitivity) && sensitivity>0){
   exactExposure=gap/sensitivity;
 }

 // Practical rounded recommendation: 0.5 %-point increments, capped at 10.
 let roundedExposure=Number.isFinite(exactExposure)?Math.min(10,Math.ceil(exactExposure*2)/2):NaN;
 let projectedBuffer=Number.isFinite(roundedExposure)&&Number.isFinite(sensitivity)&&Number.isFinite(buffer)
   ? buffer + roundedExposure*sensitivity
   : NaN;

 // Margin and leverage alternatives stay model-estimates if optimizer exposes them.
 const routes=(opt?.routes8||opt?.routes||[]).map(x=>({
   mode:x.mode,
   value:Number(x.value),
   after:Number(x.after),
   label:recoveryActionLabel(x)
 })).filter(x=>Number.isFinite(x.after));

 const candidates=[];
 if(Number.isFinite(roundedExposure)){
   candidates.push({
     mode:'reduce',
     value:roundedExposure,
     after:projectedBuffer,
     label:`BOT-EXPOSURE −${fmt(roundedExposure,1)} %-PUNKTE`,
     estimated:true
   });
 }
 for(const x of routes){
   candidates.push({...x,estimated:true});
 }
 candidates.sort((a,b)=>{
   const aOk=a.after>=gate?0:1, bOk=b.after>=gate?0:1;
   if(aOk!==bOk)return aOk-bOk;
   const cost = r => r.mode==='reduce'?Math.abs(r.value):r.mode==='margin'?Math.abs(r.value)/100:r.mode==='leverage'?Math.abs(r.value):999;
   return cost(a)-cost(b);
 });
 const best=candidates.find(x=>x.after>=gate)||candidates[0]||null;

 return {
   live,liq,side,gate,buffer,gap,
   sensitivity,exactExposure,roundedExposure,projectedBuffer,
   best,candidates
 };
}

function currentBtcRiskSnapshot(){
  const cfg=btcRiskConfig();
  const quote=DATA?.livePrices?.BTC;
  const live=Number(quote?.price);
  const qStatus=quoteStatus(quote);
  const qAge=quote?.updatedAt?Math.max(0,Math.round((Date.now()-quote.updatedAt)/1000)):null;
  const dataOk=qStatus==='LIVE' && Number.isFinite(live) && live>0;
  const gate=Number(cfg.gate)||8.0;

  const calc=(b)=>{
    let liveEstimate=NaN, distance=NaN, safeBtc=NaN;
    const liq=Number(b.liq);
    if(dataOk&&Number.isFinite(liq)&&liq>0){
      distance=Math.abs(liq-live);
      liveEstimate=b.side==='SHORT'?((liq-live)/live*100):((live-liq)/live*100);
      safeBtc=b.side==='SHORT'?liq/(1+gate/100):liq/(1-gate/100);
    }
    // SSOT rule: Pionex displayed/verified buffer wins. Live calculation is diagnostic only.
    const verified=Number(b.verifiedBuffer);
    const effectiveBuffer=Number.isFinite(verified)?verified:liveEstimate;
    const reserve=Number.isFinite(effectiveBuffer)?effectiveBuffer-gate:NaN;
    const protectedBot=!!b.beProtected;
    const riskBand=protectedBot?'PROTECTED':!Number.isFinite(effectiveBuffer)?'UNKNOWN':
      effectiveBuffer<6?'DANGER':effectiveBuffer<gate?'CRITICAL':effectiveBuffer<10?'WATCH':'SAFE';
    const tone=protectedBot?'green':riskBand==='SAFE'?'green':riskBand==='WATCH'?'amber':riskBand==='UNKNOWN'?'muted':'red';
    return {
      ...b,liq,liveEstimate,effectiveBuffer,distance,safeBtc,reserve,
      band:riskBand,riskBand,tone,dataOk,beProtected:protectedBot,
      ok:protectedBot || (Number.isFinite(effectiveBuffer)&&effectiveBuffer>=gate),
      source:Number.isFinite(verified)?'PIONEX VERIFIED':'LIVE ESTIMATE'
    };
  };

  const short=calc(cfg.short), long=calc(cfg.long);
  const blockers=[short,long].filter(b=>!b.beProtected);
  const limiting=(blockers.length?blockers:[short,long]).slice()
    .sort((a,b)=>(a.effectiveBuffer??999)-(b.effectiveBuffer??999))[0]||short;
  const open=blockers.every(b=>b.ok);
  return {
    live,gate,short,long,limiting,open,dataOk,
    quoteStatus:qStatus,quoteAge:qAge,
    dataState:dataOk?'LIVE':'DATA BLOCK',
    status:open?'RISK OPEN':'RISK BLOCKED',
    portfolioLevel:DATA.futuresRiskIntelligence?.portfolio?.level||'ELEVATED'
  };
}

function cloudBackendFresh(){
  const c=(typeof MERIDIAN_CLOUD!=='undefined'&&MERIDIAN_CLOUD)?MERIDIAN_CLOUD:(window.MERIDIAN_CLOUD||{});
  const p=c.paper||{};
  const st=(c.status && typeof c.status==='object')?c.status:{};
  const eng=(st.engine && typeof st.engine==='object')?st.engine:{};

  function evalEngine(e,source,maxAge){
    if(!e||typeof e!=='object')return null;
    const times=[e.lastCycleAt,e.lastGoodMarketAt,e.lastSignalScanAt];
    let newest=0;
    times.forEach(v=>{const t=typeof v==='number'?v:Date.parse(v||'');if(Number.isFinite(t))newest=Math.max(newest,t)});
    const age=newest?Math.max(0,Math.round((Date.now()-newest)/1000)):null;
    const status=String(e.state||'CLOUD').toUpperCase();
    const running=(e.running===true || /RUNNING|LIVE|OK|HEALTHY|READY/.test(status));
    const fresh=Number.isFinite(age)&&age<=maxAge;
    const marketOk=e.marketFresh!==false;
    return {ok:running&&fresh&&marketOk,age,status,source,engineRunning:running,marketFresh:e.marketFresh===true};
  }

  // 1) Direct Northflank API is authoritative when browser can reach it.
  const direct=evalEngine(eng,'ENGINE DIRECT',120);
  if(direct&&direct.ok)return direct;

  // 2) Read-only GitHub telemetry mirror. Schedule is ~5 min, so allow 7 min.
  const mirror=evalEngine(c.mirrorStatus,'ENGINE MIRROR',420);
  if(mirror&&mirror.ok)return mirror;

  // Preserve diagnostic detail instead of pretending LIVE.
  if(direct)return direct;
  if(mirror)return mirror;
  return {ok:false,age:null,status:'CLOUD',source:'CLOUD CACHE',engineRunning:false,marketFresh:false};
}

function portfolioIntelligenceState(){
 const p=DATA.portfolio||{}, holdings=p.holdings||[], grouped={};
 holdings.forEach(h=>{
   const sym=String(h.symbol||'').toUpperCase();
   if(!sym)return;
   grouped[sym]=(grouped[sym]||0)+Number(h.quantity||0);
 });

 const alt=DATA.altRotation?.coins||{}, fall=DATA.priceFallbacks||{};
 const topMap=Object.fromEntries((p.topPositions||[]).map(x=>[x.symbol,x]));
 const betaMult=beta=>{
   beta=String(beta||'').toUpperCase();
   if(beta.includes('VERY HIGH'))return {bear:1.10,base:2.60,bull:4.50};
   if(beta.includes('HIGH'))return {bear:1.08,base:2.20,bull:3.60};
   if(beta.includes('MEDIUM'))return {bear:1.05,base:1.80,bull:2.80};
   return {bear:1.03,base:1.55,bull:2.20};
 };

 const positions=Object.entries(grouped).map(([sym,qty])=>{
   const q=DATA.livePrices?.[sym], top=topMap[sym], fb=fall?.[sym];
   const px=Number(q?.price??top?.price??fb?.price??0);
   const current=px>0?qty*px:Number(top?.value||0);
   let mult=betaMult(alt?.[sym]?.beta|| (sym==='BTC'?'BASE':'MEDIUM'));
   // BTC uses the macro cycle zones when available, otherwise conservative multiples.
   if(sym==='BTC'){
     const z=DATA.macroForecast?.btcZones||{};
     if(px>0&&z.base?.low&&z.base?.high){
       mult={
         bear:(((Number(z.bear?.low||px)+Number(z.bear?.high||px))/2)/px),
         base:(((Number(z.base.low)+Number(z.base.high))/2)/px),
         bull:(((Number(z.bull?.low||z.base.high)+Number(z.bull?.high||z.base.high))/2)/px)
       };
     }
   }
   let f=null, fs=null, exit=null;
   try{f=forecast(sym); if(f?.ready){fs=forecastState(f);exit=cycle40Exit(sym,f,fs)}}catch(e){}
   let action='HOLD', tone='green', reason='Kein bestätigtes Exit-Signal';
   if(exit?.cycleGate && exit.cycleRisk>=78){action='REDUCE';tone='red';reason=`Cycle Exit ${exit.cycleRisk}/100`}
   else if(exit?.cycleRisk>=52){action='WATCH / TRIM';tone='amber';reason=`Exit Risk ${exit.cycleRisk}/100`}
   else if(fs?.label==='DISTRIBUTION RISK'){action='WATCH';tone='amber';reason='Lokales Distribution-Risiko'}
   return {
     sym,qty,px,current,mult,action,tone,reason,
     bear:current*mult.bear,base:current*mult.base,bull:current*mult.bull,
     peak:alt?.[sym]?.peakWindow||(sym==='BTC'?`${DATA.macroForecast?.peakWindow?.from||'2029 Q2'}–${DATA.macroForecast?.peakWindow?.to||'2030 Q1'}`:'MODEL')
   };
 }).filter(x=>x.current>0).sort((a,b)=>b.current-a.current);

 const modeledNow=positions.reduce((s,x)=>s+x.current,0);
 const fixed=Math.max(0,Number(p.total||0)-modeledNow);
 const bear=fixed+positions.reduce((s,x)=>s+x.bear,0);
 const base=fixed+positions.reduce((s,x)=>s+x.base,0);
 const bull=fixed+positions.reduce((s,x)=>s+x.bull,0);
 const gate=executionReadinessState();
 const weakest=canonicalBotStates().filter(b=>!b.beProtected).sort((a,b)=>Number(a.buffer)-Number(b.buffer))[0];
 let oneAction='HOLD · KEIN NEUES RISIKO', oneTone='amber';
 if(gate?.open){oneAction='RISK OPEN · BESTES SETUP PRÜFEN';oneTone='green'}
 else if(weakest&&Number(weakest.buffer)<8){oneAction=`${weakest.id} ZUERST ≥8% BUFFER`;oneTone='red'}
 const reduce=positions.filter(x=>x.action==='REDUCE').length;
 if(reduce>0){oneAction=`${reduce} SPOT-EXIT${reduce>1?'S':''} PRÜFEN · KEIN ADD`;oneTone='red'}
 return {positions,modeledNow,fixed,bear,base,bull,oneAction,oneTone};
}

function currentNadirContext(){
 const n=DATA.nadir||{}, c=n.currentVerifiedContext||{}, q=DATA.livePrices?.BTC||{};
 const fg=Number(c.fearGreed), mom=Number(c.btc7dPct), dom=Number(c.btcDominancePct);
 let score=10;

 if(Number.isFinite(mom)) score+=Math.max(0,-mom)*2.2;

 score=Math.max(0,Math.min(100,Math.round(score)));
 let label='NEUTRAL / KEIN NADIR';
 let cls='amber';
 if(score>=70){label='KAPITULATIONS-NÄHE';cls='green'}

 if(Number.isFinite(fg))drivers.push(`Fear & Greed ${fg}`);

 return {score,label,cls,drivers,btc:q.price||c.btcPrice||0};
}

function executionReadinessState(){
 const d=DATA.dayTrade||{}, cap=capitalReleaseState();
 const technicalScore=Number(d.gateScore||0);
 const technicalOpen=technicalScore>=70 && !!d.entryAllowed;
 const riskOpen=!cap.blocked && Number(cap.newRiskCapacity||0)>0;
 const open=technicalOpen && riskOpen;
 let state='NO EXECUTION', cls='red', reason='Technisches Setup oder Portfolio-Gate blockiert.';
 if(technicalOpen && !riskOpen){
   state='SETUP READY · RISK BLOCK';
   cls='amber';
   reason='Technischer Entry ist bestätigt, aber neues Risikokapital ist noch nicht freigegeben.';
 } else if(!technicalOpen && riskOpen){
   state='RISK OPEN · WAIT SIGNAL';
   cls='amber';
   reason='Kapital wäre verfügbar, der technische Trigger ist noch nicht bestätigt.';
 } else if(open){
   state='EXECUTION READY';
   cls='green';
   reason='Technical Gate und Portfolio Risk Gate sind gleichzeitig offen.';
 }
 return {technicalScore,technicalOpen,riskOpen,open,state,cls,reason,cap};
}
function executionPlanFor(sym){
 const g=fibFromSwing(sym);
 if(!g)return null;
 const px=Number(g.px), low=Number(g.entryLow), high=Number(g.entryHigh);
 if(!Number.isFinite(px)||!Number.isFinite(low)||!Number.isFinite(high)||px<=0||low<=0||high<=0||high<low)return null;
 const entry=(low+high)/2;
 const stop=Number(g.rangeLow||entry*0.97);
 if(!Number.isFinite(stop)||stop<=0||stop>=entry)return null;
 const risk=Math.max(entry-stop,entry*0.002);
 const tp1=entry+risk*2, tp2=entry+risk*2.5;
 const rawTp3=Number(g.hi);
 const tp3=Number.isFinite(rawTp3)&&rawTp3>entry?rawTp3:entry+risk*3;
 const rr=(tp3-entry)/risk;
 const p={sym,px,low,high,entry,stop,tp1,tp2,tp3,rr,source:g.source||'—'};
 return validExecutionPlan(p)?p:null;
}

/* v5.39.0 — CENTER → GRID EXECUTION BRIDGE
   SSOT rule: no actionable plan until Technical Gate AND Portfolio Risk Gate are OPEN.
   When 2/2 OPEN, the best ranked READY candidate becomes the active execution plan. */
function executionBridgeState(){
 const gate=executionReadinessState();
 const rank=watchlistPriorityRank();
 const preferred=rank.find(r=>r.w?.label==='READY WHEN UNLOCKED' && validExecutionPlan(executionPlanFor(r.sym)))
   || rank.find(r=>validExecutionPlan(executionPlanFor(r.sym))) || null;
 const plan=preferred?executionPlanFor(preferred.sym):null;
 const maxRisk=gate.open?Math.max(0,Number(gate.cap?.newRiskCapacity||0)):0;
 const riskPerUnit=plan?Math.max(0,Number(plan.entry)-Number(plan.stop)):0;
 const riskPct=plan&&plan.entry>0?(riskPerUnit/plan.entry)*100:0;
 const maxNotional=(gate.open&&plan&&riskPct>0)?maxRisk/(riskPct/100):0;
 const status=!plan?'NO PLAN':gate.open?'ARMED':'STANDBY';
 const tone=!plan?'red':gate.open?'green':'amber';
 const reason=!plan?'Kein gültiger GRID/FIB-Plan verfügbar.':
   gate.open?'2/2 Gates OPEN · bester freigegebener Plan ist handlungsbereit.':
   gate.technicalOpen?'Technisches Setup bereit · Portfolio-Risk-Gate blockiert noch.':
   gate.riskOpen?'Risikokapital frei · technischer Trigger fehlt noch.':
   'Beide Gates müssen gleichzeitig OPEN sein.';
 return {gate,rank,preferred,plan,maxRisk,riskPct,maxNotional,status,tone,reason};
}

function paperObsEnsure(s){
  s.observability=s.observability||{};
  const o=s.observability;
  if(!Number.isFinite(Number(o.totalScans)))o.totalScans=0;
  if(!Number.isFinite(Number(o.noSetupScans)))o.noSetupScans=0;
  if(!Number.isFinite(Number(o.entryReadyScans)))o.entryReadyScans=0;
  if(!Number.isFinite(Number(o.waitZoneScans)))o.waitZoneScans=0;
  if(!Number.isFinite(Number(o.techBlockScans)))o.techBlockScans=0;
  if(!Number.isFinite(Number(o.riskBlockScans)))o.riskBlockScans=0;
  if(!Array.isArray(o.minuteBuckets))o.minuteBuckets=[];
  if(!Array.isArray(o.transitions))o.transitions=[];
  if(!o.stateCounts||typeof o.stateCounts!=='object')o.stateCounts={};
  return o;
}

function paperDecisionState(x){
  if(!x)return 'NO_SETUP';
  if(!x.levelsValid)return 'DATA_INVALID';
  if(!x.techOpen)return 'TECH_BLOCK';
  if(!x.paperRiskOpen)return 'PAPER_RISK_BLOCK';
  if(!x.inZone)return 'WAIT_ZONE';
  if(x.allowed)return 'ENTRY_READY';
  return 'NO_ENTRY';
}

function paperRecordTransition(s,entity,key,from,to,meta={}){
  if(!from||!to||from===to)return;
  const o=paperObsEnsure(s);
  o.transitions.unshift({
    at:new Date().toISOString(),
    entity:String(entity||'ENGINE'),
    key:String(key||''),
    from:String(from),
    to:String(to),
    ...meta
  });
  o.transitions=o.transitions.slice(0,160);
}

function paperRecordScan(s,signals){
  const o=paperObsEnsure(s), now=new Date(), iso=now.toISOString();
  const states=(signals||[]).map(x=>paperDecisionState(x));
  const result=states.includes('ENTRY_READY')?'ENTRY_READY':
    states.includes('PAPER_RISK_BLOCK')?'PAPER_RISK_BLOCK':
    states.includes('WAIT_ZONE')?'WAIT_ZONE':
    states.includes('TECH_BLOCK')?'TECH_BLOCK':
    states.includes('DATA_INVALID')?'DATA_INVALID':
    (signals||[]).length?'NO_ENTRY':'NO_SETUP';

  const prior=o.lastResult||null;
  o.totalScans++;
  o.lastScanAt=iso;
  o.lastResult=result;
  o.lastSignalCount=(signals||[]).length;
  o.stateCounts[result]=Number(o.stateCounts[result]||0)+1;
  if(result==='NO_SETUP'){o.noSetupScans++;o.lastNoSetupAt=iso}
  if(result==='ENTRY_READY')o.entryReadyScans++;
  if(result==='WAIT_ZONE')o.waitZoneScans++;
  if(result==='TECH_BLOCK')o.techBlockScans++;
  if(result==='PAPER_RISK_BLOCK')o.riskBlockScans++;

  // Minute ledger: proves the engine was running without exploding localStorage.
  const minute=iso.slice(0,16);
  let b=o.minuteBuckets[0];
  if(!b||b.minute!==minute){
    b={minute,scans:0,noSetup:0,entryReady:0,waitZone:0,techBlock:0,riskBlock:0,signalsMax:0,lastResult:result};
    o.minuteBuckets.unshift(b);
    o.minuteBuckets=o.minuteBuckets.slice(0,1440); // up to 24h minute-level history
  }
  b.scans++;
  b.lastResult=result;
  b.signalsMax=Math.max(Number(b.signalsMax||0),(signals||[]).length);
  if(result==='NO_SETUP')b.noSetup++;
  if(result==='ENTRY_READY')b.entryReady++;
  if(result==='WAIT_ZONE')b.waitZone++;
  if(result==='TECH_BLOCK')b.techBlock++;
  if(result==='PAPER_RISK_BLOCK')b.riskBlock++;

  if(prior&&prior!==result)paperRecordTransition(s,'ENGINE','SCAN',prior,result,{signals:(signals||[]).length});
  return result;
}

function paperCoverageSummary(s){
  const o=paperObsEnsure(s), rows=o.minuteBuckets||[];
  const latest=rows[0];
  const oldest=rows[rows.length-1];
  const mins=rows.length;
  const total=rows.reduce((a,b)=>a+Number(b.scans||0),0);
  const noSetup=rows.reduce((a,b)=>a+Number(b.noSetup||0),0);
  const active=rows.filter(b=>Number(b.scans||0)>0).length;
  return {
    minutesTracked:mins,
    activeMinutes:active,
    totalScans:total,
    noSetupScans:noSetup,
    latest:latest?.minute||null,
    oldest:oldest?.minute||null,
    coveragePct:mins?active/mins*100:0
  };
}

const PAPER_RUNNER_CFG_KEY='meridian_paper_runner_cfg_v1';
let PAPER_RUNNER_SYNC_BUSY=false;
let PAPER_RUNNER_LAST_STATUS=null;

function paperRunnerConfig(){
  try{
    const x=JSON.parse(localStorage.getItem(PAPER_RUNNER_CFG_KEY)||'null');
    if(x&&typeof x==='object')return {
      enabled:!!x.enabled,
      url:String(x.url||'').replace(/\/+$/,''),
      token:String(x.token||''),
      autoSync:x.autoSync!==false
    };
  }catch(e){}
  return {enabled:false,url:'',token:'',autoSync:true};
}
function paperRunnerSaveConfig(x){

    url:String(x?.url||'').trim().replace(/\/+$/,''),
    token:String(x?.token||'').trim(),
    autoSync:x?.autoSync!==false
  };

function paperRunnerHeaders(cfg,withJson=false){
  const h={};
  if(cfg?.token)h['Authorization']='Bearer '+cfg.token;
  if(withJson)h['Content-Type']='application/json';
  return h;
}
async function paperRunnerRequest(path,opts={}){
  const cfg=paperRunnerConfig();
  if(!cfg.enabled||!cfg.url)throw new Error('RUNNER NOT CONFIGURED');
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(),12000);
  try{
    const r=await fetch(cfg.url+path,{
      method:opts.method||'GET',
      headers:{...paperRunnerHeaders(cfg,!!opts.body),...(opts.headers||{})},
      body:opts.body?JSON.stringify(opts.body):undefined,
      cache:'no-store',
      signal:ctrl.signal
    });
    if(!r.ok)throw new Error('HTTP '+r.status);
    return await r.json();
  }finally{clearTimeout(timer)}
}
function paperRunnerStateClock(s){
  const t=new Date(s?.lastSavedAt||s?.createdAt||0).getTime();
  return Number.isFinite(t)?t:0;
}
function paperRunnerRichness(s){
  return ((s?.trades||[]).length*1000)+((s?.open||[]).length*1000)+Object.keys(s?.candidateHistory||{}).length+(s?.shadow||[]).length;
}
async function paperRunnerStatus(refresh=true){

    return PAPER_RUNNER_LAST_STATUS;

  if(!refresh&&PAPER_RUNNER_LAST_STATUS)return PAPER_RUNNER_LAST_STATUS;

  }catch(e){

async function paperRunnerPushState(reason='MANUAL'){

async function paperRunnerPullState(force=false){
  const cfg=paperRunnerConfig();
  if(!cfg.enabled||!cfg.url)return {ok:false,reason:'DISABLED'};
  const remote=await paperRunnerRequest('/api/state');
  const rs=remote?.state;
  if(!rs||typeof rs!=='object')return {ok:false,reason:'NO_REMOTE_STATE'};
  const local=paperState();
  const rc=paperRunnerStateClock(rs),lc=paperRunnerStateClock(local);
  const remoteR=paperRunnerRichness(rs),localR=paperRunnerRichness(local);
  const shouldPull=force || rc>lc+2000 || remoteR>localR;
  if(!shouldPull)return {ok:true,changed:false,remoteClock:rc,localClock:lc};

  const migrated=paperMigrateState(rs);
  migrated.runnerSyncedAt=new Date().toISOString();
  migrated.runnerSource='24X7';
  paperBackupState(migrated);
  localStorage.setItem('meridian_paper_v1',JSON.stringify(migrated));
  paperEvent('RUNNER_PULL',{stateId:paperStateId(migrated),force});
  try{renderOne('daytrade')}catch(e){}
  return {ok:true,changed:true,stateId:paperStateId(migrated)};

async function paperRunnerAutoSync(){
  if(PAPER_RUNNER_SYNC_BUSY)return;
  const cfg=paperRunnerConfig();
  if(!cfg.enabled||!cfg.autoSync||!cfg.url||document.visibilityState!=='visible')return;
  PAPER_RUNNER_SYNC_BUSY=true;
  try{
    const st=await paperRunnerStatus(true);
    if(!st.connected)return;
    const remote=await paperRunnerRequest('/api/state');
    const rs=remote?.state;
    const local=paperState();

    if(!rs||typeof rs!=='object'||paperRunnerRichness(rs)===0){
      if(paperRunnerRichness(local)>0)await paperRunnerPushState('INITIAL_SEED');
      return;
    }

    const rc=paperRunnerStateClock(rs),lc=paperRunnerStateClock(local);
    if(rc>lc+2000 || paperRunnerRichness(rs)>paperRunnerRichness(local)){
      await paperRunnerPullState(true);
    }else if(lc>rc+5000){
      await paperRunnerPushState('LOCAL_NEWER');
    }
  }catch(e){
    PAPER_RUNNER_LAST_STATUS={connected:false,state:'OFFLINE',error:String(e?.message||e),ts:Date.now()};
  }finally{
    PAPER_RUNNER_SYNC_BUSY=false;
  }
}

function paperEngineMeta(s){
  s.engine=s.engine||{};
  if(!Number.isFinite(Number(s.engine.lastEvalMs))) s.engine.lastEvalMs=Date.now();
  if(!Number.isFinite(Number(s.engine.lastReplayMs))) s.engine.lastReplayMs=0;

  if(!s.engine.coverage) s.engine.coverage='LIVE';
  if(!Number.isFinite(Number(s.engine.candidateReplayTtlMin))) s.engine.candidateReplayTtlMin=90;

async function paperFetchReplayKlines(sym,startMs,endMs){
  const pair=String(sym||'').toUpperCase()+'USDT';
  if(!/^[A-Z0-9]{4,20}USDT$/.test(pair))return [];
  const start=Math.max(0,Number(startMs)||0);
  const end=Math.max(start,Number(endMs)||Date.now());
  const url=`https://api.binance.com/api/v3/klines?symbol=${pair}&interval=5m&startTime=${start}&endTime=${end}&limit=1000`;
  try{
    const j=await fetchJSON(url,12000);
    if(!Array.isArray(j))return [];
    return j.map(k=>({
      t:Number(k[0]),o:Number(k[1]),h:Number(k[2]),l:Number(k[3]),c:Number(k[4]),end:Number(k[6])
    })).filter(k=>[k.t,k.o,k.h,k.l,k.c].every(Number.isFinite));
  }catch(e){
    return [];
  }
}

function paperReplayEntryPrice(h,candle){
  const lo=Math.min(Number(h.entryLow),Number(h.entryHigh));
  const hi=Math.max(Number(h.entryLow),Number(h.entryHigh));
  if(!(Number.isFinite(lo)&&Number.isFinite(hi)))return NaN;
  if(candle.o>=lo&&candle.o<=hi)return candle.o;
  if(candle.o>hi&&candle.l<=hi)return hi;
  if(candle.o<lo&&candle.h>=lo)return lo;
  return Math.min(hi,Math.max(lo,candle.c));
}

function paperReplayOpenFromHistory(s,h,candle){
  const x={
    sym:h.sym,side:(h.side||'LONG').toUpperCase(),
    entryLow:Number(h.entryLow),entryHigh:Number(h.entryHigh),
    stop:Number(h.stop),tp1:Number(h.tp1),tp2:Number(h.tp2),
    rr:Number(h.rr||0),gateScore:Number(h.gateScore||0),
    candidateScore:Number(h.candidateScore||0),
    live:paperReplayEntryPrice(h,candle),levelsValid:true,techOpen:true,inZone:true,
    paperRiskOpen:true,reason:'OVERNIGHT REPLAY',sourceMode:'PAPER_OVERNIGHT_REPLAY'
  };
  if(!paperLevelsValid(x)||!Number.isFinite(x.live))return false;
  const pg=paperRiskGate(s,x);
  if(!pg.open)return false;
  const ok=paperOpenSignal(s,x);
  if(ok){
    const pos=s.open[0];
    if(pos){
      pos.openedAt=new Date(candle.t).toISOString();
      pos.zoneTouchedAt=pos.openedAt;
      pos.signalReason='OVERNIGHT REPLAY';
      pos.replayRecovered=true;
    }
  }
  return ok;
}

function paperReplayOpenPositionOnCandle(s,t,candle){
  const idx=s.open.findIndex(x=>x.id===t.id);
  if(idx<0)return 0;
  const long=t.side!=='SHORT';
  const hitSL=long?candle.l<=t.stop:candle.h>=t.stop;
  const hitTP2=long?candle.h>=t.tp2:candle.l<=t.tp2;
  const hitTP1=long?candle.h>=t.tp1:candle.l<=t.tp1;

  // Conservative intrabar rule: when ordering is unknowable inside one 5m candle,
  // SL wins over TP. This prevents optimistic hindsight.
  if(hitSL){
    paperCloseInState(s,idx,t.stop,'SL');
    const last=s.trades?.[0]; if(last){last.replayRecovered=true;last.intrabarPolicy='SL_FIRST_CONSERVATIVE';}
    return 1;
  }
  if(hitTP2){
    paperCloseInState(s,idx,t.tp2,'TP2');
    const last=s.trades?.[0]; if(last){last.replayRecovered=true;last.intrabarPolicy='SL_FIRST_CONSERVATIVE';}
    return 1;
  }
  if(hitTP1&&!t.tp1PartialDone){
    paperPartialTp1(s,idx,t.tp1);
    const p=s.open.find(x=>x.id===t.id); if(p)p.replayRecovered=true;
    return 1;
  }
  return 0;
}

async function paperOvernightReplay(force=false){
  const s=paperState(),meta=paperEngineMeta(s);
  const now=Date.now();
  const last=Number(meta.lastEvalMs||now);
  const gapMs=Math.max(0,now-last);

  if(!force && gapMs<30000){
    meta.lastEvalMs=now;
    meta.coverage='LIVE';
    savePaperState(s);
    return {status:'LIVE',gapMs,recoveredBars:0,recoveredEvents:0};
  }

  // Max 24h replay per resume to keep iPhone work bounded.
  const start=Math.max(last,now-24*3600*1000);
  const symbols=new Set((s.open||[]).map(t=>t.sym));

  // Only candidates actually observed before suspension are eligible.
  // Unseen signals are never invented after the fact.
  const ttlMin=Number(meta.candidateReplayTtlMin||90);
  const histories=Object.values(s.candidateHistory||{}).filter(h=>{
    if(!h?.sym||!h?.lastSeenAt)return false;
    const seen=new Date(h.lastSeenAt).getTime();
    const tech=Number(h.gateScore||0)>=70 && Number(h.candidateScore||0)>=Number(s.minCandidateScore||60);
    return tech && seen<=now && (seen + ttlMin*60000)>=start;
  });
  histories.forEach(h=>symbols.add(h.sym));

  let recoveredBars=0,recoveredEvents=0,fetchFailures=0;

  for(const sym of symbols){
    const bars=await paperFetchReplayKlines(sym,start,now);
    if(!bars.length){fetchFailures++;continue}
    recoveredBars+=bars.length;

    // Reconstruct only previously observed candidate windows.
    const eligible=histories.filter(h=>h.sym===sym);
    for(const h of eligible){
      if((s.open||[]).some(t=>t.sym===h.sym&&t.side===h.side))continue;
      const firstSeen=new Date(h.lastSeenAt||h.firstSeenAt||start).getTime();
      const validUntil=firstSeen+ttlMin*60000;
      const hit=bars.find(c=>{
        if(c.t<Math.max(start,firstSeen)||c.t>validUntil)return false;
        const lo=Math.min(Number(h.entryLow),Number(h.entryHigh));
        const hi=Math.max(Number(h.entryLow),Number(h.entryHigh));
        return Number.isFinite(lo)&&Number.isFinite(hi)&&c.l<=hi&&c.h>=lo;
      });
      if(hit && paperReplayOpenFromHistory(s,h,hit)){
        recoveredEvents++;
        h.zoneTouchedAt=h.zoneTouchedAt||new Date(hit.t).toISOString();
        h.entryAt=new Date(hit.t).toISOString();
        h.lastReason='OVERNIGHT REPLAY ENTRY';
      }
    }

    // Replay exits for positions that are/were open.
    for(const c of bars){
      const positions=(s.open||[]).filter(t=>t.sym===sym && new Date(t.openedAt||0).getTime()<=c.t);
      for(const t of positions) recoveredEvents+=paperReplayOpenPositionOnCandle(s,t,c);
    }
  }

  meta.lastReplayMs=now;
  meta.lastEvalMs=now;
  meta.lastGapMs=gapMs;
  meta.recoveredBars=Number(meta.recoveredBars||0)+recoveredBars;
  meta.recoveredEvents=Number(meta.recoveredEvents||0)+recoveredEvents;
  meta.lastReplayBars=recoveredBars;
  meta.lastReplayEvents=recoveredEvents;
  meta.fetchFailures=fetchFailures;
  meta.coverage=fetchFailures?'PARTIAL':'RECOVERED';
  meta.note='Known candidates/open positions only; unseen suspended-period signals are not backfilled.';
  savePaperState(s);
  paperEvent('OVERNIGHT_REPLAY',{gapMs,recoveredBars,recoveredEvents,fetchFailures});
  return {status:meta.coverage,gapMs,recoveredBars,recoveredEvents,fetchFailures};
}

function paperEngineScan(force=false){
 const s=paperState(),signals=paperMultiSignals();
 paperTrackCandidates(s,signals);
 s.watch=signals.map(x=>({sym:x.sym,side:x.side,status:x.allowed?'ENTRY READY':x.reason,score:x.candidateScore,live:x.live,entryLow:x.entryLow,entryHigh:x.entryHigh,ts:Date.now()}));
 for(const base of signals){
   const x={...base};
   const pg=paperRiskGate(s,x);
   x.paperRiskOpen=pg.open;x.paperRiskReason=pg.reason;
   x.allowed=x.levelsValid&&x.techOpen&&pg.open&&x.inZone;
   x.reason=!x.levelsValid?'INVALID PLAN DATA':!x.techOpen?'TECH BLOCK':!pg.open?pg.reason:!x.inZone?'WAIT ENTRY ZONE':'ENTRY READY';
   const k=paperStaticKey(x);
   if(x.allowed){
     const already=s.open.some(t=>t.sym===x.sym&&t.side===x.side)||s.seen.official[k];
     if((s.autoMode||force)&&!already){
       if(paperOpenSignal(s,x))s.seen.official[k]=Date.now();
     }
   }else if(x.levelsValid&&x.techOpen&&!x.paperRiskOpen){
     if(!s.seen.shadow[k]){
       if(paperAddShadow(s,x))s.seen.shadow[k]=Date.now();
     }
   }
 }
 paperRecordScan(s,signals);
 savePaperState(s);

 paperMarkEvaluation();
}
function paperManualCapture(){

   x.paperRiskOpen=pg.open;x.paperRiskReason=pg.reason;

     if(paperOpenSignal(s,x)){s.seen.official[k]=Date.now();changed=true;}
   }

}
function paperPartialTp1(s,i,exitPrice){
 const t=s.open[i];
 if(!t||t.tp1PartialDone)return false;
 const fraction=0.5;
 const closeQty=(t.remainingQty||t.qty)*fraction;
 if(!(closeQty>0))return false;
 const slip=s.slippagePct||0;
 const fill=t.side==='SHORT'?exitPrice*(1+slip):exitPrice*(1-slip);
 const gross=(t.side==='SHORT'?(t.entry-fill):(fill-t.entry))*closeQty;
 const fee=Math.abs(fill*closeQty)*(s.feePct||0);
 const net=gross-fee;
 s.balance+=gross-fee;
 t.remainingQty=(t.remainingQty||t.qty)-closeQty;
 t.tp1Touched=true;t.tp1PartialDone=true;
 t.realizedPartial=Number(t.realizedPartial||0)+net;
 t.tp1Fill=fill;t.tp1At=new Date().toISOString();
 paperEvent('TP1_PARTIAL',{id:t.id,sym:t.sym,fill,qty:closeQty,net});
 paperBackupState(s);
 return true;
}
function paperCloseInState(s,i,exitPrice,why){
 const t=s.open[i],slip=s.slippagePct||0;
 const qty=Number(t.remainingQty||t.qty||0);
 const fill=t.side==='SHORT'?exitPrice*(1+slip):exitPrice*(1-slip);
 const gross=(t.side==='SHORT'?(t.entry-fill):(fill-t.entry))*qty;
 const feeClose=Math.abs(fill*qty)*(s.feePct||0);
 const net=gross-feeClose+Number(t.realizedPartial||0);
 s.balance+=gross-feeClose;
 const r=t.riskUsd?net/t.riskUsd:0;
 const closedAt=new Date().toISOString();
 const closed={...t,exit:fill,closedAt,exitReason:why,feeClose,net,r,duration:paperAge(t.openedAt,closedAt)};
 s.trades.unshift(closed);
 if(t.candidateKey && s.candidateHistory?.[t.candidateKey]){
   const h=s.candidateHistory[t.candidateKey];
   h.exitAt=closedAt;h.exitPrice=fill;h.exitReason=why;h.resultR=r;h.net=net;
   h.mfeR=t.mfeR;h.maeR=t.maeR;h.lastReason='CLOSED '+why;
 }
 paperEvent('EXIT',{id:t.id,sym:t.sym,reason:why,exit:fill,net,r,mfeR:t.mfeR,maeR:t.maeR});
 s.open.splice(i,1);
 paperBackupState(s);
}
function paperTick(){
 const s=paperState();
 for(let i=s.open.length-1;i>=0;i--){
   const t=s.open[i],px=paperQuote(t.sym);
   if(!Number.isFinite(px))continue;
   const riskPerUnit=Math.abs(t.entry-t.stop);
   if(riskPerUnit>0){
     const favorable=t.side==='SHORT'?(t.entry-px):(px-t.entry);
     const adverse=t.side==='SHORT'?(px-t.entry):(t.entry-px);
     t.mfeR=Math.max(Number(t.mfeR||0),favorable/riskPerUnit);
     t.maeR=Math.max(Number(t.maeR||0),adverse/riskPerUnit);
   }
   const hitSL=t.side==='SHORT'?px>=t.stop:px<=t.stop;
   const hitTP1=t.side==='SHORT'?px<=t.tp1:px>=t.tp1;
   const hitTP2=t.side==='SHORT'?px<=t.tp2:px>=t.tp2;
   if(hitSL){paperCloseInState(s,i,t.stop,'SL');continue}
   if(hitTP2){paperCloseInState(s,i,t.tp2,'TP2');continue}
   if(hitTP1&&!t.tp1PartialDone){paperPartialTp1(s,i,t.tp1)}
 }
 // strict shadow state machine remains unchanged in concept
 for(const t of (s.shadow||[])){
   const prevShadowStatus=t.status||null;
   if(!paperLevelsValid(t)){t.dataQuality='INVALID';t.status='INVALID';t.resolved=false;t.outcome=null;t.hypotheticalR=null;continue}
   t.dataQuality='VALID';
   if(t.shadowEntry==null && t.resolved){t.resolved=false;t.outcome=null;t.exit=null;t.hypotheticalR=null;t.status='WAIT_ZONE'}
   if(t.resolved)continue;
   const px=paperQuote(t.sym);
   if(!Number.isFinite(px))continue;
   const lo=Math.min(Number(t.entryLow),Number(t.entryHigh)),hi=Math.max(Number(t.entryLow),Number(t.entryHigh));

function cloudPerformanceAnalytics(trades){
  const arr=(Array.isArray(trades)?trades:[]).map(t=>{
    const pnl=Number(t.realized??t.pnl??t.realizedPnl??0);
    const rawSide=String(t.side||t.direction||t.positionSide||'').toUpperCase();
    const normalizedSide=rawSide.includes('SHORT')?'SHORT':rawSide.includes('LONG')?'LONG':'OTHER';
    return {...t,_pnl:Number.isFinite(pnl)?pnl:0,_side:normalizedSide,_symbol:String(t.symbol||'').replace('USDT','')};
  });
  const wins=arr.filter(t=>t._pnl>0), losses=arr.filter(t=>t._pnl<0);
  const gp=wins.reduce((s,t)=>s+t._pnl,0);
  const gl=Math.abs(losses.reduce((s,t)=>s+t._pnl,0));
  const pf=gl>0?gp/gl:(gp>0?Infinity:0);
  const avgWin=wins.length?gp/wins.length:0;
  const avgLoss=losses.length?gl/losses.length:0;
  const expectancy=arr.length?arr.reduce((s,t)=>s+t._pnl,0)/arr.length:0;
  const bySymbol={}, bySide={LONG:{n:0,pnl:0,wins:0},SHORT:{n:0,pnl:0,wins:0},OTHER:{n:0,pnl:0,wins:0}};
  arr.forEach(t=>{
    const s=t._symbol||'OTHER';
    bySymbol[s] ||= {n:0,pnl:0,wins:0};
    bySymbol[s].n++; bySymbol[s].pnl+=t._pnl; if(t._pnl>0)bySymbol[s].wins++;
    if(bySide[t._side]){bySide[t._side].n++; bySide[t._side].pnl+=t._pnl; if(t._pnl>0)bySide[t._side].wins++}
  });
  return {arr,wins,losses,gp,gl,pf,avgWin,avgLoss,expectancy,bySymbol,bySide};
}

function cloudEvidenceAnalytics(payload){
  const src=payload&&Array.isArray(payload.items)?payload.items:[];
  const items=src.map((x,i)=>{
    const result=x?.result&&typeof x.result==='object'?x.result:null;
    const realized=Number(result?.realized);
    const distance=Number(x?.distance_atr??x?.distanceAtr??x?.snapshot?.distanceAtr);
    const technical=Number(x?.technical??x?.snapshot?.technical);
    const candidate=Number(x?.candidate??x?.snapshot?.candidate);
    const entry=Number(x?.snapshot?.entry??x?.snapshot?.signalEntry??x?.entry);
    const stop=Number(x?.snapshot?.s1??x?.snapshot?.sl??x?.sl);
    const riskPct=Number(x?.snapshot?.configAtEntry?.riskPerTradePct??1);
    const stopPct=(Number.isFinite(entry)&&entry!==0&&Number.isFinite(stop))?Math.abs(entry-stop)/Math.abs(entry)*100:null;
    const effectiveLeverage=(stopPct&&Number.isFinite(riskPct))?riskPct/stopPct:null;
    return {
      raw:x,
      id:x?.position_id||x?.positionId||String(i),
      symbol:String(x?.symbol||x?.snapshot?.symbol||'—').replace('USDT',''),
      side:String(x?.side||x?.snapshot?.side||'—').toUpperCase(),
      regime:String(x?.regime||x?.snapshot?.regime||'UNKNOWN').toUpperCase(),
      technical:Number.isFinite(technical)?technical:null,
      candidate:Number.isFinite(candidate)?candidate:null,
      distance:Number.isFinite(distance)?distance:null,
      entry:Number.isFinite(entry)?entry:null, stop:Number.isFinite(stop)?stop:null, riskPct:Number.isFinite(riskPct)?riskPct:1,
      stopPct:Number.isFinite(stopPct)?stopPct:null, effectiveLeverage:Number.isFinite(effectiveLeverage)?effectiveLeverage:null,
      result,
      realized:result&&Number.isFinite(realized)?realized:null,
      exitReason:result?.exitReason||result?.exit_reason||null,
      openedAt:x?.opened_at||x?.openedAt||x?.snapshot?.openedAt||null,
      closedAt:x?.closed_at||x?.closedAt||result?.closedAt||null
    };
  }).sort((a,b)=>(cloudEpoch(b.openedAt)||0)-(cloudEpoch(a.openedAt)||0));
  const closed=items.filter(x=>x.result&&Number.isFinite(x.realized));
  const byRegime={};
  items.forEach(x=>{const k=x.regime||'UNKNOWN';byRegime[k]||(byRegime[k]={captured:0,closed:0,pnl:0,wins:0});byRegime[k].captured++});
  closed.forEach(x=>{const q=byRegime[x.regime]||(byRegime[x.regime]={captured:0,closed:0,pnl:0,wins:0});q.closed++;q.pnl+=x.realized;q.wins+=x.realized>0?1:0});
  const totalPnl=closed.reduce((q,x)=>q+x.realized,0);
  const distances=items.filter(x=>Number.isFinite(x.distance));
  const closedDistances=closed.filter(x=>Number.isFinite(x.distance));
  const avgClosedDistance=closedDistances.length?closedDistances.reduce((q,x)=>q+x.distance,0)/closedDistances.length:null;
  const longEvidence=items.filter(x=>x.side==='LONG'&&x.technical!=null&&x.candidate!=null&&x.regime!=='UNKNOWN');
  const regimeEvidence=items.filter(x=>x.regime&&x.regime!=='UNKNOWN');
  return {
    items,closed,byRegime,totalPnl,distances,closedDistances,avgClosedDistance,longEvidence,regimeEvidence,
    captureVersion:payload?.captureVersion||MERIDIAN_CLOUD.status?.evidenceCapture?.version||'6.53-EVIDENCE',
    executionImpact:payload?.executionImpact===true,
    latestClosed:closed.slice().sort((a,b)=>(cloudEpoch(b.closedAt)||0)-(cloudEpoch(a.closedAt)||0))[0]||null
  };
}

function cloudAdaptiveRisk659(evidencePayload,h6Risk){

  const groups={};

  const calc=q=>{
    if(!q||!q.n)return {modifier:1,confidence:0,wr:0};
    const wr=q.w/q.n;
    const pnlQuality=q.abs>0?q.pnl/q.abs:0; // -1..+1
    const observed=Math.max(.50,Math.min(1.20,1 + .35*pnlQuality + .30*(wr-.50)));
    const confidence=Math.min(1,q.n/20); // deliberately slow learning
    const modifier=1+(observed-1)*confidence;
    return {modifier,confidence,wr};
  };
  const rows=Object.entries(groups).sort((a,b)=>b[1].n-a[1].n).map(([k,q])=>{const z=calc(q);const risk=Math.max(.25,Math.min(1.00,h6Risk*z.modifier));return `<div class="adaptive659-regime"><span>${k} · ${q.n} OUT · ${Math.round(z.confidence*100)}% CONF</span><b class="${z.modifier<.98?'amber':z.modifier>1.02?'green':''}">${fmt(z.modifier,2)}× MOD · ${fmt(risk,2)}% H7 RISK</b></div>`}).join('')||'<div class="adaptive659-regime"><span>NO OUTCOMES</span><b>1,00× MOD</b></div>';
  const weighted=closed.length?closed.reduce((a,x)=>{const z=calc(groups[x.regime||'UNKNOWN']);return a+z.modifier},0)/closed.length:1;
  const adaptive=Math.max(.25,Math.min(1.00,h6Risk*weighted));
  return `<div class="adaptive659">
    <div class="adaptive659-head"><b>H7 · ADAPTIVE RISK SHADOW · 6.59</b><span>SOFT MODIFIER · ZERO EXECUTION IMPACT</span></div>

    </div>
    <div class="adaptive659-regimes">${rows}</div>
    <div class="adaptive659-note">Regime is a soft sizing observation, never an entry gate. Modifier range is deliberately bounded and shrunk toward 1.00× until each regime has more outcomes. Trade frequency is unchanged; opportunity cost remains visible. Base execution risk remains 1.00%.</div>

}

  const e=cloudEvidenceAnalytics(evidencePayload);
  const seq=e.closed.slice().sort((a,b)=>(cloudEpoch(a.closedAt)||0)-(cloudEpoch(b.closedAt)||0));
  const sum=a=>a.reduce((q,x)=>q+(Number(x)||0),0);
  const calcKellyRisk=hist=>{
    const wins=hist.filter(x=>x.realized>0), losses=hist.filter(x=>x.realized<0);
    const p=hist.length?wins.length/hist.length:0;
    const aw=wins.length?sum(wins.map(x=>x.realized))/wins.length:0;
    const al=losses.length?Math.abs(sum(losses.map(x=>x.realized))/losses.length):0;
    const b=al>0?aw/al:0;
    const raw=(b>0)?Math.max(0,p-(1-p)/b):0;
    const quarter=raw*.25*100;
    const conf=Math.min(1,hist.length/50);
    return Math.max(.25,Math.min(1.00,.50*(1-conf)+quarter*conf));
  };
  const calcRegimeMod=(hist,regime)=>{
    const g=hist.filter(x=>(x.regime||'UNKNOWN')===(regime||'UNKNOWN'));
    if(!g.length)return 1;
    const wins=g.filter(x=>x.realized>0).length, pnl=sum(g.map(x=>x.realized)), abs=sum(g.map(x=>Math.abs(x.realized||0)));
    const wr=wins/g.length, quality=abs>0?pnl/abs:0;
    const observed=Math.max(.50,Math.min(1.20,1+.35*quality+.30*(wr-.50)));
    const conf=Math.min(1,g.length/20);
    return 1+(observed-1)*conf;
  };
  const rows=[]; const prior=[];
  seq.forEach(x=>{
    const h6=calcKellyRisk(prior);
    const mod=calcRegimeMod(prior,x.regime);
    const h7=Math.max(.25,Math.min(1.00,h6*mod));
    const base=Number(x.realized)||0;
    rows.push({...x,base,h6Risk:h6,h7Risk:h7,h6Pnl:base*h6,h7Pnl:base*h7});
    prior.push(x);
  });
  const stats=(vals)=>{
    let equity=10000,peak=10000,maxDd=0,grossWin=0,grossLoss=0,wins=0;
    vals.forEach(v=>{equity+=v;if(v>0){grossWin+=v;wins++}else if(v<0)grossLoss+=Math.abs(v);peak=Math.max(peak,equity);maxDd=Math.max(maxDd,peak?100*(peak-equity)/peak:0)});
    return {pnl:equity-10000,equity,maxDd,pf:grossLoss?grossWin/grossLoss:(grossWin>0?Infinity:0),wr:vals.length?100*wins/vals.length:0};
  };
  const base=stats(rows.map(x=>x.base)), h6=stats(rows.map(x=>x.h6Pnl)), h7=stats(rows.map(x=>x.h7Pnl));
  const pf=v=>Number.isFinite(v)?fmt(v,2):(v===Infinity?'∞':'—');
  const cardCol=(name,z,tone)=>`<div class="decisionjournal660-col"><span>${name}</span><b class="${tone||''}">${z.pnl>=0?'+':''}${cloudMoney(z.pnl)}</b><div class="decisionjournal660-metrics"><div>MAX DD<b>${fmt(z.maxDd,2)}%</b></div><div>PF<b>${pf(z.pf)}</b></div><div>END EQ<b>${cloudMoney(z.equity)}</b></div><div>WR<b>${fmt(z.wr,0)}%</b></div></div></div>`;
  const latest=rows.slice().reverse().slice(0,5).map(x=>`<div class="decisionjournal660-row"><b>${x.symbol} ${x.side}</b><span>${x.regime}</span><span>BASE ${x.base>=0?'+':''}${cloudMoney(x.base)}</span><span>H6 ${fmt(x.h6Risk,2)}% · ${x.h6Pnl>=0?'+':''}${cloudMoney(x.h6Pnl)}</span><span>H7 ${fmt(x.h7Risk,2)}% · ${x.h7Pnl>=0?'+':''}${cloudMoney(x.h7Pnl)}</span></div>`).join('');
  const d6=h6.pnl-base.pnl,d7=h7.pnl-base.pnl,dd6=base.maxDd-h6.maxDd,dd7=base.maxDd-h7.maxDd;
  return `<div class="decisionjournal660">
    <div class="decisionjournal660-head"><b>DECISION JOURNAL · 6.64</b><span>SEQUENTIAL SHADOW · NO LOOK-AHEAD · ZERO EXECUTION IMPACT</span></div>
    <div class="decisionjournal660-grid">${cardCol('6.2 EVIDENCE BASELINE',base,base.pnl>=0?'green':'red')}${cardCol('H6 FRACTIONAL KELLY',h6,h6.pnl>=0?'green':'red')}${cardCol('H7 KELLY + REGIME',h7,h7.pnl>=0?'green':'red')}</div>
    <div class="decisionjournal660-delta"><div><span>H6 Δ P&L / DD REDUCTION</span><b class="${d6>=0?'green':'red'}">${d6>=0?'+':''}${cloudMoney(d6)} · ${dd6>=0?'+':''}${fmt(dd6,2)} %-Pkt.</b></div><div><span>H7 Δ P&L / DD REDUCTION</span><b class="${d7>=0?'green':'red'}">${d7>=0?'+':''}${cloudMoney(d7)} · ${dd7>=0?'+':''}${fmt(dd7,2)} %-Pkt.</b></div></div>
    <details class="evidence654-more"><summary>▶ LETZTE JOURNAL-TRADES ANZEIGEN</summary><div class="decisionjournal660-rows">${latest||'<div class="decisionjournal660-note">Noch keine abgeschlossenen Evidence-Outcomes.</div>'}</div></details>
    <div class="decisionjournal660-note">Journal calculations are evidence-only and sequential: each H6/H7 risk for a trade uses only outcomes that were already closed before that trade. Baseline realized P&L is scaled linearly from the 1.00% execution risk to the hypothetical H6/H7 risk. This avoids look-ahead bias and does not reconstruct pre-6.53 trades.</div>
  </div>`;
}

function cloudDecisionLab658(evidencePayload,totalClosedTrades){
  const e=cloudEvidenceAnalytics(evidencePayload), closed=e.closed;
  const sum=a=>a.reduce((q,x)=>q+(Number(x.realized)||0),0);
  const wins=closed.filter(x=>x.realized>0), losses=closed.filter(x=>x.realized<0);
  const p=closed.length?wins.length/closed.length:0;
  const avgWin=wins.length?sum(wins)/wins.length:0;
  const avgLoss=losses.length?Math.abs(sum(losses)/losses.length):0;
  const b=avgLoss>0?avgWin/avgLoss:0;
  const rawKelly=(b>0)?Math.max(0,p-(1-p)/b):0;
  // Research-only: quarter Kelly, strongly shrunk toward 0.50% while evidence is small; hard shadow bounds 0.25–1.00%.
  const quarterKelly=rawKelly*0.25*100;
  const confidence=Math.min(1,closed.length/50);
  const shadowRisk=Math.max(.25,Math.min(1.00,.50*(1-confidence)+quarterKelly*confidence));
  const avgLev=e.items.filter(x=>Number.isFinite(x.effectiveLeverage));
  const levMean=avgLev.length?avgLev.reduce((q,x)=>q+x.effectiveLeverage,0)/avgLev.length:null;
  const highLev=avgLev.filter(x=>x.effectiveLeverage>=4).length;

  // Same frozen 6.3 counterfactual used by Research Lab; opportunity cost makes filtering cost explicit.
  const scored=closed.map(x=>({...x,eligible:x.side==='SHORT'||(x.side==='LONG'&&Number(x.technical)>=80&&Number(x.candidate)>=75)}));
  const filtered=scored.filter(x=>!x.eligible), filteredWins=filtered.filter(x=>x.realized>0), filteredLosses=filtered.filter(x=>x.realized<0);
  const preventedLoss=Math.abs(sum(filteredLosses));
  const sacrificedWin=sum(filteredWins);
  const keepRate=scored.length?100*(scored.length-filtered.length)/scored.length:100;

  const matrix={};
  closed.forEach(x=>{const k=(x.regime||'UNKNOWN')+'|'+x.side;const q=matrix[k]||(matrix[k]={n:0,pnl:0,w:0});q.n++;q.pnl+=x.realized;q.w+=x.realized>0?1:0});
  const matrixHtml=Object.entries(matrix).sort((a,b)=>b[1].n-a[1].n).map(([k,q])=>{const [r,d]=k.split('|');return `<div class="decision658-cell"><span>${r} · ${d}</span><b class="${q.pnl>=0?'green':'red'}">${q.n} OUT · ${q.pnl>=0?'+':''}${cloudMoney(q.pnl)} · ${q.n?Math.round(q.w/q.n*100):0}% WR</b></div>`}).join('')||'<div class="decision658-note">Noch keine abgeschlossenen Regime×Direction-Outcomes.</div>';
  const ready=Number(totalClosedTrades||0)>=30&&closed.length>=5;
  return `<div class="decision658">
    <div class="decision658-head"><b>DECISION LAB · 6.64</b><span>SHADOW ONLY · NO EXECUTION CHANGE</span></div>
    <div class="decision658-grid">
      <div><span>H6 SHADOW RISK</span><b>${fmt(shadowRisk,2)}%</b></div>
      <div><span>RAW KELLY</span><b>${fmt(rawKelly*100,1)}%</b></div>
      <div><span>AVG EFF. LEVERAGE</span><b>${levMean!=null?fmt(levMean,2)+'×':'—'}</b></div>
      <div><span>≥4× LEVERAGE</span><b>${highLev}/${avgLev.length}</b></div>
      <div><span>KEEP RATE</span><b>${fmt(keepRate,0)}%</b></div>
      <div><span>FILTERED</span><b>${filtered.length}</b></div>
      <div><span>LOSS PREVENTED</span><b class="green">+${cloudMoney(preventedLoss)}</b></div>
      <div><span>WIN SACRIFICED</span><b class="${sacrificedWin>0?'red':'green'}">${sacrificedWin>0?'-':''}${cloudMoney(sacrificedWin)}</b></div>
    </div>
    <div class="decision658-section"><div class="decision658-title">REGIME × DIRECTION · DESCRIPTIVE ONLY</div><div class="decision658-matrix">${matrixHtml}</div></div>
    ${cloudAdaptiveRisk659(evidencePayload,shadowRisk)}
    ${cloudDecisionJournal660(evidencePayload)}
    <div class="decision658-lock ${ready?'ok':''}">${ready?'DECISION SAMPLE OPEN':'COLLECTING'} · ${totalClosedTrades||0} baseline trades · ${closed.length} Evidence outcomes. Kelly, leverage and regime matrix remain research-only; Base Risk stays 1.00%.</div>
    <div class="decision658-note">H6 uses conservative fractional Kelly only as a shadow comparison: ¼-Kelly, small-sample shrinkage, and a research band of 0.25–1.00%. It does not size live Paper positions. Opportunity Cost prevents over-filtering by showing both avoided losses and sacrificed winners. Effective leverage is derived from risk budget ÷ stop distance where the Evidence snapshot contains Entry/SL.</div>
  </div>`;
}

  const C=MERIDIAN_CLOUD||{}, st=C.status||{}, scan=C.signals||{}, p=C.paper||{}, a=p.account||{};
  const shadow=C.shadow||{}, challenger=C.challenger||{};
  const eng=st.engine||{}, db=st.db||{}, safety=st.safety||{}, limits=st.limits||{};
  const assets=Array.isArray(scan.assets)?scan.assets:[];
  const positions=Array.isArray(p.positions)?p.positions:[];
  const trades=Array.isArray(p.trades)?p.trades:[];
  const events=Array.isArray(C.events)?C.events:[];
  const active=typeof meridianPaperBotTab==='function'?meridianPaperBotTab():'baseline';

  const n=x=>Number(x||0);
  const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const money=x=>{x=n(x);return (x<0?'−':x>0?'+':'')+'$'+Math.abs(x).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})};
  const pfLabel=x=>Number(x)>=99?'∞':fmt(n(x),2);
  const tone=x=>n(x)>=0?'green':'red';
  const sym=x=>String(x||'').replace('USDT','');
  const start=n(a.startEquity||10000), equity=n(a.equity||start), basePnl=equity-start;
  const basePeak=n(a.peakEquity||equity||start), baseDD=basePeak?Math.max(0,(basePeak-equity)/basePeak*100):0;
  const baseWins=trades.filter(t=>n(t.realized)>0), baseLosses=trades.filter(t=>n(t.realized)<0);
  const baseGP=baseWins.reduce((q,t)=>q+n(t.realized),0), baseGL=Math.abs(baseLosses.reduce((q,t)=>q+n(t.realized),0));
  const basePF=baseGL?baseGP/baseGL:(baseGP>0?99:0), baseWR=trades.length?baseWins.length/trades.length*100:0;
  const baseOpenRisk=positions.reduce((q,z)=>q+n(z.riskPct),0);

  const sha=shadow.account||{}, shStart=n(sha.startEquity||10000), shEq=n(sha.equity||shStart), shPnl=shEq-shStart;
  const shClosed=n(shadow.closedCount), shOpen=n(shadow.openCount), shWR=n(shadow.winRate), shPF=n(shadow.profitFactor), shDD=n(sha.drawdownPct);
  const cha=challenger.account||{}, chStart=n(cha.startEquity||10000), chEq=n(cha.equity||chStart), chPnl=chEq-chStart;
  const chClosed=n(challenger.closedCount), chOpen=n(challenger.openCount), chWR=n(challenger.winRate), chPF=n(challenger.profitFactor), chDD=n(cha.drawdownPct);
  const best=assets[0]||null;

  function findEval(state,b){
    if(!b)return null;
    const xs=[...(Array.isArray(state?.lastEvaluations)?state.lastEvaluations:[]),state?.lastDecision,state?.lastSignal].filter(Boolean);
    return xs.find(x=>String(x.symbol||'').toUpperCase()===String(b.symbol||'').toUpperCase()&&String(x.side||'').toUpperCase()===String(b.side||'').toUpperCase())||null;
  }
  function shadowDecisionFor(b){
    const m=findEval(shadow,b);
    if(m){
      const rs=Array.isArray(m.reasons)?m.reasons:[];
      let d=String(m.decision||'').toUpperCase();
      if(d==='ENTER'||d==='ELIGIBLE')d='ELIGIBLE';
      else if(d==='BLOCK')d='REJECT';
      else if(!d)d=rs.length?'REJECT':'ELIGIBLE';
      return {decision:d||'WAIT',reasons:rs,regime:m.regime||'—'};
    }
    return {decision:'NO MATCH',reasons:[],regime:b?.regime||'—'};
  }
  function challengerDecisionFor(b){
    const m=findEval(challenger,b);
    if(!m)return {decision:'NO MATCH',reasons:[],confidence:'—',risk:'—',regime:b?.regime||'—'};
    return {decision:String(m.decision||'SKIP').toUpperCase(),reasons:Array.isArray(m.reasons)?m.reasons:[],confidence:m.confidence??'—',risk:m.riskPct==null?'—':fmt(n(m.riskPct),1)+'%',regime:m.regime||'—'};
  }
  const shBest=shadowDecisionFor(best), chBest=challengerDecisionFor(best);

  const tabs=`<div id="v731-paper-tabs">

    <button class="challenger ${active==='challenger'?'active':''}" onclick="meridianPaperSetBotTab('challenger')">CHALLENGER V2</button>
    <button class="compare ${active==='compare'?'active':''}" onclick="meridianPaperSetBotTab('compare')">VERGLEICH</button>

  function hero(cls,title,badge,eq,pnl,closed,open,wr,pf,dd){

        <div class="v731-kpi"><span>P&L</span><b class="${tone(pnl)}">${money(pnl)}</b><small>${start?fmt(n(pnl)/10000*100,2):'0,00'}%</small></div>

  function signalHeader(){

    return `<div class="paper-signal"><div><b>${sym(best.symbol)} ${best.side||''}</b><strong class="${cloudStatusTone(best.status)}">${best.technical??'—'}/100 · ${best.candidate??'—'}/100</strong></div>

  function baselineScanner(){

    return `<div class="v731-section"><div class="v731-title"><b>LIVE SCANNER</b><span>${assets.length} LIVE ASSETS · ${universe}</span></div><div class="v731-evals">${rows||'<div class="muted">Keine Signale.</div>'}</div></div>`;

  function researchEvalRows(state,kind){
    const xs=Array.isArray(state?.lastEvaluations)?state.lastEvaluations:[];
    return xs.map(x=>{
      const d=String(x.decision||'WAIT').toUpperCase(), cls=d==='TRADE'||d==='ELIGIBLE'||d==='ENTER'?'green':d==='CAUTION'||d==='WAIT'?'amber':'red';
      const extra=kind==='challenger'?`CONF ${x.confidence??'—'} · RISK ${x.riskPct==null?'—':fmt(n(x.riskPct),1)+'%'} · `:'';
      return `<div class="v731-row"><div><span>ASSET / SIDE</span><b>${sym(x.symbol)} ${x.side||''}</b><small>TECH ${x.technical??'—'} · CAND ${x.candidate??'—'} · ${x.regime||'—'}</small></div>
        <div><span>DECISION</span><b class="${cls}">${d}</b><small>${extra}${(x.reasons||[]).join(' · ')||x.status||'Gates erfüllt'}${x.distanceAtr!=null?' · '+fmt(x.distanceAtr,2)+' ATR':''}</small></div></div>`;
    }).join('')||'<div class="muted">Noch keine Evaluations.</div>';
  }

  function researchPositions(state){
    const xs=Array.isArray(state?.openPositions)?state.openPositions:[];
    return xs.map(t=>`<div class="v731-row"><div><span>OPEN POSITION</span><b>${sym(t.symbol)} ${t.side||''}</b><small>ENTRY ${cloudPrice(t.entry,t.symbol)} · LIVE ${cloudPrice(t.livePrice,t.symbol)}</small></div>
      <div><span>RISK / P&L</span><b class="${tone(t.unrealized)}">${money(t.unrealized)}</b><small>RISK ${fmt(n(t.riskPct),1)}% · SL ${cloudPrice(t.sl,t.symbol)} · TP1 ${cloudPrice(t.tp1,t.symbol)}</small></div></div>`).join('')||'<div class="muted">Keine offenen Positionen.</div>';

  function researchClosed(state){
    const xs=Array.isArray(state?.recentClosed)?state.recentClosed:[];
    return xs.map(t=>`<div class="v731-row"><div><span>CLOSED</span><b>${sym(t.symbol)} ${t.side||''}</b><small>${t.exitReason||'CLOSED'} · ${cloudTime(t.closedAt)}</small></div>
      <div><span>REALIZED</span><b class="${tone(t.realized)}">${money(t.realized)}</b><small>ENTRY ${cloudPrice(t.entry,t.symbol)} · EXIT ${cloudPrice(t.exit,t.symbol)}</small></div></div>`).join('')||'<div class="muted">Noch keine abgeschlossenen Trades.</div>';

  function baselineView(){
    const why=!best?'SCANNER LÄDT':best.status==='READY'?'ALLE GATES ERFÜLLT · PAPER ENTRY FREIGEGEBEN':best.status==='WAIT_ENTRY_ZONE'?'SETUP STARK · AUF ENTRY-ZONE WARTEN':(best.reasons||[]).join(' · ')||'KEIN SETUP';
    const openRows=positions.map(t=>`<div class="v731-row"><div><span>OPEN POSITION</span><b>${sym(t.symbol)} ${t.side}</b><small>ENTRY ${cloudPrice(t.entry,t.symbol)} · LIVE ${cloudPrice(t.livePrice,t.symbol)}</small></div><div><span>P&L / RISK</span><b class="${tone(t.unrealized)}">${money(t.unrealized)}</b><small>${fmt(n(t.riskPct),1)}% · SL ${cloudPrice(t.sl,t.symbol)} · TP1 ${cloudPrice(t.tp1,t.symbol)}</small></div></div>`).join('')||'<div class="muted">Keine offenen Baseline-Positionen.</div>';
    const tradeRows=trades.slice().reverse().slice(0,30).map(t=>`<div class="v731-row"><div><span>TRADE</span><b>${sym(t.symbol)} ${t.side}</b><small>${t.exitReason||'CLOSED'} · ${cloudTime(t.closedAt)}</small></div><div><span>REALIZED</span><b class="${tone(t.realized)}">${money(t.realized)}</b><small>ENTRY ${cloudPrice(t.entry,t.symbol)} · EXIT ${cloudPrice(t.exit,t.symbol)}</small></div></div>`).join('')||'<div class="muted">Noch keine Trades.</div>';

      </div><div class="v731-progress"><div class="v731-progress-head"><span>CHECKPOINT 1</span><b>${shClosed} / ${target} CLOSED</b></div><i><u style="width:${prog}%"></u></i></div></div>`
      + `<div class="v731-section"><div class="v731-title"><b>LAST DECISION</b><span>${shadow.lastScanAt?cloudAge(shadow.lastScanAt):'—'}</span></div><div class="v731-decision"><div class="v731-decision-head"><b>${sym(d.symbol)} ${d.side||''}</b><strong class="${String(d.decision).toUpperCase()==='ELIGIBLE'?'green':String(d.decision).toUpperCase()==='WAIT'?'amber':'red'}">${d.decision||'—'}</strong></div><small>TECH ${d.technical??'—'} · CAND ${d.candidate??'—'} · ${d.regime||'—'} · ${(d.reasons||[]).join(' · ')||'V1 gates erfüllt'}</small></div></div>`

async function runMeridianBacktest(){
  if(BT_STATE.running)return;

  }

    btSave();
  }
  renderOne('daytrade')
}

function rsi(vals,p=14){
 if(vals.length<p+1)return null;let g=0,l=0;
 for(let i=vals.length-p;i<vals.length;i++){const d=vals[i]-vals[i-1];if(d>=0)g+=d;else l-=d}

function cycleClock(sym){
 const now=Date.now(), last=HALVINGS.at(-1), span=NEXT_HALVING_EST-last;
 const pct=Math.max(0,Math.min(100,(now-last)/span*100));
 const lag=COIN_LAG_DAYS[sym]||0;
 const referencePeak=new Date(last+(548+lag)*86400000);
 const daysFromReference=Math.round((now-referencePeak.getTime())/86400000);
 let structural='POST-HALVING · LATE';
 if(pct<25)structural='POST-HALVING · EARLY';
 else if(pct<50)structural='POST-HALVING · MID';
 else if(pct<75)structural='POST-HALVING · LATE';
 else structural='PRE-HALVING / RESET';
 return {pct,phase:structural,referencePeak,daysFromReference,lag};
}

function forecast(symbol){

 if(arr.length<90)return {ready:false,cycle:cycleClock(symbol)};
 const vals=arr.map(x=>x.c), last=vals.at(-1), look=vals.slice(-90), low=Math.min(...look), high=Math.max(...look);
 const pos=(last-low)/(high-low||1)*100;
 const dailyRsi=rsi(vals);
 const fib=[1.272,1.618,2.0].map(m=>high+(high-low)*(m-1));
 const ret90=(last/vals[Math.max(0,vals.length-91)]-1)*100;
 let rel=null,lag=null;
 if(symbol!=='BTC' && btc.length>90){
   const bv=btc.map(x=>x.c), br=(bv.at(-1)/bv[Math.max(0,bv.length-91)]-1)*100; rel=ret90-br;
   const peakIndex=a=>{let mi=0,m=-Infinity; a.forEach((v,i)=>{if(v>m){m=v;mi=i}});return mi}
   lag=peakIndex(look)-peakIndex(bv.slice(-90));
 }
 const risk=Math.round(Math.max(0,Math.min(100,(dailyRsi??50)*0.55+pos*0.45)));
 const confidence=Math.round(Math.max(35,Math.min(92,55+(arr.length>=300?12:0)+(symbol==='BTC'?8:0)+(Math.abs(ret90)>10?7:0))));
 return {ready:true,last,low,high,pos,dailyRsi,ret90,rel,lag,risk,confidence,fib,count:arr.length,cycle:cycleClock(symbol)};
}

function atrFromKlines(ks,p=14){
 if(!Array.isArray(ks)||ks.length<p+1)return null;
 const tr=[];
 for(let i=1;i<ks.length;i++){
   const h=+ks[i][2],l=+ks[i][3],pc=+ks[i-1][4];
   tr.push(Math.max(h-l,Math.abs(h-pc),Math.abs(l-pc)));
 }
 return tr.slice(-p).reduce((a,b)=>a+b,0)/p;
}
function detectBullSwing(ks){
 if(!Array.isArray(ks)||ks.length<25)return null;
 const rows=ks.map((k,i)=>({i,t:+k[0],o:+k[1],h:+k[2],l:+k[3],c:+k[4]}));
 const look=rows.slice(-120);
 const pivH=[],pivL=[],n=3;
 for(let i=n;i<look.length-n;i++){
   const r=look[i], win=look.slice(i-n,i+n+1);
   if(r.h===Math.max(...win.map(x=>x.h)))pivH.push(r);
   if(r.l===Math.min(...win.map(x=>x.l)))pivL.push(r);
 }
 let high=pivH.at(-1)||look.reduce((a,b)=>b.h>a.h?b:a,look[0]);
 let lows=pivL.filter(x=>x.i<high.i);
 let low=lows.at(-1);
 if(!low){
   const before=look.filter(x=>x.i<high.i);
   low=before.length?before.reduce((a,b)=>b.l<a.l?b:a,before[0]):look[0];
 }
 // If latest detected high is too old, use the highest high after the most recent meaningful low.
 const recentLow=pivL.at(-1);
 if(recentLow && recentLow.i>high.i){
   const after=look.filter(x=>x.i>recentLow.i);
   if(after.length){
     const h2=after.reduce((a,b)=>b.h>a.h?b:a,after[0]);
     if(h2.h>recentLow.l*1.03){low=recentLow;high=h2}
   }
 }
 if(!(high.h>low.l))return null;
 return {low:low.l,high:high.h,lowTs:low.t,highTs:high.t,candles:look};
}

async function loadGridSwing(sym,force=false){

       const sw=detectBullSwing(ks);

       return GRID_SWINGS[sym];
     }
     throw new Error(errors.join(' | ')||'Keine Datenquelle');
   }catch(e){
     GRID_ENGINE_STATUS[sym]={state:'ERROR',source:'—',error:e.message,updatedAt:Date.now()};

   f236:hi-span*.236,
   f382:hi-span*.382,
   f500:hi-span*.500,
   f618:hi-span*.618,
   f786:hi-span*.786,

 else if(px<fib.f786)state='NEW RANGE';
 const atrPct=s.atr&&px?s.atr/px*100:null;

function whatIfEstimate(bot,mode,value){
 if(!bot)return null;
 const before=Number(bot.buffer);
 if(!Number.isFinite(before))return {before:null,after:null,mode,value,gateBefore:false,gateAfter:false,note:'Aktueller Liq.-Puffer nicht verifiziert.'};
 let after=before, note='';
 const v=Math.max(0,Number(value)||0);
 if(mode==='reduce'){
   // Conservative approximation: buffer improves proportionally to exposure relief,
   // damped to avoid pretending to be the exchange liquidation engine.
   after=before+(100-before)*(v/100)*0.16;
   note=`Exposure −${fmt(v,0)}%`;
 }else if(mode==='margin'){
   const inv=Math.max(1,Number(bot.investment||0));
   after=before+(v/inv)*Math.max(2,before)*0.75;
   note=`Margin +$${fmt(v,0)}`;
 }else if(mode==='leverage'){
   const oldLev=Math.max(1,Number(bot.leverage||1));
   const newLev=Math.max(1,v);
   after=before*(oldLev/newLev);
   note=`Hebel ${fmt(oldLev,0)}x → ${fmt(newLev,0)}x`;
 }
 after=Math.max(0,Math.min(99,after));
 return {before,after,mode,value:v,gateBefore:before>=8,gateAfter:after>=8,note,
   delta:after-before,target8:Math.max(0,8-after),target12:Math.max(0,12-after)};
}

/* v5.38.0 — BEST RECOVERY ACTION
   Compares model-only recovery scenarios and ranks the least costly route
   to the 8% gate, then the 12% recovery target. */
function recoveryOptimizerState(){
 const b=whatIfBotState();
 if(!b || !Number.isFinite(Number(b.buffer))) return {bot:b, candidates:[], best8:null, best12:null};

 const scenarios=[];
 [2,3,5,7.5,10,12.5,15,20,25].forEach(v=>scenarios.push({mode:'reduce',value:v}));
 [25,50,75,100,150,200,300,500].forEach(v=>scenarios.push({mode:'margin',value:v}));
 const oldLev=Math.max(1,Number(b.leverage||1));
 [30,25,20,15,10,7,5,3].filter(v=>v<oldLev).forEach(v=>scenarios.push({mode:'leverage',value:v}));

 const inv=Math.max(1,Number(b.investment||1));
 const candidates=scenarios.map(s=>{
   const e=whatIfEstimate(b,s.mode,s.value);
   let capitalCost=0, exposureCost=0, leverageCost=0;
   if(s.mode==='margin') capitalCost=s.value;
   if(s.mode==='reduce') exposureCost=s.value;
   if(s.mode==='leverage') leverageCost=Math.max(0,(oldLev-s.value)/oldLev*100);

   // Normalized cost score: favors low fresh capital and low exposure loss.
   const score=(capitalCost/inv)*45 + (exposureCost/100)*40 + (leverageCost/100)*15;
   return {...s,...e,capitalCost,exposureCost,leverageCost,score};
 }).filter(x=>Number.isFinite(x.after));

 const choose=(target)=>{
   const hit=candidates.filter(x=>x.after>=target).sort((a,b)=>a.score-b.score || a.after-b.after);
   return hit[0]||null;
 };
 return {bot:b,candidates,best8:choose(8),best12:choose(12)};
}

let HEADER_FEED_BUSY=false;
async function manualFeedRefresh(){
 const b=document.getElementById('feedRefreshBtn');
 const s=document.getElementById('refreshTime');
 if(HEADER_FEED_BUSY)return;
 HEADER_FEED_BUSY=true;
 if(b){b.classList.add('busy');b.textContent='…';}
 if(s){s.classList.add('feed-refreshing');s.textContent='UPDATE…';}
 try{
   const symbols=[...new Set([
     ...(DATA?.portfolio?.holdings||[]).map(x=>x.symbol),
     ...(DATA?.forecastCoins||[]),
     'BTC','ETH','SOL','XRP','PEPE','NEAR','DOT','HBAR'
   ])];

   // Pull a fresh REST snapshot without creating new background intervals.
   try{await refreshBinanceRest(symbols,true)}catch(e){}
   try{
     const missing=symbols.filter(sym=>!DATA?.livePrices?.[sym] || quoteStatus(DATA.livePrices[sym])!=='LIVE');
     if(missing.length) await loadCoinGeckoQuotes(missing,true);
   }catch(e){}
   try{await refreshDayTradeTechnicals()}catch(e){}

   // Reconnect WebSocket only if it is not healthy; otherwise leave the current stream untouched.
   try{
     if(FEED.ws!=='CONNECTED' || !PRICE_WS || PRICE_WS.readyState!==1){
       startBinanceWebSocket(symbols);
     }
   }catch(e){}

   recalcPortfolio();
   const visible=currentVisibleView();
   renderOne(visible);
   updateHeaderFeedClock();
   if(b){b.classList.add('ok');b.textContent='✓';}
 }catch(e){
   console.error('Manual feed refresh failed',e);
   if(b){b.classList.add('err');b.textContent='!';}
 }finally{
   HEADER_FEED_BUSY=false;
   if(s)s.classList.remove('feed-refreshing');
   setTimeout(()=>{
     if(b){b.classList.remove('busy','ok','err');b.textContent='↻';}
     try{updateHeaderFeedClock()}catch(e){}
   },900);
 }
}

function bindCenterSmartFocus(el){
 if(!el)return;
 const details=[...el.querySelectorAll('details[data-center-focus="1"]')];
 if(!details.length)return;
 const x=executionReadinessState(), sb=Number(x?.cap?.shortBuf);
 const critical=Number.isFinite(sb)&&sb<8;
 if(CENTER_CRITICAL_ACTIVE===null){
   CENTER_CRITICAL_ACTIVE=critical;
   if(critical && CENTER_FOCUS_OPEN===null)CENTER_FOCUS_OPEN='center-risk';
 }else if(critical && !CENTER_CRITICAL_ACTIVE){
   CENTER_FOCUS_OPEN='center-risk';
   CENTER_CRITICAL_ACTIVE=true;
 }else if(!critical && CENTER_CRITICAL_ACTIVE){
   CENTER_CRITICAL_ACTIVE=false;
 }
 details.forEach(d=>{d.open=d.dataset.detailKey===CENTER_FOCUS_OPEN});
 details.forEach(d=>{
   d.addEventListener('toggle',()=>{
     if(d.open){
       CENTER_FOCUS_OPEN=d.dataset.detailKey;
       details.forEach(o=>{if(o!==d&&o.open)o.open=false});

       CENTER_FOCUS_OPEN=null;
     }
   });
 });
}

function canonicalRiskPlan(sym){
 const model=DATA.multiAssetSlEngine?.assets?.[sym]||null;
 const g=fibFromSwing(sym);
 if(g && Number.isFinite(g.entryLow) && Number.isFinite(g.entryHigh) && Number.isFinite(g.hi) && Number.isFinite(g.fib?.ext1272)){
   const entryLow=Number(g.entryLow), entryHigh=Number(g.entryHigh), entryMid=(entryLow+entryHigh)/2;
   const structuralBase=Number(g.rangeLow);
   const volBuffer=Math.max((Number(g.atrPct)||1.2)/100*Number(g.px||entryMid)*0.35, Math.abs(entryHigh-entryLow)*0.10);
   const stopLoss=Math.max(0,structuralBase-volBuffer);
   const tp1=Number(g.hi), tp2=Number(g.fib.ext1272);
   const risk=Math.max(1e-12,entryMid-stopLoss);
   return {
     symbol:sym,entryLow,entryHigh,entryMid,stopLoss,tp1,tp2,
     rangeLow:Number(g.rangeLow),rangeHigh:Number(g.rangeHigh),
     rrTp1:(tp1-entryMid)/risk,rrTp2:(tp2-entryMid)/risk,
     invalidation:'Close below structural SL',status:'LIVE MODEL',
     source:g.source||'4H engine',updatedAt:g.updatedAt||Date.now(),
     entryReadiness:entryReadiness(g,sym),setupQuality:scannerScore(g,sym),
     stale:false
   };
 }
 if(model)return {...model,source:'MODEL SNAPSHOT FALLBACK',updatedAt:null,stale:true};
 return null;
}

/* v5.11.2 — ADAPTIVE RISK ENGINE 1.0
   Translates the live liquidation buffer into explicit safety targets.
   Margin/reduction numbers are model-equivalent estimates only; Pionex must be rechecked after any manual change. */
function adaptiveTargetLiq(bot,targetPct){
 const live=Number(bot?.live), side=String(bot?.side||'').toUpperCase(), t=Number(targetPct)/100;
 if(!Number.isFinite(live)||live<=0||!Number.isFinite(t)||t<=0)return NaN;
 return side==='SHORT'?live*(1+t):live*(1-t);
}
function adaptiveExposure(bot){
 const inv=Number(bot?.investment), lev=Number(bot?.leverage);
 return Number.isFinite(inv)&&inv>0&&Number.isFinite(lev)&&lev>0?inv*lev:NaN;
}
function adaptiveRiskOption(bot,targetPct){
 const cur=Number(bot?.buffer), target=Number(targetPct), liq=Number(bot?.liquidation), live=Number(bot?.live);
 const targetLiq=adaptiveTargetLiq(bot,target);
 const deltaPct=(Number.isFinite(cur)&&Number.isFinite(target))?Math.max(0,target-cur):NaN;
 const exposure=adaptiveExposure(bot);
 // Approximation A: extra collateral required if notional stays constant.
 const marginApprox=Number.isFinite(exposure)&&Number.isFinite(deltaPct)?exposure*(deltaPct/100):NaN;
 // Approximation B: notional reduction equivalent under inverse risk-distance scaling.
 const reduceEq=Number.isFinite(cur)&&cur>0&&Number.isFinite(target)&&target>cur?Math.max(0,Math.min(90,(1-cur/target)*100)):0;
 const liqShift=Number.isFinite(targetLiq)&&Number.isFinite(liq)?Math.abs(targetLiq-liq):NaN;
 return {target,cur,targetLiq,liqShift,marginApprox,reduceEq,live,exposure};
}
function adaptiveRiskEngine(){
 const x=executionPlan();
 const cfg=DATA.adaptiveRiskEngine||{};
 const candidate=x.botPlans.find(b=>String(b.side||'').toUpperCase()==='SHORT'&&Number(b.buffer)<15) || x.botPlans[0] || null;
 if(!candidate)return {bot:null,zones:[]};
 const targets=(cfg.targets||[8,12,15]).map(Number).filter(v=>Number.isFinite(v)&&v>Number(candidate.buffer));
 const zones=targets.map(t=>adaptiveRiskOption(candidate,t));
 return {bot:candidate,zones,cfg,source:'SSOT live buffer + target-liquidation geometry'};
}

 const side=String(b.side||'').toUpperCase();
 const tone=current<8?'red':current<15?'amber':'green';
 const zones=a.zones;
 const zoneHtml=zones.length?zones.map((z,i)=>{
   const zTone=z.target>=12?'green':'amber';
   const liqText=Number.isFinite(z.targetLiq)?'$'+gridFmt(z.targetLiq,b.symbol):'—';

   return `<div class="adaptive-zone ${zTone}">

     <div class="adaptive-zone-grid">

 }).join(''):`<p class="footer-note">Position liegt bereits oberhalb der konfigurierten Zielzonen.</p>`;
 return card(`<div class="section-head"><div>
   <div class="eyebrow">ADAPTIVE RISK ENGINE 1.0 ${liveBadge('SSOT')}</div>
   <div class="forecast-main ${tone}">${b.id} · ${fmt(current,2)}% → SICHERHEITSZONEN</div>
   <div class="sub">Live-Puffer → Ziel-Liquidation → ALTERNATIVE · Modell-Äquivalent → Recheck</div>
 </div><span class="tag ${tone}">${current<4?'CRITICAL+':current<8?'CRITICAL':current<15?'DANGER':'WATCH'}</span></div>
 <div class="adaptive-current ${tone}">
   <div><span>LIVE</span><b>${Number.isFinite(live)?'$'+gridFmt(live,b.symbol):'—'}</b></div>
