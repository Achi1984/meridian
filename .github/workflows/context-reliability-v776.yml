name: MERIDIAN Context Reliability v7.76

on:
  workflow_dispatch:
  push:
    branches: [research-v768-preserved-20260903]
    paths:
      - "context-reliability-v776.js"
      - "scripts/context-reliability-v776.mjs"
      - "test/context-reliability-v776.test.js"
      - ".github/workflows/context-reliability-v776.yml"

permissions:
  contents: write

concurrency:
  group: meridian-context-reliability-v776
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research-v768-preserved-20260903
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Use Binance public market-data endpoint
        run: sed -i 's#https://api.binance.com#https://data-api.binance.vision#g' scripts/signal-cohort-v762.mjs
      - name: Generate four disjoint 90d cohorts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/signal-cohort-v762.mjs --out-dir /tmp/v776/p0
          for pair in "p1:90" "p2:180" "p3:270"; do
            name="${pair%%:*}"; days="${pair##*:}"
            end_at="$(date -u -d "${days} days ago" +'%Y-%m-%dT%H:%M:%SZ')"
            node scripts/signal-cohort-v762.mjs --out-dir "/tmp/v776/${name}" --end-at "${end_at}"
          done
      - name: Test v7.76 context reliability
        run: node --test test/context-reliability-v776.test.js test/challenger-v32.test.js
      - name: Build v7.76 evidence
        run: node scripts/context-reliability-v776.mjs --p0 /tmp/v776/p0/signal-cohort-90d.json --p1 /tmp/v776/p1/signal-cohort-90d.json --p2 /tmp/v776/p2/signal-cohort-90d.json --p3 /tmp/v776/p3/signal-cohort-90d.json --out research/context-reliability-v776.json
      - name: Build compact summary
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('research/context-reliability-v776.json','utf8'));
          const rel=r.reliability||{};
          const out=['# MERIDIAN v7.76 — Context Reliability Map','',`Generated: ${r.generatedAt}`,'','Research-only. No entry gates, sizing, risk, exits, Paper or UI are changed. Contexts are measured for reliability and opportunity cost only.','',`Robust cells: **${(rel.robustCells||[]).length}**. Next step: **${r.nextStep}**.`,''];
          for(const c of (rel.robustCells||[]).slice(0,20)) out.push(`- **${c.key}** · ${c.positiveWindows}/${c.windows} positive · mean AvgR ${c.avgAvgR} · mean PF ${c.avgPf} · capture efficiency ${c.avgCaptureEfficiency} pp`);
          if(!(rel.robustCells||[]).length)out.push('- No context cell passed the 3-window positive/no-negative reliability gate.');
          out.push('','## Interpretation','','Winner capture is the share of winning signals inside the Side×Regime parent captured by a context bucket; loss exposure is the corresponding share of losers. Capture efficiency = winner capture − loss exposure. This is a research proxy for opportunity cost, not a market-return benchmark.','',`Promotion allowed: **${r.promotionAllowed}**.`,'');
          fs.writeFileSync('research/context-reliability-v776.md',out.join('\n'));
          NODE
      - name: Commit evidence to research branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- scripts/signal-cohort-v762.mjs
          git add research/context-reliability-v776.json research/context-reliability-v776.md
          if git diff --cached --quiet; then echo "No evidence change"; exit 0; fi
          git commit -m "MERIDIAN v7.76: context reliability results"
          git push origin HEAD:research-v768-preserved-20260903
