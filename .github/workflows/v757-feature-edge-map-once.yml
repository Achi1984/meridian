name: MERIDIAN v7.57 Feature Edge Map Once

on:
  push:
    branches:
      - codex/meridian-v7-57-feature-edge-map
    paths:
      - .github/workflows/v757-feature-edge-map-once.yml

permissions:
  contents: write

jobs:
  feature-map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/meridian-v7-57-feature-edge-map
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Expose research helpers
        run: node scripts/v757-expose-feature-lab.mjs
      - name: Verify
        run: npm test && node --check cloud-backtest.js && node --check scripts/feature-edge-map-v757.mjs
      - name: Use Binance public market-data endpoint in CI
        run: sed -i "s#https://api.binance.com#https://data-api.binance.vision#g" cloud-backtest.js
      - name: Run Raw Feature Edge Map
        run: node scripts/feature-edge-map-v757.mjs
      - name: Restore canonical endpoint and helper exposure
        run: |
          git checkout -- cloud-backtest.js
          node scripts/v757-expose-feature-lab.mjs
      - name: Commit evidence and self-remove
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v757-feature-edge-map-once.yml scripts/v757-expose-feature-lab.mjs
          git add cloud-backtest.js scripts/feature-edge-map-v757.mjs research/feature-edge-map-v757.json research/feature-edge-map-v757.md
          git commit -m "MERIDIAN v7.57: raw feature edge evidence"
          git push origin HEAD:codex/meridian-v7-57-feature-edge-map
