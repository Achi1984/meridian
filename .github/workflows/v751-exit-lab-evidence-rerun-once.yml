name: MERIDIAN v7.51 Exit Lab Evidence Rerun Once

on:
  push:
    branches:
      - codex/meridian-v7-51-exit-lab-evidence
    paths:
      - .github/workflows/v751-exit-lab-evidence-rerun-once.yml

permissions:
  contents: write

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/meridian-v7-51-exit-lab-evidence
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Deterministic install
        run: npm ci
      - name: Use Binance public market-data endpoint for CI research
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('cloud-backtest.js')
          s=p.read_text()
          s=s.replace("const BINANCE='https://api.binance.com';","const BINANCE='https://data-api.binance.vision';")
          p.write_text(s)
          PY
      - name: Run corrected Exit Lab evidence report
        run: node scripts/exit-lab-evidence-report.mjs
      - name: Commit corrected evidence and self-remove
        run: |
          git checkout -- cloud-backtest.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v751-exit-lab-evidence-rerun-once.yml
          git add research/exit-lab-evidence-v751.json research/exit-lab-evidence-v751.md
          git commit -m "MERIDIAN v7.51: correct Exit Lab evidence metrics"
          git push origin HEAD:codex/meridian-v7-51-exit-lab-evidence
