name: Hybrid Alpha v7.90 Evidence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'hybrid-alpha-v1.js'
      - 'hybrid-alpha-backtest-v790.js'
      - 'hybrid-alpha-reliability-v791.js'
      - 'hybrid-alpha-macro-v792.js'
      - 'hybrid-alpha-transition-v793.js'
      - 'scripts/hybrid-alpha-v790-evidence.mjs'
      - '.github/workflows/hybrid-alpha-v790-evidence.yml'

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run public 30/60/90d evidence
        env:
          HYBRID_SYMBOLS: BTCUSDT,ETHUSDT,SOLUSDT,XRPUSDT,ADAUSDT,AVAXUSDT,LINKUSDT
          HYBRID_WINDOWS: 30,60,90
        run: node scripts/hybrid-alpha-v790-evidence.mjs
      - name: Upload evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-alpha-v790-evidence
          path: artifacts/hybrid-alpha-v790-evidence.json
          if-no-files-found: error
