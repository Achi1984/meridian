name: Hybrid Alpha v7.95 Failure Attribution

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'hybrid-alpha-v1.js'
      - 'hybrid-alpha-backtest-v790.js'
      - 'hybrid-alpha-reliability-v791.js'
      - 'hybrid-alpha-macro-v792.js'
      - 'hybrid-alpha-transition-v793.js'
      - 'scripts/hybrid-alpha-v790-evidence.mjs'
      - 'scripts/hybrid-alpha-v795-failure-attribution.mjs'
      - '.github/workflows/hybrid-alpha-v790-evidence.yml'

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run locked 7-asset public 30/60/90d robustness evidence
        env:
          HYBRID_SYMBOLS: BTCUSDT,ETHUSDT,SOLUSDT,XRPUSDT,ADAUSDT,AVAXUSDT,LINKUSDT
          HYBRID_WINDOWS: 30,60,90
        run: node scripts/hybrid-alpha-v790-evidence.mjs
      - name: Run predeclared v7.95 failure-state attribution
        run: node scripts/hybrid-alpha-v795-failure-attribution.mjs
      - name: Upload v7.95 attribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-alpha-v795-attribution
          path: |
            artifacts/hybrid-alpha-v790-evidence.json
            artifacts/hybrid-alpha-v795-failure-attribution.json
          if-no-files-found: error
