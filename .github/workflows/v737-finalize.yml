name: MERIDIAN v7.37 Finalize Once

on:
  push:
    branches:
      - codex/meridian-v7-37-mobile-ui-polish

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/meridian-v7-37-mobile-ui-polish
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install current locked dependencies
        run: npm ci --ignore-scripts
      - name: Synchronize v7.37 release artifacts
        run: node scripts/release-sync.mjs --write
      - name: Refresh package lock root version
        run: npm install --package-lock-only --ignore-scripts
      - name: Validate final release
        run: |
          node --check app-v6.06.js
          node --check app-v7.33-hardening.js
          node --check app-runtime-monitor.js
          node --check app-v7.37-ui-polish.js
          node --check server-gateway.js
          node --test test/*.test.js
          node scripts/release-sync.mjs --check
          node scripts/release-check.mjs
          node scripts/privacy-check.mjs
          node scripts/secret-check.mjs
          grep -F 'if(!config.paperTrading||config.liveTrading) throw new Error("Unsafe configuration: PAPER only required.");' server.js
      - name: Remove one-time workflow and commit generated release
        run: |
          rm .github/workflows/v737-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'MERIDIAN v7.37: finalize mobile UI polish release'
          git push origin HEAD:codex/meridian-v7-37-mobile-ui-polish
