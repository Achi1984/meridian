name: Meridian Solana Meme Paper Bot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/memecoin-paper/research/launches/meme-account-20261120.json']
permissions:
  contents: read
concurrency:
  group: meridian-meme-paper-account
  cancel-in-progress: false
jobs:
  paper:
    runs-on: ubuntu-latest
    outputs:
      dashboard: ${{ steps.dashboard.outputs.report }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check paper rules and accounting
        run: python3 -m unittest discover -s scripts/memecoin-paper/research
      - name: Verify hosted discovery and Jupiter quotes
        working-directory: scripts/memecoin-paper/research
        run: |
          python3 - <<'PY'
          from new_pool_watch import GT, SIZE, USDC, WSOL, get, snapshot, spot_quote
          items=get(GT+'/new_pools?page=1',120)['data']
          assert items and any(snapshot(p)['price'] > 0 for p in items)
          tokens=spot_quote(USDC,WSOL,SIZE)
          assert spot_quote(WSOL,USDC,tokens)>0
          print('Public discovery and bidirectional quote verified')
          PY
      - name: Run virtual USDC spot account
        run: |
          mkdir -p meme-account
          python3 -u scripts/memecoin-paper/research/new_pool_watch.py meme-account/session --ticks 60 --paper-account meme-account/ledger.sqlite
      - name: Publish account statement
        if: always()
        working-directory: scripts/memecoin-paper/research
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['GITHUB_WORKSPACE'])/'meme-account/session/summary.json'
          if root.exists():
              s=json.loads(root.read_text())
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
                  f.write('### Virtual spot account (USDC)\n\n')
                  for k,v in s['account'].items():
                      f.write(f'- {k}: {v}\n')
                  f.write(f"\nObserved pools: {s['pools']}; completed ticks: {s['ticks']}\n")
          PY
      - name: Audit entry funnel
        if: success()
        run: python3 scripts/memecoin-paper/research/pool_funnel.py meme-account/session >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare public paper account totals
        id: dashboard
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          data=json.loads(Path('meme-account/session/funnel.json').read_text())
          a=data['account']
          exceptions=data['decisionExceptions'] or {}
          report=dict(schema=1,runId=int(os.environ['GITHUB_RUN_ID']),attempt=int(os.environ['GITHUB_RUN_ATTEMPT']),
                      at=datetime.now(timezone.utc).isoformat(),pools=data['distinctPools']['discovered'],
                      open=a['openPositions'],closed=a['closedTrades'],realized=a['realizedPnlUsdc'],
                      equity=a['equityUsdc'],withdrawn=exceptions.get('signalWithdrawn'),
                      expired=exceptions.get('signalExpired'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              print('report='+json.dumps(report,allow_nan=False),file=f)
          PY
      - name: Retain fills, positions and quotes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meme-paper-account-${{ github.run_id }}-${{ github.run_attempt }}
          path: meme-account/
          if-no-files-found: warn
          retention-days: 30

  publish-paper-totals:
    needs: paper
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/github-script@v7
        env:
          REPORT: ${{ needs.paper.outputs.dashboard }}
        with:
          script: |
            const report = JSON.parse(process.env.REPORT);
            const branch = 'paper-dashboard-data';
            const path = 'solana-meme.json';
            const { owner, repo } = context.repo;
            let sha;
            try {
              const { data } = await github.rest.repos.getContent({owner, repo, path, ref:branch});
              const previous = JSON.parse(Buffer.from(data.content,'base64').toString('utf8'));
              if (previous.runId > report.runId ||
                  (previous.runId === report.runId && previous.attempt >= report.attempt)) return;
              sha = data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path,branch,sha,
              message:'Update completed Solana paper account totals',
              content:Buffer.from(JSON.stringify(report)+'\n').toString('base64')});
