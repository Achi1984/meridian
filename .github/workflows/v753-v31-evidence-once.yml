name: MERIDIAN v7.53 Challenger V3.1 Evidence Once

on:
  push:
    branches:
      - codex/meridian-v7-53-challenger-v31
    paths:
      - .github/workflows/v753-v31-evidence-once.yml

permissions:
  contents: write

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/meridian-v7-53-challenger-v31
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Wire V3.1 into research backtest
        run: node scripts/v753-wire-v31.mjs
      - name: Verify tests and syntax
        run: npm test && node --check challenger-v31.js && node --check cloud-backtest.js
      - name: Use Binance public market-data endpoint in CI
        run: sed -i "s#https://api.binance.com#https://data-api.binance.vision#g" cloud-backtest.js
      - name: Run V3.1 historical evidence
        run: node scripts/challenger-v31-evidence.mjs
      - name: Restore canonical market endpoint
        run: git checkout -- cloud-backtest.js && node scripts/v753-wire-v31.mjs
      - name: Commit evidence and self-remove
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v753-v31-evidence-once.yml scripts/v753-wire-v31.mjs
          git add cloud-backtest.js challenger-v31.js test/challenger-v31.test.js scripts/challenger-v31-evidence.mjs research/challenger-v31-evidence-v753.json research/challenger-v31-evidence-v753.md
          git commit -m "MERIDIAN v7.53: Challenger V3.1 historical evidence"
          git push origin HEAD:codex/meridian-v7-53-challenger-v31
