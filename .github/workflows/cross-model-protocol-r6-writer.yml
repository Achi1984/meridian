name: Cross Model Protocol R6 Writer
on:
  push:
    branches: [infra/process-governance-r6]
    paths: [.github/workflows/cross-model-protocol-r6-writer.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Patch protocol
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          EXPECTED_PARENT: f853f1754046015091f7a8fe0d52afb8bee56880
        run: |
          set -euo pipefail
          test "$EVENT_BEFORE" = "$EXPECTED_PARENT"
          test "$(git hash-object MERIDIAN_CROSS_MODEL_PROTOCOL.md)" = 089280ae544decf141087208c8ec52330ee1e4b3
          python3 - <<'PY'
          from pathlib import Path
          p=Path("MERIDIAN_CROSS_MODEL_PROTOCOL.md"); s=p.read_text()
          pairs=[
          ("- Verbindliche Mailbox ist `MERIDIAN_LIVE_CHECKPOINT.json.mailboxIssue`; aktuell **#571**. #539 ist Vorgänger und wird erst nach erfolgreichem R5-Smoke archiviert.","- Verbindliche Mailbox ist `MERIDIAN_LIVE_CHECKPOINT.json.mailboxIssue`; aktuell **#571**."),
          ("3. Claude reviewt den exakten PR-HEAD-SHA: `REVIEW <SHA>: GREEN LIGHT` oder `REVIEW <SHA>: REVISION REQUIRED` (Befund, Schwere, Beleg, geforderter Test).","3. Claude reviewt den exakten PR-HEAD-SHA. Jedes GREEN LIGHT muss einen Abschnitt `Executed checks` mit den tatsächlich ausgeführten read-only Befehlen und Ergebnissen enthalten. Kann ein für Scope/Request verpflichtender Check nicht laufen, ist GREEN LIGHT verboten; Ergebnis ist REVISION REQUIRED oder BLOCKED mit Begründung."),
          ("5. Trivial (Text, Tests, CI-Fix ohne Research-Logik): Merge ohne Cross-Model-Review erlaubt, im PR `Cross-model review: skipped (trivial)` vermerken. Datenvertrag, Source Receipt, Split/Stage-Lock, Accounting, Strategy-PnL, Stage-Übergänge: Review Pflicht.","5. Trivial (Text, Tests, CI-Fix ohne Research-Logik) kann ohne Cross-Model-Review bleiben. Datenvertrag, Source Receipt, Split/Stage-Lock, Accounting, Strategy-PnL, Stage-Übergänge sowie Agenten-Spielregeln/Workflow-Berechtigungen sind nie trivial und reviewpflichtig.")
          ]
          for a,b in pairs:
              assert s.count(a)==1,(a,s.count(a)); s=s.replace(a,b)
          p.write_text(s)
          PY
          node scripts/continuity-audit.mjs
          node scripts/frozen-research-guard.mjs
          git diff --check
          rm .github/workflows/cross-model-protocol-r6-writer.yml
          test "$(git diff --name-only | sort | tr '\n' ' ')" = ".github/workflows/cross-model-protocol-r6-writer.yml MERIDIAN_CROSS_MODEL_PROTOCOL.md "
          git config user.name "MERIDIAN Governance Writer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Infra: require verifiable cross-model reviews"
          git push origin HEAD:infra/process-governance-r6
