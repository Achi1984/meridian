name: MERIDIAN v7.44 Finalize Once

on:
  push:
    branches:
      - codex/meridian-v7-44-brand-asset-final

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/meridian-v7-44-brand-asset-final
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/release-sync.mjs --write
      - run: npm install --package-lock-only --ignore-scripts
      - run: node --check app-v7.37-ui-polish.js
      - run: npm test
      - run: npm run release:check
      - run: git rm .github/workflows/v7-44-finalize-once.yml
      - name: Commit finalized release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'MERIDIAN v7.44: finalize brand image release'
          git push origin HEAD:codex/meridian-v7-44-brand-asset-final
