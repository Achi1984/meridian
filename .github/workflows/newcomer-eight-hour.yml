name: Meridian eight-hour ABC paper comparison
on:
  workflow_dispatch:
  push:
    branches: [paper/abc-eight-hour-20261123]
    paths: ['.github/workflows/newcomer-eight-hour.yml']
permissions:
  contents: read
concurrency:
  group: newcomer-eight-hour-abc
  cancel-in-progress: false
jobs:
  first:
    runs-on: ubuntu-latest
    timeout-minutes: 310
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python scripts/memecoin-paper/research/newcomer_eight_hour.py campaign 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: abc-first
          path: campaign/
  finish:
    needs: first
    runs-on: ubuntu-latest
    timeout-minutes: 270
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: abc-first
          path: campaign
      - run: python scripts/memecoin-paper/research/newcomer_eight_hour.py campaign 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: abc-final
          path: campaign/
