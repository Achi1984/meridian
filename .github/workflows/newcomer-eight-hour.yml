name: Meridian overnight staged exits
on:
  workflow_dispatch:
  push:
    branches: [paper/overnight-staged-exits]
    paths: ['.github/workflows/newcomer-eight-hour.yml']
permissions:
  contents: read
concurrency:
  group: newcomer-staged-exits
  cancel-in-progress: false
jobs:
  first:
    runs-on: ubuntu-latest
    timeout-minutes: 310
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python -m unittest discover -s scripts/memecoin-paper/research -p test_eight_hour_exits.py
      - run: python scripts/memecoin-paper/research/newcomer_eight_hour.py campaign 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: abc-first
          path: campaign/
  finish:
    needs: first
    runs-on: ubuntu-latest
    timeout-minutes: 270
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: abc-first
          path: campaign
      - run: python -m unittest discover -s scripts/memecoin-paper/research -p test_eight_hour_exits.py
      - run: python scripts/memecoin-paper/research/newcomer_eight_hour.py campaign 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: abc-final
          path: campaign/
