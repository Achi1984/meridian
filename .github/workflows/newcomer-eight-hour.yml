name: Meridian overnight staged exits
run-name: Compare recovery exits A through F
on:
  workflow_dispatch:
  push:
    branches: [paper/overnight-staged-exits]
    paths: ['.github/workflows/newcomer-eight-hour.yml']
permissions:
  contents: read
concurrency:
  group: newcomer-staged-exits
  cancel-in-progress: false
jobs:
  first:
    runs-on: ubuntu-latest
    timeout-minutes: 310
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python -m unittest discover -s scripts/memecoin-paper/research -p test_eight_hour_exits.py
      - run: python scripts/memecoin-paper/research/newcomer_eight_hour.py campaign 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: abc-first
          path: campaign/
  finish:
    needs: first
    runs-on: ubuntu-latest
    timeout-minutes: 270
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: abc-first
          path: campaign
      - run: python -m unittest discover -s scripts/memecoin-paper/research -p test_eight_hour_exits.py
      - run: python scripts/memecoin-paper/research/newcomer_eight_hour.py campaign 2
      - name: Verify final journal against all six paper accounts
        working-directory: scripts/memecoin-paper/research
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from campaign_ledger import verify_journal
          from meme_paper_account import START, FEE
          campaign = Path("../../../campaign")
          status = json.loads((campaign / "status.json").read_text())
          if (status["lastEvent"] != "finished" or status.get("ledgerVerified") is not True
                  or set(status["accounts"]) != set("ABCDEF")):
              raise ValueError("Incomplete campaign or missing journal verification")
          verify_journal(campaign / "events.jsonl", status["accounts"], START, FEE)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: abc-final
          path: campaign/
