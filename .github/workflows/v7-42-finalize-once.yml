name: MERIDIAN v7.42 Finalize Once

on:
  push:
    branches:
      - codex/meridian-v7-42-compact-header

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/release-sync.mjs --write
      - run: npm install --package-lock-only --ignore-scripts
      - run: node --check app-v7.37-ui-polish.js
      - run: npm test
      - run: npm run release:check
      - run: git rm .github/workflows/v7-42-finalize-once.yml
      - name: Commit finalized release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "MERIDIAN v7.42: finalize compact header release"
          git push
