name: MERIDIAN Paper Bot Profit Discovery V1

on:
  push:
    branches:
      - research-profit-discovery-v1
    paths:
      - "research/paperbot-profit-special-agent-v1.js"
      - "research/run-paperbot-profit-discovery.mjs"
      - ".github/workflows/research-profit-discovery-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run frozen 1460-day discovery
        run: node research/run-paperbot-profit-discovery.mjs
      - name: Upload untouched discovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: paperbot-profit-discovery-v1
          path: |
            research/results/paperbot-profit-discovery-v1-summary.json
            research/results/paperbot-profit-discovery-v1-full.json
            research/results/paperbot-profit-discovery-v1.md
          if-no-files-found: error
          retention-days: 30
