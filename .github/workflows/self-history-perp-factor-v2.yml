name: MERIDIAN Self-History Perpetual Factor V2

on:
  push:
    branches:
      - research/self-history-perp-factor-v2
    paths:
      - "research/SELF-HISTORY-PERP-FACTOR-V2-FROZEN.md"
      - "research/self_history_perp_factor_v2.py"
      - "research/run-self-history-perp-factor-v2.py"
      - "scripts/collect-self-history-perp-factor-v2.py"
      - "test/test_self_history_perp_factor_v2.py"
      - ".github/workflows/self-history-perp-factor-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: self-history-perp-factor-v2
  cancel-in-progress: true

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen V2 invariants
        run: python3 -m unittest test/test_self_history_perp_factor_v2.py
      - name: Collect official Binance Vision factor archives
        run: python3 scripts/collect-self-history-perp-factor-v2.py
      - name: Run first frozen V2 discovery
        run: python3 research/run-self-history-perp-factor-v2.py
      - name: Upload untouched discovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: self-history-perp-factor-v2
          path: |
            research/results/self-history-perp-factor-v2-summary.json
            research/results/self-history-perp-factor-v2-full.json
            research/results/self-history-perp-factor-v2.md
          if-no-files-found: error
          retention-days: 30
