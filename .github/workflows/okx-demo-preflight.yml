name: OKX EEA demo connection check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/research/okx_demo_preflight.py
      - .github/workflows/okx-demo-preflight.yml
permissions:
  contents: read
jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test demo credentials, BTC swap eligibility and initial exposure
        env:
          OKX_DEMO_API_KEY: ${{ secrets.OKX_DEMO_API_KEY }}
          OKX_DEMO_SECRET_KEY: ${{ secrets.OKX_DEMO_SECRET_KEY }}
          OKX_DEMO_PASSPHRASE: ${{ secrets.OKX_DEMO_PASSPHRASE }}
        run: python3 scripts/research/okx_demo_preflight.py
