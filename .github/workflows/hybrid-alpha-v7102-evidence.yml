name: Hybrid Alpha v7.102 Correlation Cluster Evidence
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'hybrid-alpha-portfolio-v7102.js'
      - 'scripts/hybrid-alpha-v7102-evidence.mjs'
      - 'test/hybrid-alpha-portfolio-v7102.test.js'
      - 'research/hybrid-alpha-v7102-correlation-cluster-design.md'
      - '.github/workflows/hybrid-alpha-v7102-evidence.yml'
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/hybrid-alpha-portfolio-v7102.test.js
      - name: Build frozen v7.93 evidence
        env:
          HYBRID_SYMBOLS: BTCUSDT,ETHUSDT,SOLUSDT,XRPUSDT,ADAUSDT,AVAXUSDT,LINKUSDT
          HYBRID_WINDOWS: 30,60,90
        run: node scripts/hybrid-alpha-v790-evidence.mjs
      - run: node scripts/hybrid-alpha-v796-evidence.mjs
      - run: node scripts/hybrid-alpha-v797-evidence.mjs
      - run: node scripts/hybrid-alpha-v7102-evidence.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: hybrid-alpha-v7102-evidence
          path: artifacts/hybrid-alpha-v7102-evidence.json
          if-no-files-found: error
