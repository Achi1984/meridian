name: R122 Release Identity Finalizer
on:
  push:
    branches:
      - v10-r122-top-fold-simplification
    paths:
      - .github/workflows/r122-release-identity-finalizer.yml
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Guard finalize self-delete
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          EXPECTED_PARENT: 4e9436f9f305cf8e4fc91b77572af4f412c62216
          TARGET_BRANCH: v10-r122-top-fold-simplification
        run: |
          set -euo pipefail
          test "$EVENT_BEFORE" = "$EXPECTED_PARENT"
          test "$(git hash-object v9/v9.js)" = a63099763cea1e8ad53a6cae410de0c69a4d3b23
          test "$(git hash-object v9/index.html)" = 54907880374f496ade4311b78ac0bbfeaf34e4dc
          test "$(git hash-object MERIDIAN_RESUME.json)" = 2e1acd1b1221d25c581abffc7c797f822f2ffcab
          test "$(git hash-object MERIDIAN_LIVE_CHECKPOINT.json)" = edfd90708994aa21921d0a1d040e02672455593b
          test "$(git hash-object docs/MERIDIAN_CHAT_HANDOFF.md)" = 88f9287a85c46581a7727e559778748e5bfb849d
          python3 - <<'PY'
          from pathlib import Path
          def rep(path,old,new,n=1):
              p=Path(path); b=p.read_bytes(); o=old.encode(); q=new.encode()
              assert b.count(o)==n,(path,b.count(o),n)
              a=b.replace(o,q); assert a.count(o)==0
              p.write_bytes(a)
          rep("v9/v9.js","10.0-r121","10.0-r122",2)
          rep("v9/v9.js","qs.set('build','r121')","qs.set('build','r122')")
          rep("v9/index.html","p.set('build','r121')","p.set('build','r122')")
          rep("MERIDIAN_RESUME.json",'"build": "10.0-r121"','"build": "10.0-r122"')
          rep("MERIDIAN_LIVE_CHECKPOINT.json",'"terminalBuild": "10.0-r121"','"terminalBuild": "10.0-r122"')
          rep("docs/MERIDIAN_CHAT_HANDOFF.md","Build: **10.0-r121**","Build: **10.0-r122**")
          PY
          node --check v9/v9.js
          node -e "const f=require('fs');JSON.parse(f.readFileSync('MERIDIAN_RESUME.json'));JSON.parse(f.readFileSync('MERIDIAN_LIVE_CHECKPOINT.json'))"
          rm .github/workflows/r122-release-identity-finalizer.yml
          git diff --check
          printf '%s\n' .github/workflows/r122-release-identity-finalizer.yml MERIDIAN_LIVE_CHECKPOINT.json MERIDIAN_RESUME.json docs/MERIDIAN_CHAT_HANDOFF.md v9/index.html v9/v9.js | sort >/tmp/e
          git diff --name-only | sort >/tmp/a
          diff -u /tmp/e /tmp/a
          git config user.name "MERIDIAN R122 Finalizer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "R122: finalize release identity"
          git push origin HEAD:"$TARGET_BRANCH"
