name: Paper Execution Audit V1
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'paper-execution-audit.js'
      - 'scripts/paper-execution-audit.mjs'
      - 'test/paper-execution-audit.test.js'
      - 'research/paper-execution-audit-v1-*.md'
      - '.github/workflows/paper-execution-audit-v1.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/paper-execution-audit.test.js
      - run: node scripts/paper-execution-audit.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: paper-execution-audit-v1
          path: artifacts/paper-execution-audit-v1.json
          if-no-files-found: error
