name: MERIDIAN v7.52 Challenger V3 Finalize Once

on:
  push:
    branches:
      - codex/meridian-v7-52-challenger-v3
    paths:
      - .github/workflows/v752-challenger-v3-finalize-once.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/meridian-v7-52-challenger-v3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Wire Challenger V3 into research backtest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('cloud-backtest.js'); s=p.read_text()
          imp="import { challengerV3Decision, CHALLENGER_V3_RULESET } from './challenger-v3.js';"
          anchor="import { replayExitLabForLedgers } from './exit-lab-replay.js';"
          if imp not in s:
            assert anchor in s
            s=s.replace(anchor,anchor+'\n'+imp)

          old="function replayPrepared(events,start,end,cfg=CLOUD_BT_CONFIG){const ledgers={baseline:makeLedger('BASELINE',cfg),shadow:makeLedger('SHADOW_V1',cfg),challenger:makeLedger('CHALLENGER_V2',cfg),regime:makeLedger('REGIME_V1',cfg)},lastPrices={};for(const ev of events){if(ev.t<start||ev.t>end)continue;for(const [s,c] of Object.entries(ev.candles))lastPrices[s]=c.close;for(const L of Object.values(ledgers)){processExits(L,ev.candles,ev.t,cfg);markLedger(L,lastPrices,ev.t,cfg)}for(const sig of Object.values(ev.signals)){if(sig.status==='READY'){const L=ledgers.baseline,g=gate(L,sig,cfg.riskPerTradePct,ev.t,cfg);if(g.ok)openPosition(L,sig,cfg.riskPerTradePct,ev.t,{modelDecision:'BASELINE'},cfg)}const sd=shadowDecision(sig);if(sd.decision==='TRADE'){const L=ledgers.shadow,g=gate(L,sig,sd.riskPct,ev.t,cfg);if(g.ok)openPosition(L,sig,sd.riskPct,ev.t,{modelDecision:'TRADE'},cfg)}const cd=challengerDecision(sig,cfg);if(cd.decision==='TRADE'||cd.decision==='CAUTION'){const L=ledgers.challenger,g=gate(L,sig,cd.riskPct,ev.t,cfg);if(g.ok)openPosition(L,sig,cd.riskPct,ev.t,{modelDecision:cd.decision,confidence:cd.confidence},cfg)}const rd=regimeDecision(sig,{fullRiskPct:cfg.riskPerTradePct,cautionRiskPct:Math.max(.1,round(cfg.riskPerTradePct*.5,3))});if(rd.decision==='TRADE'||rd.decision==='CAUTION'){const rs={...sig,side:rd.side,entry:rd.entry,sl:rd.sl,tp1:rd.tp1,tp2:rd.tp2};const L=ledgers.regime,g=gate(L,rs,rd.riskPct,ev.t,cfg);if(g.ok)openPosition(L,rs,rd.riskPct,ev.t,{modelDecision:rd.decision,regimeType:rd.regime,regimeScore:rd.score,sourceSide:rd.sourceSide},cfg)}}for(const L of Object.values(ledgers))markLedger(L,lastPrices,ev.t,cfg)}const lastT=Math.min(end,events.filter(x=>x.t<=end).at(-1)?.t??end);for(const L of Object.values(ledgers)){for(const p of [...L.positions]){const px=lastPrices[p.symbol];if(px>0)closePosition(L,p,px,lastT,'EOD',cfg)}L.positions=[];markLedger(L,lastPrices,lastT,cfg)}return{baseline:stats(ledgers.baseline,cfg),shadow:stats(ledgers.shadow,cfg),challenger:stats(ledgers.challenger,cfg),regime:stats(ledgers.regime,cfg)}}"
          new="function replayPrepared(events,start,end,cfg=CLOUD_BT_CONFIG){const ledgers={baseline:makeLedger('BASELINE',cfg),shadow:makeLedger('SHADOW_V1',cfg),challenger:makeLedger('CHALLENGER_V2',cfg),challengerV3:makeLedger('CHALLENGER_V3',cfg),regime:makeLedger('REGIME_V1',cfg)},lastPrices={};for(const ev of events){if(ev.t<start||ev.t>end)continue;for(const [s,c] of Object.entries(ev.candles))lastPrices[s]=c.close;for(const L of Object.values(ledgers)){processExits(L,ev.candles,ev.t,cfg);markLedger(L,lastPrices,ev.t,cfg)}for(const sig of Object.values(ev.signals)){if(sig.status==='READY'){const L=ledgers.baseline,g=gate(L,sig,cfg.riskPerTradePct,ev.t,cfg);if(g.ok)openPosition(L,sig,cfg.riskPerTradePct,ev.t,{modelDecision:'BASELINE'},cfg)}const sd=shadowDecision(sig);if(sd.decision==='TRADE'){const L=ledgers.shadow,g=gate(L,sig,sd.riskPct,ev.t,cfg);if(g.ok)openPosition(L,sig,sd.riskPct,ev.t,{modelDecision:'TRADE'},cfg)}const cd=challengerDecision(sig,cfg);if(cd.decision==='TRADE'||cd.decision==='CAUTION'){const L=ledgers.challenger,g=gate(L,sig,cd.riskPct,ev.t,cfg);if(g.ok)openPosition(L,sig,cd.riskPct,ev.t,{modelDecision:cd.decision,confidence:cd.confidence},cfg)}const c3=challengerV3Decision(sig,{fullRiskPct:cfg.riskPerTradePct,cautionRiskPct:Math.max(.1,round(cfg.riskPerTradePct*.5,3))});if(c3.decision==='TRADE'||c3.decision==='CAUTION'){const L=ledgers.challengerV3,g=gate(L,sig,c3.riskPct,ev.t,cfg);if(g.ok)openPosition(L,sig,c3.riskPct,ev.t,{modelDecision:c3.decision,confidence:c3.confidence,challengerRuleset:CHALLENGER_V3_RULESET,baselineStatusAtEntry:sig.status,baselineReadyDependency:false},cfg)}const rd=regimeDecision(sig,{fullRiskPct:cfg.riskPerTradePct,cautionRiskPct:Math.max(.1,round(cfg.riskPerTradePct*.5,3))});if(rd.decision==='TRADE'||rd.decision==='CAUTION'){const rs={...sig,side:rd.side,entry:rd.entry,sl:rd.sl,tp1:rd.tp1,tp2:rd.tp2};const L=ledgers.regime,g=gate(L,rs,rd.riskPct,ev.t,cfg);if(g.ok)openPosition(L,rs,rd.riskPct,ev.t,{modelDecision:rd.decision,regimeType:rd.regime,regimeScore:rd.score,sourceSide:rd.sourceSide},cfg)}}for(const L of Object.values(ledgers))markLedger(L,lastPrices,ev.t,cfg)}const lastT=Math.min(end,events.filter(x=>x.t<=end).at(-1)?.t??end);for(const L of Object.values(ledgers)){for(const p of [...L.positions]){const px=lastPrices[p.symbol];if(px>0)closePosition(L,p,px,lastT,'EOD',cfg)}L.positions=[];markLedger(L,lastPrices,lastT,cfg)}return{baseline:stats(ledgers.baseline,cfg),shadow:stats(ledgers.shadow,cfg),challenger:stats(ledgers.challenger,cfg),challengerV3:stats(ledgers.challengerV3,cfg),regime:stats(ledgers.regime,cfg)}}"
          assert old in s, 'replayPrepared target changed'
          s=s.replace(old,new)

          old="const r=replayPrepared(events,from,to,cfg),baseline=compactStats(r.baseline),shadow=compactStats(r.shadow),challenger=compactStats(r.challenger),regime=compactStats(r.regime);\n    windows.push({i:i+1,from,to,...baseline,baseline,shadow,challenger,regime});"
          new="const r=replayPrepared(events,from,to,cfg),baseline=compactStats(r.baseline),shadow=compactStats(r.shadow),challenger=compactStats(r.challenger),challengerV3=compactStats(r.challengerV3),regime=compactStats(r.regime);\n    windows.push({i:i+1,from,to,...baseline,baseline,shadow,challenger,challengerV3,regime});"
          assert old in s, 'continuous window target changed'
          s=s.replace(old,new)
          old="variantStability('CHALLENGER V2','challenger',windows,whole.challenger),\n      variantStability('REGIME V1','regime',windows,whole.regime)"
          new="variantStability('CHALLENGER V2','challenger',windows,whole.challenger),\n      variantStability('CHALLENGER V3','challengerV3',windows,whole.challengerV3),\n      variantStability('REGIME V1','regime',windows,whole.regime)"
          assert old in s, 'stability target changed'
          s=s.replace(old,new)

          old="ledgers:{baseline:ledgers.baseline.tradeList,shadow:ledgers.shadow.tradeList,challenger:ledgers.challenger.tradeList,regime:ledgers.regime.tradeList},"
          new="ledgers:{baseline:ledgers.baseline.tradeList,shadow:ledgers.shadow.tradeList,challenger:ledgers.challenger.tradeList,regime:ledgers.regime.tradeList},"
          # Deliberately do NOT add V3 to Exit Lab yet; D-018 requires initial A_CURRENT-only evaluation.
          assert old in s

          old="regime:{...compactStats(ledgers.regime),tradeList:ledgers.regime.tradeList,equityCurve:ledgers.regime.equityCurve,byAsset:assetBreakdown(ledgers.regime.tradeList)}},researchContinuous"
          new="challengerV3:{...compactStats(ledgers.challengerV3),tradeList:ledgers.challengerV3.tradeList,equityCurve:ledgers.challengerV3.equityCurve,byAsset:assetBreakdown(ledgers.challengerV3.tradeList)},regime:{...compactStats(ledgers.regime),tradeList:ledgers.regime.tradeList,equityCurve:ledgers.regime.equityCurve,byAsset:assetBreakdown(ledgers.regime.tradeList)}},researchContinuous"
          assert old in s, 'result ledger target changed'
          s=s.replace(old,new)
          s=s.replace("version:'7.49-EXIT-LAB-REPLAY-V1'","version:'7.52-CHALLENGER-V3-RESEARCH'",1)
          p.write_text(s)
          PY
      - name: Update release metadata
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p='version.json',v=JSON.parse(fs.readFileSync(p,'utf8'));
          Object.assign(v,{version:'7.52',ui:'7.52',buildId:'7.52-20260902-R1',challengerResearch:'7.52-CHALLENGER-V3',exitLabEvidence:'7.51-EXIT-LAB-EVIDENCE-V1',release:'v7.52 Challenger V3: independent soft-score research backtest ledger over full valid scanner universe; Baseline READY is soft evidence only; A_CURRENT exit retained; Paper execution unchanged'});
          fs.writeFileSync(p,JSON.stringify(v));
          NODE
      - name: Extend release checks
        run: |
          cat >> scripts/release-check.mjs <<'EOF'

// v7.52 Challenger V3 research-only continuity guards
must(release.challengerResearch==='7.52-CHALLENGER-V3','Challenger V3 metadata mismatch');
must(release.exitLabEvidence==='7.51-EXIT-LAB-EVIDENCE-V1','Exit Lab evidence metadata missing');
must(fs.existsSync('challenger-v3.js'),'Challenger V3 module missing');
const c3=read('challenger-v3.js');
must(c3.includes("CHALLENGER_V3_RULESET='7.52-CHALLENGER-V3'"),'Challenger V3 ruleset mismatch');
must(c3.includes('baselineReadyDependency:false'),'Challenger V3 READY-independence marker missing');
const cloud752=read('cloud-backtest.js');
must(cloud752.includes("makeLedger('CHALLENGER_V3'"),'Challenger V3 independent ledger missing');
must(cloud752.includes("variantStability('CHALLENGER V3'"),'Challenger V3 walk-forward missing');
must(cloud752.includes('baselineStatusAtEntry:sig.status'),'Challenger V3 baseline status telemetry missing');
must(!cloud752.includes('challengerV3:ledgers.challengerV3.tradeList'),'Challenger V3 must not enter Exit Lab before initial entry evaluation');
EOF
      - name: Sync release files
        run: node scripts/release-sync.mjs --write
      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify syntax and tests
        run: |
          node --check challenger-v3.js
          node --check cloud-backtest.js
          npm test
          node scripts/release-sync.mjs --check
          node scripts/release-check.mjs
      - name: Remove workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v752-challenger-v3-finalize-once.yml
          git add challenger-v3.js test/challenger-v3.test.js cloud-backtest.js version.json scripts/release-check.mjs index.html app-v6.06.js app-v7.33-hardening.js manifest.webmanifest package.json package-lock.json
          git commit -m "Finalize MERIDIAN v7.52 Challenger V3 [v7.52-finalized]"
          git push origin HEAD:codex/meridian-v7-52-challenger-v3
