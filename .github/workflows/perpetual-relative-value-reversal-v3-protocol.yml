name: MERIDIAN Relative-Value Reversal V3 Protocol Invariants

on:
  push:
    branches:
      - research/perpetual-relative-value-reversal-v3-protocol
    paths:
      - "research/PERPETUAL-RELATIVE-VALUE-REVERSAL-V3-FROZEN.md"
      - "research/perpetual-relative-value-reversal-v3-protocol.json"
      - "research/perpetual_relative_value_reversal_v3.py"
      - "test/test_perpetual_relative_value_reversal_v3.py"
      - ".github/workflows/perpetual-relative-value-reversal-v3-protocol.yml"
  pull_request:
    paths:
      - "research/PERPETUAL-RELATIVE-VALUE-REVERSAL-V3-FROZEN.md"
      - "research/perpetual-relative-value-reversal-v3-protocol.json"
      - "research/perpetual_relative_value_reversal_v3.py"
      - "test/test_perpetual_relative_value_reversal_v3.py"
      - ".github/workflows/perpetual-relative-value-reversal-v3-protocol.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perpetual-relative-value-reversal-v3-protocol-${{ github.ref }}
  cancel-in-progress: true

jobs:
  invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify engine syntax
        run: python3 -m py_compile research/perpetual_relative_value_reversal_v3.py
      - name: Run frozen V1 foundation regression
        run: python3 test/test_perpetual_cross_sectional_reversal_v1.py
      - name: Run V3 protocol invariants
        run: python3 test/test_perpetual_relative_value_reversal_v3.py
      - name: Assert no V3 validation runner exists in protocol PR
        run: |
          test ! -e research/run-perpetual-relative-value-reversal-v3.py
          test ! -e scripts/collect-perpetual-relative-value-reversal-v3.py
