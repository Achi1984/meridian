name: OKX BTC X-Perp filled demo round trip
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: okx-btc-single-demo-order
  cancel-in-progress: false
jobs:
  demo:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify the minimum-size demo entry, reduce-only exit and PnL
        env:
          OKX_DEMO_API_KEY: ${{ secrets.OKX_DEMO_API_KEY }}
          OKX_DEMO_SECRET_KEY: ${{ secrets.OKX_DEMO_SECRET_KEY }}
          OKX_DEMO_PASSPHRASE: ${{ secrets.OKX_DEMO_PASSPHRASE }}
        run: python3 scripts/research/okx_demo_round_trip.py
