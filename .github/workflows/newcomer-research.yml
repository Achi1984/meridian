name: Solana newcomer research
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/newcomer-research.yml']
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: scripts/memecoin-paper/research
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest test_newcomer_research test_pool_shadow
      - name: Collect independent paper watchlist
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 newcomer_research.py | tee newcomer-research.jsonl
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: newcomer-research
          path: scripts/memecoin-paper/research/newcomer-research.jsonl
