name: MERIDIAN Quarter-Hour Strategy V1

on:
  pull_request:
    paths:
      - "research/PERPETUAL-QUARTER-HOUR-BOUNDARY-IMBALANCE-STRATEGY-V1-IMPLEMENTATION.md"
      - "research/qh_boundary_strategy_v1_core.py"
      - "scripts/extract-qh-boundary-strategy-v1-shard.py"
      - "scripts/aggregate-qh-boundary-strategy-v1.py"
      - "scripts/build-qh-v13-source-lock.py"
      - "test/test_qh_boundary_strategy_v1.py"
      - ".github/workflows/qh-boundary-strategy-v1.yml"
  push:
    branches:
      - research/qh-boundary-strategy-v1-run
    paths:
      - "research/PERPETUAL-QUARTER-HOUR-BOUNDARY-IMBALANCE-STRATEGY-V1-RUN-AUTHORIZATION.md"

permissions:
  contents: read
  actions: read

concurrency:
  group: qh-boundary-strategy-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile deterministic Strategy V1 implementation
        run: |
          python3 -m py_compile \
            research/qh_boundary_strategy_v1_core.py \
            scripts/extract-qh-boundary-strategy-v1-shard.py \
            scripts/aggregate-qh-boundary-strategy-v1.py \
            scripts/build-qh-v13-source-lock.py
      - name: Run Strategy V1 synthetic invariants
        run: python3 test/test_qh_boundary_strategy_v1.py

  source-lock:
    if: github.event_name != 'pull_request'
    needs: invariants
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      QH_V13_EVIDENCE_DIR: research/results/qh-v13-source-evidence
      QH_V13_SOURCE_LOCK_OUTPUT: research/results/qh-v13-source-lock.json
    steps:
      - uses: actions/checkout@v4
      - name: Download all exact Data V1.3 shard evidence with pagination
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$QH_V13_EVIDENCE_DIR"
          mkdir -p "$QH_V13_EVIDENCE_DIR"
          gh api --method GET --paginate \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/36690368732/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | startswith("qh-v13-shard-")) | "\(.id) \(.name)"' \
            > /tmp/qh-v13-artifacts.txt
          count="$(wc -l < /tmp/qh-v13-artifacts.txt | tr -d ' ')"
          test "$count" = "120"
          while read -r artifact_id artifact_name; do
            dest="$QH_V13_EVIDENCE_DIR/$artifact_name"
            mkdir -p "$dest"
            curl -L --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
              -o /tmp/qh-v13-artifact.zip
            unzip -oq /tmp/qh-v13-artifact.zip -d "$dest"
          done < /tmp/qh-v13-artifacts.txt
      - name: Build exact Data V1.3 source checksum lock
        run: python3 scripts/build-qh-v13-source-lock.py
      - name: Upload exact source lock
        uses: actions/upload-artifact@v4
        with:
          name: qh-v13-source-lock
          path: research/results/qh-v13-source-lock.json
          if-no-files-found: error

  shard:
    if: github.event_name != 'pull_request'
    needs: [invariants, source-lock]
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        asset: [BTCUSDT, ETHUSDT, XRPUSDT, SOLUSDT, DOGEUSDT, ADAUSDT]
        month:
          - "2025-01"
          - "2025-02"
          - "2025-03"
          - "2025-04"
          - "2025-05"
          - "2025-06"
          - "2025-07"
          - "2025-08"
          - "2025-09"
          - "2025-10"
          - "2025-11"
          - "2025-12"
          - "2026-01"
          - "2026-02"
          - "2026-03"
          - "2026-04"
          - "2026-05"
          - "2026-06"
          - "2026-07"
          - "2026-08"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      QH_ASSET: ${{ matrix.asset }}
      QH_MONTH: ${{ matrix.month }}
      QH_STRATEGY_SHARD_OUTPUT_DIR: research/results/qh-strategy-v1-shard
      QH_V13_SOURCE_LOCK: research/results/qh-v13-source-lock.json
    steps:
      - uses: actions/checkout@v4
      - name: Download exact Data V1.3 source lock
        uses: actions/download-artifact@v4
        with:
          name: qh-v13-source-lock
          path: research/results
      - name: Extract frozen Strategy V1 compact source shard
        run: python3 scripts/extract-qh-boundary-strategy-v1-shard.py
      - name: Upload compact Strategy V1 source shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qh-strategy-v1-shard-${{ matrix.asset }}-${{ matrix.month }}
          path: research/results/qh-strategy-v1-shard/*.json
          if-no-files-found: error

  aggregate:
    if: github.event_name != 'pull_request' && always()
    needs: [invariants, shard]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      QH_STRATEGY_SHARDS_DIR: research/results/qh-strategy-v1-shards
      QH_STRATEGY_RESULT_DIR: research/results
    steps:
      - uses: actions/checkout@v4
      - name: Download all Strategy V1 shard artifacts with pagination
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$QH_STRATEGY_SHARDS_DIR"
          mkdir -p "$QH_STRATEGY_SHARDS_DIR"
          gh api --method GET --paginate \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | startswith("qh-strategy-v1-shard-")) | "\(.id) \(.name)"' \
            > /tmp/qh-strategy-v1-artifacts.txt
          count="$(wc -l < /tmp/qh-strategy-v1-artifacts.txt | tr -d ' ')"
          test "$count" = "120"
          while read -r artifact_id artifact_name; do
            dest="$QH_STRATEGY_SHARDS_DIR/$artifact_name"
            mkdir -p "$dest"
            curl -L --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
              -o /tmp/qh-strategy-v1-artifact.zip
            unzip -oq /tmp/qh-strategy-v1-artifact.zip -d "$dest"
          done < /tmp/qh-strategy-v1-artifacts.txt
      - name: Require 120 compact source shards and run frozen Strategy V1
        run: python3 scripts/aggregate-qh-boundary-strategy-v1.py
      - name: Upload Strategy V1 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qh-boundary-imbalance-strategy-v1-result
          path: research/results/quarter-hour-boundary-imbalance-strategy-v1-result.json
          if-no-files-found: error
\t' read -r artifact_id artifact_name; do
