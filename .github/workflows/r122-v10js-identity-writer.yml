name: R122 V10JS Identity Writer

on:
  push:
    branches:
      - v10-r122-top-fold-simplification
    paths:
      - .github/workflows/r122-v10js-identity-writer.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Guard, patch, verify and push
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          EXPECTED_PARENT: 0a5403ffe8855767e4784fa875d89a217c41f5ee
          EXPECTED_BLOB: 978b6dfcbcd46230bf0a2d1b1f6f2a8774e02931
          TARGET_BRANCH: v10-r122-top-fold-simplification
        run: |
          set -euo pipefail
          test "$EVENT_BEFORE" = "$EXPECTED_PARENT"
          test "$(git hash-object v10/v10.js)" = "$EXPECTED_BLOB"
          python3 - <<'PY'
          from pathlib import Path
          p=Path("v10/v10.js")
          b=p.read_bytes()
          old=b"10.0-r121"; new=b"10.0-r122"
          assert b.count(old)==7, b.count(old)
          assert b.count(new)==0, b.count(new)
          a=b.replace(old,new)
          assert a.count(old)==0 and a.count(new)==7
          p.write_bytes(a)
          PY
          node --check v10/v10.js
          git diff --check
          test "$(git diff --name-only)" = "v10/v10.js"
          test "$(git diff --numstat -- v10/v10.js)" = $'7\t7\tv10/v10.js'
          git config user.name "MERIDIAN R122 Writer"
          git config user.email "actions@users.noreply.github.com"
          git add v10/v10.js
          git commit -m "R122: sync v10 runtime identity"
          git push origin HEAD:"$TARGET_BRANCH"
