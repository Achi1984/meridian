name: FIB Level Bot V2 4h Replication

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'fib-level-bot-v1.js'
      - 'fib-level-bot-v2-replication.js'
      - 'scripts/fib-level-bot-v2-evidence.mjs'
      - 'test/fib-level-bot-v2-replication.test.js'
      - 'research/fib-level-bot-v2-4h-replication-design.md'
      - '.github/workflows/fib-level-bot-v2-evidence.yml'

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify frozen V2 gate
        run: node --test test/fib-level-bot-v1.test.js test/fib-level-bot-v2-replication.test.js
      - name: Run locked 4h replication evidence
        run: node scripts/fib-level-bot-v2-evidence.mjs
      - name: Upload V2 evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: fib-level-bot-v2-evidence
          path: artifacts/fib-level-bot-v2-evidence.json
          if-no-files-found: error
