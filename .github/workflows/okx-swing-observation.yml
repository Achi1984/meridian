name: OKX BTC swing signal observation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/spot-paper-advisor/okx_swing_observation.py
      - .github/workflows/okx-swing-observation.yml
permissions:
  contents: read
jobs:
  observe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Observe confirmed BTC sessions
        env:
          OKX_DEMO_API_KEY: ${{ secrets.OKX_DEMO_API_KEY }}
          OKX_DEMO_SECRET_KEY: ${{ secrets.OKX_DEMO_SECRET_KEY }}
          OKX_DEMO_PASSPHRASE: ${{ secrets.OKX_DEMO_PASSPHRASE }}
        run: python3 scripts/spot-paper-advisor/okx_swing_observation.py | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash
