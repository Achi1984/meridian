name: MERIDIAN QH V1.2 August Trade-ID Diagnostic

on:
  pull_request:
    paths:
      - "research/PERPETUAL-QUARTER-HOUR-BOUNDARY-IMBALANCE-DATA-V1-2-AUG-TRADE-ID-DIAGNOSTIC.md"
      - "scripts/diagnose-qh-v12-aug-trade-id-order.py"
      - "test/test_qh_v12_aug_trade_id_order.py"
      - ".github/workflows/qh-v12-aug-trade-id-order-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qh-v12-aug-trade-id-order-${{ github.ref }}
  cancel-in-progress: false

jobs:
  invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify diagnostic invariants
        run: python3 test/test_qh_v12_aug_trade_id_order.py

  diagnostic:
    needs: invariants
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        asset: [ETHUSDT, XRPUSDT, ADAUSDT]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      QH_ASSET: ${{ matrix.asset }}
      QH_OUTPUT_DIR: research/results/qh-v12-aug-trade-id-order
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose frozen V1.2 August trade-ID failure
        run: python3 scripts/diagnose-qh-v12-aug-trade-id-order.py
      - name: Upload compact diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qh-v12-aug-trade-id-order-${{ matrix.asset }}
          path: research/results/qh-v12-aug-trade-id-order/*.json
          if-no-files-found: error
