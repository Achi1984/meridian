name: MERIDIAN Adaptive Evidence v7.74

on:
  workflow_dispatch:
  push:
    branches: [research-v768-preserved-20260903]
    paths:
      - "adaptive-evidence-v774.js"
      - "scripts/adaptive-evidence-v774.mjs"
      - "test/adaptive-evidence-v774.test.js"
      - ".github/workflows/adaptive-evidence-v774.yml"

permissions:
  contents: write

concurrency:
  group: meridian-adaptive-evidence-v774
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research-v768-preserved-20260903
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Use Binance public market-data endpoint
        run: sed -i 's#https://api.binance.com#https://data-api.binance.vision#g' scripts/signal-cohort-v762.mjs
      - name: Generate four disjoint 90d cohorts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/signal-cohort-v762.mjs --out-dir /tmp/v774/p0
          for pair in "p1:90" "p2:180" "p3:270"; do
            name="${pair%%:*}"; days="${pair##*:}"
            end_at="$(date -u -d "${days} days ago" +'%Y-%m-%dT%H:%M:%SZ')"
            node scripts/signal-cohort-v762.mjs --out-dir "/tmp/v774/${name}" --end-at "${end_at}"
          done
      - name: Test v7.74 adaptive evidence
        run: node --test test/adaptive-evidence-v774.test.js test/challenger-v32.test.js
      - name: Build v7.74 evidence
        run: node scripts/adaptive-evidence-v774.mjs --p0 /tmp/v774/p0/signal-cohort-90d.json --p1 /tmp/v774/p1/signal-cohort-90d.json --p2 /tmp/v774/p2/signal-cohort-90d.json --p3 /tmp/v774/p3/signal-cohort-90d.json --out research/adaptive-evidence-v774.json
      - name: Build compact summary
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('research/adaptive-evidence-v774.json','utf8'));
          const out=['# MERIDIAN v7.74 — Adaptive Evidence Weighting','',`Generated: ${r.generatedAt}`,'','Research-only. Tests context-conditioned +0.5 bonuses on top of frozen Challenger V3.2. Equal coverage is mandatory. Baseline/Paper/UI unchanged.',''];
          for(const [policy,s] of Object.entries(r.summary||{})) out.push(`## ${policy}`,'',`AvgR better: **${s.avgRBetterPeriods}/${s.periods}**; PF better: **${s.pfBetterPeriods}/${s.periods}**; equal coverage: **${s.equalCoveragePeriods}/${s.periods}**; mean ΔAvgR=${s.avgAvgRDelta}; avoided losers=${s.totalAvoidedLosers}; missed winners=${s.totalMissedWinners}.`,'');
          out.push('## Decision','',r.winner?`Candidate for independent validation: **${r.winner}**.`:'No adaptive bonus passed the 3/4 persistence gate.','',`Promotion allowed: **${r.promotionAllowed}**. Next step: **${r.nextStep}**.`,'');
          fs.writeFileSync('research/adaptive-evidence-v774.md',out.join('\n'));
          NODE
      - name: Commit evidence to research branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- scripts/signal-cohort-v762.mjs
          git add research/adaptive-evidence-v774.json research/adaptive-evidence-v774.md
          if git diff --cached --quiet; then echo "No evidence change"; exit 0; fi
          git commit -m "MERIDIAN v7.74: adaptive evidence results"
          git push origin HEAD:research-v768-preserved-20260903
