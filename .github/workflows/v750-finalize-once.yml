name: MERIDIAN v7.50 Finalize Once

on:
  push:
    branches:
      - codex/meridian-v7-50-project-memory
    paths:
      - .github/workflows/v750-finalize-once.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/meridian-v7-50-project-memory
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Deterministic install
        run: npm ci
      - name: Extend release safety for continuity layer
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path='scripts/release-check.mjs';
          let s=fs.readFileSync(path,'utf8');
          const anchor="must(release.exitLabReplay==='7.49-FIXED-ENTRY-15M-REPLAY','Exit Lab fixed-entry replay metadata mismatch');";
          const add="\nmust(release.projectMemory==='7.50-CONTINUITY-V1','Project memory version mismatch');";
          if(!s.includes("release.projectMemory==='7.50-CONTINUITY-V1'")){
            if(!s.includes(anchor))throw new Error('project memory metadata anchor missing');
            s=s.replace(anchor,anchor+add);
          }
          const manifestAnchor="const manifest=json('manifest.webmanifest');";
          const checks=`const continuityFiles=['MERIDIAN_CONTEXT.md','MERIDIAN_DECISIONS.md','MERIDIAN_HANDOFF.md'];
          for(const f of continuityFiles)must(fs.existsSync(f),\`continuity file missing: \${f}\`);
          const context=read('MERIDIAN_CONTEXT.md');
          const decisions=read('MERIDIAN_DECISIONS.md');
          const handoff=read('MERIDIAN_HANDOFF.md');
          must(context.includes('Single source of truth for project continuity'),'canonical context marker missing');
          must(context.includes('Baseline 6.2 execution is a frozen reference'),'baseline freeze context missing');
          must(decisions.includes('Avoid over-filtering'),'over-filtering principle missing');
          must(decisions.includes('Research must never auto-promote'),'research promotion principle missing');
          must(decisions.includes('TP1 should transition into a protected runner in research'),'protected runner decision missing');
          must(handoff.includes('Challenger V3'),'next bot handoff missing');
          must(handoff.includes('Regime V2'),'regime v2 handoff missing');
          must(handoff.includes('read \`MERIDIAN_CONTEXT.md\`, \`MERIDIAN_DECISIONS.md\`, and \`MERIDIAN_HANDOFF.md\` first'),'new-chat startup instruction missing');

          `;
          if(!s.includes("continuity file missing:")){
            if(!s.includes(manifestAnchor))throw new Error('continuity insertion anchor missing');
            s=s.replace(manifestAnchor,checks+manifestAnchor);
          }
          fs.writeFileSync(path,s);
          NODE
      - name: Sync release files
        run: node scripts/release-sync.mjs --write
      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify release and tests
        run: |
          npm test
          node scripts/release-sync.mjs --check
          node scripts/release-check.mjs
      - name: Remove one-time workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v750-finalize-once.yml
          git add MERIDIAN_CONTEXT.md MERIDIAN_DECISIONS.md MERIDIAN_HANDOFF.md scripts/release-check.mjs version.json index.html app-v6.06.js app-v7.33-hardening.js manifest.webmanifest package.json package-lock.json
          git commit -m "Finalize MERIDIAN v7.50 project memory [v7.50-finalized]"
          git push origin HEAD:codex/meridian-v7-50-project-memory
