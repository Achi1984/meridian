name: Elliott Wave Bot V1 Evidence
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'elliott-wave-bot-v1.js'
      - 'scripts/elliott-wave-bot-v1-evidence.mjs'
      - 'test/elliott-wave-bot-v1.test.js'
      - 'research/elliott-wave-bot-v1-wave3-design.md'
      - '.github/workflows/elliott-wave-bot-v1-evidence.yml'
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/elliott-wave-bot-v1.test.js
      - run: node scripts/elliott-wave-bot-v1-evidence.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: elliott-wave-bot-v1-evidence
          path: artifacts/elliott-wave-bot-v1-evidence.json
          if-no-files-found: error
