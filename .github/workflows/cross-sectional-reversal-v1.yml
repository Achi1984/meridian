name: Cross-Sectional Reversal V1
on:
  pull_request:
    paths:
      - 'research/cross-sectional-reversal-v1.js'
      - 'test/cross-sectional-reversal-v1.test.js'
      - '.github/workflows/cross-sectional-reversal-v1.yml'
  workflow_dispatch:
jobs:
  synthetic-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax
        run: node --check research/cross-sectional-reversal-v1.js
      - name: Synthetic invariants only
        run: node test/cross-sectional-reversal-v1.test.js
