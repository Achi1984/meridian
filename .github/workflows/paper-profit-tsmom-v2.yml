name: MERIDIAN Paper Profit TSMOM V2

on:
  pull_request:
    paths:
      - "research/paper-profit-tsmom-v2-evaluator.js"
      - "research/run-paper-profit-tsmom-v2.mjs"
      - ".github/workflows/paper-profit-tsmom-v2.yml"
      - "test/paper-profit-tsmom-v2-evaluator.test.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run frozen TSMOM V2 evaluation
        run: node research/run-paper-profit-tsmom-v2.mjs
      - name: Upload untouched TSMOM V2 evidence
        uses: actions/upload-artifact@v4
        with:
          name: paper-profit-tsmom-v2
          path: |
            research/results/paper-profit-tsmom-v2-result.json
            research/results/paper-profit-tsmom-v2-result.md
          if-no-files-found: error
          retention-days: 30
