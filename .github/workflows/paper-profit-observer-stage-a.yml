name: MERIDIAN Paper Profit Observer Stage A

on:
  pull_request:
    paths:
      - "scripts/capture-paper-bot-observer-r90.mjs"
      - ".github/workflows/paper-profit-observer-stage-a.yml"
      - "test/paper-profit-control-v2.test.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Capture public read-only Paper observer
        run: node scripts/capture-paper-bot-observer-r90.mjs
      - name: Upload observer snapshot
        uses: actions/upload-artifact@v4
        with:
          name: paper-profit-observer-stage-a
          path: research/results/paper-runtime-observer-r90.json
          if-no-files-found: error
          retention-days: 30
