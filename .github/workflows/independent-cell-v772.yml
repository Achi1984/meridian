name: MERIDIAN Independent Cell Validation v7.72

on:
  workflow_dispatch:
  push:
    branches: [research-v768-preserved-20260903]
    paths:
      - "independent-cell-v772.js"
      - "scripts/independent-cell-v772.mjs"
      - "test/independent-cell-v772.test.js"
      - ".github/workflows/independent-cell-v772.yml"

permissions:
  contents: write

concurrency:
  group: meridian-independent-cell-v772
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research-v768-preserved-20260903
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Use Binance public market-data endpoint
        run: sed -i 's#https://api.binance.com#https://data-api.binance.vision#g' scripts/signal-cohort-v762.mjs
      - name: Generate four independent 90d cohorts
        shell: bash
        run: |
          set -euo pipefail
          for pair in "q0:360" "q1:450" "q2:540" "q3:630"; do
            name="${pair%%:*}"; days="${pair##*:}"
            end_at="$(date -u -d "${days} days ago" +'%Y-%m-%dT%H:%M:%SZ')"
            node scripts/signal-cohort-v762.mjs --out-dir "/tmp/v772/${name}" --end-at "${end_at}"
          done
      - name: Test independent cell validation
        run: node --test test/independent-cell-v772.test.js test/side-regime-v771.test.js test/challenger-v32.test.js
      - name: Build independent evidence
        run: node scripts/independent-cell-v772.mjs --q0 /tmp/v772/q0/signal-cohort-90d.json --q1 /tmp/v772/q1/signal-cohort-90d.json --q2 /tmp/v772/q2/signal-cohort-90d.json --q3 /tmp/v772/q3/signal-cohort-90d.json --out research/independent-cell-evidence-v772.json
      - name: Build compact summary
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('research/independent-cell-evidence-v772.json','utf8'));
          const out=['# MERIDIAN v7.72 — Independent Cell Validation','',`Generated: ${r.generatedAt}`,'','Research-only. Four older disjoint 90d cohorts are used so v7.71 discovery windows are not reused. Baseline 6.2 remains frozen.',''];
          for(const [cell,x] of Object.entries(r.validation||{})){
            out.push(`## ${cell}`,'',`Adequate periods: ${x.adequatePeriods}/4 · positive ΔAvgR: ${x.positivePeriods} · negative: ${x.negativePeriods} · mean ΔAvgR: ${x.meanDeltaAvgR} · independently validated: **${x.independentlyValidated?'YES':'NO'}**`,'');
            for(const o of x.observations||[]) out.push(`${o.period}: B n=${o.baselineSamples}, V3.2 n=${o.challengerSamples}, ΔAvgR=${o.deltaAvgR}, Δcoverage=${o.coverageDelta}, adequate=${o.adequate?'YES':'NO'}`);
            out.push('');
          }
          out.push('## Result','',`Validated cells: ${r.validatedCells.length?r.validatedCells.join(', '):'NONE'}`,'','## Guardrail','',r.guardrail,'');
          fs.writeFileSync('research/independent-cell-evidence-v772.md',out.join('\n'));
          NODE
      - name: Commit evidence to research branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- scripts/signal-cohort-v762.mjs
          git add research/independent-cell-evidence-v772.json research/independent-cell-evidence-v772.md
          if git diff --cached --quiet; then echo "No evidence change"; exit 0; fi
          git commit -m "MERIDIAN v7.72: independent cell evidence"
          git push origin HEAD:research-v768-preserved-20260903
