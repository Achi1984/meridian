name: Top 100 follow-up · three paper accounts
run-name: Top 100 · unabhängiger 8-Stunden-Vergleich Nr. ${{ github.run_number }}
on:
  push:
    branches: [paper/top100-confirmation-20261127]
    paths: ['.github/workflows/top100-breakout.yml']
permissions:
  contents: write
jobs:
  first:
    runs-on: ubuntu-latest
    timeout-minutes: 255
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: python -m unittest discover -s scripts/research -p test_top100_paper.py
      - run: python scripts/research/top100_paper.py direction 0
      - name: Publish initial paper balances
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          file="top100-followup-$GITHUB_RUN_ID.json"
          python scripts/research/top100_followup_report.py direction/state.json initial > "$RUNNER_TEMP/report.json"
          api="repos/$GITHUB_REPOSITORY/contents/$file"
          gh api -X PUT "$api" -f branch=paper-dashboard-data -f message="Publish initial Top 100 paper checkpoint" -f content="$(base64 -w0 "$RUNNER_TEMP/report.json")" >/dev/null
      - run: python scripts/research/top100_paper.py direction 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: top100-breakout-first
          path: direction/
          if-no-files-found: error
      - name: Publish first paper balances
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          file="top100-followup-$GITHUB_RUN_ID.json"
          python scripts/research/top100_followup_report.py direction/state.json first > "$RUNNER_TEMP/report.json"
          api="repos/$GITHUB_REPOSITORY/contents/$file"
          sha=$(gh api "$api?ref=paper-dashboard-data" --jq '.sha')
          gh api -X PUT "$api" -f branch=paper-dashboard-data -f message="Publish first Top 100 paper checkpoint" -f content="$(base64 -w0 "$RUNNER_TEMP/report.json")" -f "sha=$sha" >/dev/null
  finish:
    needs: first
    runs-on: ubuntu-latest
    timeout-minutes: 255
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with: {name: top100-breakout-first, path: direction}
      - run: python scripts/research/top100_paper.py direction 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: top100-breakout-final
          path: direction/
          if-no-files-found: error
      - name: Publish final paper balances
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          file="top100-followup-$GITHUB_RUN_ID.json"
          python scripts/research/top100_followup_report.py direction/state.json final > "$RUNNER_TEMP/report.json"
          api="repos/$GITHUB_REPOSITORY/contents/$file"
          sha=$(gh api "$api?ref=paper-dashboard-data" --jq '.sha')
          gh api -X PUT "$api" -f branch=paper-dashboard-data -f message="Publish final Top 100 paper checkpoint" -f content="$(base64 -w0 "$RUNNER_TEMP/report.json")" -f "sha=$sha" >/dev/null
