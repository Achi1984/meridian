name: MERIDIAN v7.35 Release Finalize

on:
  push:
    branches:
      - codex/meridian-v7-35-release-safety

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Synchronize release authorities
        run: node scripts/release-sync.mjs --write
      - name: Generate deterministic lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Validate generated release
        run: |
          node scripts/release-sync.mjs --check
          node scripts/release-check.mjs
          node scripts/privacy-check.mjs
          node scripts/secret-check.mjs
      - name: Commit generated release files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app-v7.33-hardening.js manifest.webmanifest package.json package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "MERIDIAN v7.35: synchronize release artifacts"
          git push origin HEAD:codex/meridian-v7-35-release-safety
