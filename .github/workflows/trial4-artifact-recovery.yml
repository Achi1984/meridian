name: MERIDIAN Original Trial4 Artifact Recovery
on:
  workflow_dispatch:
    inputs:
      approved_base:
        description: Exact reviewed main SHA approved for this single recovery
        required: true
        type: string
permissions: {}
concurrency:
  group: meridian-trial4-artifact-recovery1
  cancel-in-progress: false
jobs:
  recover:
    if: ${{ github.repository == 'Achi1984/meridian' && github.ref == 'refs/heads/main' && github.triggering_actor == 'Achi1984' && github.run_attempt == 1 }}
    environment: meridian-draft-publisher
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
      pull-requests: read
    steps:
      - name: Load immutable reviewed recovery files
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/recovery/evidence"
          cd "$RUNNER_TEMP/recovery"
          for path in recovery_core.py recovery_http.py recovery_launcher.py publisher_broker.py evidence/validate_original_packet.py evidence/original-pilot.py workflow.template.yml; do
            gh api "repos/Achi1984/meridian/contents/scripts/autonomy/trial4-recovery/$path?ref=6267d303a1cbd7a2614d4c798048f692a5923bd1" -H 'Accept:application/vnd.github.raw+json' > "$path"
          done
          printf '%s\n' 'ecbe55901308abe3d0e3936a21a1c6cd658c7e10fc812ede32f0262398767fdb  recovery_core.py' 'cb91c79207ee926be4f70080bb55501edafc20eb97b30a9891638870b6b543ec  recovery_http.py' '888f79f8a407108a783c92ecea6e79868097c7d6ce8fd88e57e879c70aec3feb  recovery_launcher.py' 'd82b29832dbbbf3d419e41b5a81f4f6ff54585e6cbca4f07be411f81b5f35c44  publisher_broker.py' 'ae202bd358f370c565de28ee00c2585a0c29a0e2d415a46dfb70875501c5114c  evidence/validate_original_packet.py' '4786e18ec611a22a9c6cebb476cb6910d7f5812c7240c64432b50916e05b16df  evidence/original-pilot.py' 'abef10fed103f2daaaa2e4fa4b94857df7d00f5501a67a9f2cf09c7f9ee17785  workflow.template.yml' | sha256sum --check --strict -
      - name: Authenticate recovery and publish only the preserved artifact
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_RECOVERY_BASE: ${{ inputs.approved_base }}
          RECOVERY_SOURCE_COMMIT: 6267d303a1cbd7a2614d4c798048f692a5923bd1
          MERIDIAN_PUBLISHER_APP_PRIVATE_KEY: ${{ secrets.MERIDIAN_PUBLISHER_APP_PRIVATE_KEY }}
        run: exec python3 -I "$RUNNER_TEMP/recovery/recovery_launcher.py"
