name: MERIDIAN v7.40 Finalize Once
on:
  push:
    branches:
      - codex/meridian-v7-40-overview-consistency
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/meridian-v7-40-overview-consistency
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Sync release artifacts
        run: |
          node scripts/release-sync.mjs --write
          npm install --package-lock-only --ignore-scripts
      - name: Validate
        run: |
          node --check app-v7.39-paper-overview.js
          npm test
          npm run release:check
          node scripts/privacy-check.mjs
          node scripts/secret-check.mjs
          grep -F 'if(!config.paperTrading||config.liveTrading) throw new Error("Unsafe configuration: PAPER only required.");' server.js
      - name: Remove one-time workflow
        run: rm .github/workflows/v7-40-finalize-once.yml
      - name: Commit final v7.40 tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'MERIDIAN v7.40: finalize Paper overview consistency' || exit 0
          git push origin HEAD:codex/meridian-v7-40-overview-consistency
