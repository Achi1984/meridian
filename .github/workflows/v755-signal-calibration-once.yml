name: MERIDIAN v7.55 Signal Calibration Once

on:
  push:
    branches:
      - codex/meridian-v7-53-challenger-v31
    paths:
      - .github/workflows/v755-signal-calibration-once.yml

permissions:
  contents: write

jobs:
  calibration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/meridian-v7-53-challenger-v31
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Expose research helpers
        run: node scripts/v755-expose-calibration.mjs
      - name: Verify
        run: npm test && node --check cloud-backtest.js && node --check scripts/signal-calibration-v755.mjs
      - name: Use Binance public market-data endpoint in CI
        run: sed -i "s#https://api.binance.com#https://data-api.binance.vision#g" cloud-backtest.js
      - name: Run Signal Calibration Lab
        run: node scripts/signal-calibration-v755.mjs
      - name: Restore canonical endpoint and helper export
        run: |
          git checkout -- cloud-backtest.js
          node scripts/v755-expose-calibration.mjs
      - name: Commit calibration and self-remove
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v755-signal-calibration-once.yml scripts/v755-expose-calibration.mjs
          git add cloud-backtest.js scripts/signal-calibration-v755.mjs research/signal-calibration-v755.json research/signal-calibration-v755.md
          git commit -m "MERIDIAN v7.55: signal calibration evidence"
          git push origin HEAD:codex/meridian-v7-53-challenger-v31
