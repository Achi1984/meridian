name: MERIDIAN Paper Bot Profit Discovery V3

on:
  push:
    branches:
      - fix/v10-r69-profit-agent-v2
    paths:
      - "research/PAPERBOT-PROFIT-SPECIAL-AGENT-V3.md"
      - "research/paperbot-profit-special-agent-v3.js"
      - "research/run-paperbot-profit-discovery-v3.mjs"
      - "test/paperbot-profit-special-agent-v3.test.js"
      - ".github/workflows/research-profit-discovery-v3.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run V3 invariant tests
        run: node --test test/paperbot-profit-special-agent-v3.test.js
      - name: Run frozen 1460-day 6h V3 discovery
        run: node research/run-paperbot-profit-discovery-v3.mjs
      - name: Upload untouched V3 discovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: paperbot-profit-discovery-v3
          path: |
            research/results/paperbot-profit-discovery-v3-summary.json
            research/results/paperbot-profit-discovery-v3-full.json
            research/results/paperbot-profit-discovery-v3.md
          if-no-files-found: error
          retention-days: 30
