name: MERIDIAN Relative-Value Reversal V3 Data Foundation

on:
  push:
    branches:
      - research/perpetual-relative-value-reversal-v3-data-v1
    paths:
      - "research/PERPETUAL-RELATIVE-VALUE-REVERSAL-V3-DATA-V1-FROZEN.md"
      - "scripts/audit-perpetual-relative-value-reversal-v3-data-v1.py"
      - ".github/workflows/perpetual-relative-value-reversal-v3-data-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perpetual-relative-value-reversal-v3-data-v1
  cancel-in-progress: true

jobs:
  data-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Run frozen public-data foundation audit
        run: python3 scripts/audit-perpetual-relative-value-reversal-v3-data-v1.py
      - name: Upload untouched foundation evidence
        uses: actions/upload-artifact@v4
        with:
          name: perpetual-relative-value-reversal-v3-data-v1
          path: research/results/perpetual-relative-value-reversal-v3-data-v1.json
          if-no-files-found: error
          retention-days: 30
