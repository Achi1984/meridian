name: MERIDIAN Cross-Sectional Perpetual Factor V1

on:
  push:
    branches:
      - research/cross-sectional-perpetual-factor-v1
    paths:
      - "research/CROSS-SECTIONAL-PERPETUAL-FACTOR-V1-FROZEN.md"
      - "research/cross_sectional_perpetual_factor_v1.py"
      - "research/run-cross-sectional-perpetual-factor-v1.py"
      - "research/self_history_perp_factor_v3.py"
      - "scripts/collect-cross-sectional-perpetual-factor-v1.py"
      - "test/test_cross_sectional_perpetual_factor_v1.py"
      - "test/test_self_history_perp_factor_v3.py"
      - ".github/workflows/cross-sectional-perpetual-factor-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-sectional-perpetual-factor-v1
  cancel-in-progress: true

jobs:
  temporal-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify inherited execution and frozen V1 gates
        run: python3 -m unittest test/test_self_history_perp_factor_v3.py test/test_cross_sectional_perpetual_factor_v1.py
      - name: Collect official unseen Binance Vision archives
        run: python3 scripts/collect-cross-sectional-perpetual-factor-v1.py
      - name: Run first independent temporal validation
        run: python3 research/run-cross-sectional-perpetual-factor-v1.py
      - name: Upload untouched temporal-validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: cross-sectional-perpetual-factor-v1
          path: |
            research/results/cross-sectional-perpetual-factor-v1-summary.json
            research/results/cross-sectional-perpetual-factor-v1-full.json
            research/results/cross-sectional-perpetual-factor-v1.md
          if-no-files-found: error
          retention-days: 30
