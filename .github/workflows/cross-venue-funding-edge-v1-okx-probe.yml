name: MERIDIAN Cross-Venue V1 OKX Source Probe

on:
  push:
    branches:
      - research/cross-venue-funding-edge-v1-okx-probe
    paths:
      - ".github/workflows/cross-venue-funding-edge-v1-okx-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Probe OKX funding archive schemas across years
        shell: bash
        run: |
          node <<'NODE'
          const fs=await import('node:fs');
          const crypto=await import('node:crypto');
          const base='https://www.okx.com';
          const months=['2022-03','2022-04','2023-01','2024-01','2025-01','2026-01','2026-09'];
          async function getJson(path){
            const r=await fetch(base+path,{headers:{accept:'application/json','user-agent':'MERIDIAN-source-probe/1.0'},signal:AbortSignal.timeout(20000)});
            const text=await r.text();
            if(!r.ok)throw new Error('HTTP '+r.status+' '+path+' '+text.slice(0,200));
            const j=JSON.parse(text);
            if(String(j.code)!=='0')throw new Error('OKX '+j.code+' '+j.msg);
            return j;
          }
          for(const ym of months){
            const ts=Date.parse(ym+'-01T00:00:00+08:00');
            const q='/api/v5/public/market-data-history?module=3&instType=SWAP&dateAggrType=monthly&begin='+ts+'&end='+ts+'&instFamilyList=BTC-USDT';
            const j=await getJson(q);
            const groups=(j.data||[]).flatMap(x=>(x.details||[]).flatMap(d=>d.groupDetails||[]));
            const name='BTC-USDT-SWAP-fundingrates-'+ym+'.zip';
            const file=groups.find(x=>x.filename===name);
            if(!file?.url)throw new Error('MISSING '+ym);
            const r=await fetch(file.url,{signal:AbortSignal.timeout(20000)});
            if(!r.ok)throw new Error('ZIP HTTP '+r.status+' '+ym);
            const bytes=Buffer.from(await r.arrayBuffer());
            fs.writeFileSync('/tmp/okx-'+ym+'.zip',bytes);
            console.log(JSON.stringify({month:ym,filename:name,bytes:bytes.length,sha256:crypto.createHash('sha256').update(bytes).digest('hex')}));
            await new Promise(r=>setTimeout(r,500));
          }
          NODE
          for f in /tmp/okx-*.zip; do
            echo "=== $(basename "$f") ==="
            unzip -p "$f" | head -n 4
          done
