name: MERIDIAN Cross-Venue V1 OKX Source Probe

on:
  push:
    branches:
      - research/cross-venue-funding-edge-v1-okx-probe
    paths:
      - ".github/workflows/cross-venue-funding-edge-v1-okx-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Scan every OKX monthly funding archive first row
        shell: bash
        run: |
          node <<'NODE'
          const fs=await import('node:fs');
          const base='https://www.okx.com';
          const start=new Date('2022-03-01T00:00:00Z'),end=new Date('2026-09-01T00:00:00Z');
          const months=[];
          for(let y=start.getUTCFullYear(),m=start.getUTCMonth()+1;y<end.getUTCFullYear()||(y===end.getUTCFullYear()&&m<=end.getUTCMonth()+1);){
            months.push(y+'-'+String(m).padStart(2,'0'));
            if(++m===13){m=1;y++}
          }
          async function getJson(path){
            for(let attempt=0;attempt<5;attempt++){
              const r=await fetch(base+path,{headers:{accept:'application/json','user-agent':'MERIDIAN-source-probe/1.0'},signal:AbortSignal.timeout(20000)});
              const text=await r.text();
              if(r.ok){
                const j=JSON.parse(text);
                if(String(j.code)==='0')return j;
                if(String(j.code)!=='50011')throw new Error('OKX '+j.code+' '+j.msg);
              } else if(r.status!==429) throw new Error('HTTP '+r.status+' '+path);
              await new Promise(r=>setTimeout(r,800*(attempt+1)));
            }
            throw new Error('RATE_LIMIT '+path);
          }
          for(const ym of months){
            const ts=Date.parse(ym+'-01T00:00:00+08:00');
            const q='/api/v5/public/market-data-history?module=3&instType=SWAP&dateAggrType=monthly&begin='+ts+'&end='+ts+'&instFamilyList=BTC-USDT';
            const j=await getJson(q);
            const groups=(j.data||[]).flatMap(x=>(x.details||[]).flatMap(d=>d.groupDetails||[]));
            const name='BTC-USDT-SWAP-fundingrates-'+ym+'.zip';
            const file=groups.find(x=>x.filename===name);
            if(!file?.url)throw new Error('MISSING '+ym);
            const rr=await fetch(file.url,{signal:AbortSignal.timeout(20000)});
            if(!rr.ok)throw new Error('ZIP_HTTP_'+rr.status+' '+ym);
            fs.writeFileSync('/tmp/okx-'+ym+'.zip',Buffer.from(await rr.arrayBuffer()));
            await new Promise(r=>setTimeout(r,500));
          }
          console.log(JSON.stringify({downloaded:months.length}));
          NODE

          bad=0
          for f in /tmp/okx-*.zip; do
            ym="$(basename "$f" .zip | sed 's/^okx-//')"
            first="$(unzip -p "$f" | head -n 1 | tr -d '\r')"
            case "$first" in
              BTC-USDT-SWAP,*) ;;
              *) echo "ANOMALY $ym :: $first"; bad=1 ;;
            esac
          done
          echo "scan_bad=$bad"
          exit "$bad"
