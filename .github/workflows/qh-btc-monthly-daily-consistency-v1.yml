name: MERIDIAN QH BTC Monthly Daily Consistency Diagnostic V1

on:
  pull_request:
    paths:
      - "scripts/diagnose-qh-btc-monthly-daily-consistency-v1.py"
      - ".github/workflows/qh-btc-monthly-daily-consistency-v1.yml"
      - "research/PERPETUAL-QH-BTC-MONTHLY-DAILY-CONSISTENCY-DIAGNOSTIC-V1.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qh-btc-monthly-daily-consistency-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Compare official monthly trades with monthly and daily 1m klines
        run: python3 scripts/diagnose-qh-btc-monthly-daily-consistency-v1.py
      - name: Upload source-consistency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qh-btc-monthly-daily-consistency-v1
          path: research/results/qh-btc-monthly-daily-consistency/*.json
          if-no-files-found: warn
