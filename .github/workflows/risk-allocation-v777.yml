name: MERIDIAN V3.3 Risk Allocation Shadow v7.77

on:
  workflow_dispatch:
  push:
    branches: [research-v768-preserved-20260903]
    paths:
      - "risk-allocation-v777.js"
      - "scripts/risk-allocation-v777.mjs"
      - "test/risk-allocation-v777.test.js"
      - ".github/workflows/risk-allocation-v777.yml"

permissions:
  contents: write

concurrency:
  group: meridian-risk-allocation-v777
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research-v768-preserved-20260903
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Use Binance public market-data endpoint
        run: sed -i 's#https://api.binance.com#https://data-api.binance.vision#g' scripts/signal-cohort-v762.mjs
      - name: Generate four disjoint 90d cohorts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/signal-cohort-v762.mjs --out-dir /tmp/v777/p0
          for pair in "p1:90" "p2:180" "p3:270"; do
            name="${pair%%:*}"; days="${pair##*:}"
            end_at="$(date -u -d "${days} days ago" +'%Y-%m-%dT%H:%M:%SZ')"
            node scripts/signal-cohort-v762.mjs --out-dir "/tmp/v777/${name}" --end-at "${end_at}"
          done
      - name: Test v7.77 risk allocation shadow
        run: node --test test/risk-allocation-v777.test.js test/context-reliability-v776.test.js test/challenger-v32.test.js test/portfolio-path-v767.test.js
      - name: Build v7.77 evidence
        run: node scripts/risk-allocation-v777.mjs --p0 /tmp/v777/p0/signal-cohort-90d.json --p1 /tmp/v777/p1/signal-cohort-90d.json --p2 /tmp/v777/p2/signal-cohort-90d.json --p3 /tmp/v777/p3/signal-cohort-90d.json --out research/risk-allocation-v777.json
      - name: Build compact summary
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('research/risk-allocation-v777.json','utf8'));
          const out=['# MERIDIAN v7.77 — Challenger V3.3 Risk Allocation Shadow','',`Generated: ${r.generatedAt}`,'','Research-only. Strict chronological expanding training. Challenger V3.2 entries, ranking and exits stay frozen; only bounded risk allocation changes from 0.25% base to max 0.35%. No Paper/UI/runtime execution change.',''];
          for(const s of r.steps||[]){
            out.push(`- **${s.training.join('+')} → ${s.test}** · policy cells ${s.policy.cells.length} · trades ${s.replay.selectedTrades} · boosted ${s.replay.allocation.boostedTrades} · ΔReturn ${s.replay.delta.returnPct}pp · ΔPF ${s.replay.delta.pf} · ΔDD ${s.replay.delta.maxDrawdownPct}pp · winner−loser risk ${s.replay.adaptive.winnerMinusLoserRiskPct}pp`);
          }
          out.push('','## Summary','',`Positive return steps: **${r.summary.positiveReturnSteps}/3** · DD-safe: **${r.summary.ddSafeSteps}/3** · allocation-efficient: **${r.summary.allocationEfficientSteps}/3** · equal coverage: **${r.summary.equalCoverage}**.`,`Persistent: **${r.summary.persistent}**. Promotion allowed: **${r.promotionAllowed}**. Next step: **${r.nextStep}**.`,'','## Guardrail','','This experiment cannot add or remove entries. It only reallocates risk among the exact frozen Challenger V3.2 trade set using context evidence learned exclusively from older periods. Even a pass does not promote V3.3 to Paper; it only permits a prospective research shadow.','');
          fs.writeFileSync('research/risk-allocation-v777.md',out.join('\n'));
          NODE
      - name: Restore cohort generator
        run: git checkout -- scripts/signal-cohort-v762.mjs
      - name: Commit evidence to research branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/risk-allocation-v777.json research/risk-allocation-v777.md
          if git diff --cached --quiet; then echo "No evidence change"; exit 0; fi
          git commit -m "MERIDIAN v7.77: V3.3 risk allocation shadow results"
          git push origin HEAD:research-v768-preserved-20260903
