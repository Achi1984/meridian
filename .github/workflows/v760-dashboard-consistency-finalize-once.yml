name: MERIDIAN v7.60 Dashboard Consistency Finalize Once

on:
  push:
    branches:
      - codex/meridian-v7-60-dashboard-consistency
    paths:
      - .github/workflows/v760-dashboard-consistency-finalize-once.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/meridian-v7-60-dashboard-consistency
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sync release generated files
        run: |
          node scripts/release-sync.mjs --write
          npm install --package-lock-only --ignore-scripts
      - name: Verify syntax and regression safety
        run: |
          node --check app-v7.60-dashboard-consistency.js
          node --check app-v6.06.js
          npm test
          npm run release:check
      - name: Assert dashboard consistency invariants
        run: |
          grep -q "spotOnlyDepot:true" app-v7.60-dashboard-consistency.js
          grep -q "manualTradingSeparated:true" app-v7.60-dashboard-consistency.js
          grep -q "4 BOTS" app-v7.60-dashboard-consistency.js
          grep -q "CHALLENGER V3.2 IN RESEARCH" app-v7.60-dashboard-consistency.js
          grep -q "app-v7.60-dashboard-consistency.js?v=7.60-R1" app-v6.06.js
      - name: Commit generated release files and self-remove
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v760-dashboard-consistency-finalize-once.yml
          git add index.html app-v6.06.js app-v7.33-hardening.js manifest.webmanifest package.json package-lock.json version.json app-v7.60-dashboard-consistency.js
          git commit -m "MERIDIAN v7.60: dashboard consistency release"
          git push origin HEAD:codex/meridian-v7-60-dashboard-consistency
