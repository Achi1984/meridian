name: Bull Compound Research Backtest

on:
  push:
    branches:
      - research/bull-compound-backtest-20260916
    paths:
      - research/bull_compound_backtest.py
      - research/bull_compound_backtest_v2.py
      - research/bull_compound_backtest_v3.py
      - research/bull_compound_hedge_v4.py
      - research/bull_compound_hedge_v4_1.py
      - research/bull_compound_hedge_v4_2.py
      - .github/workflows/bull-compound-backtest.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run staged hedge sizing backtest
        run: python research/bull_compound_hedge_v4_2.py
      - name: Upload research result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bull-compound-hedge-v4-2
          path: |
            bull-compound-hedge-v4-2.json
            bull-compound-hedge-v4-2.md
          if-no-files-found: warn
