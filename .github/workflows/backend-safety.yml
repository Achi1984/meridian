name: MERIDIAN Release Safety

on:
  pull_request:
  push:
    branches:
      - main
      - codex/**

permissions:
  contents: read
  pull-requests: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Deterministic install
        run: npm ci --ignore-scripts
      - name: Release coordination guard
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release-coordinator.mjs --guard
      - name: Backend syntax
        run: |
          node --check server.js
          node --check server-gateway.js
          node --check cloud-backtest.js
          node --check scripts/read-token-auth.mjs
          node --check scripts/start-gateway.mjs
          node --check scripts/runtime-smoke.mjs
          node --check scripts/frozen-research-guard.mjs
      - name: Frontend module syntax
        run: |
          node --check app-v6.06.js
          node --check app-v7.32-legacy.js
          node --check app-v7.33-hardening.js
          node --check app-runtime-monitor.js
          node --check app-v7.37-ui-polish.js
          node --check v9/v9.js
          node --check v10/v10.js
          node --check v10/fib-core.js
          node --check research/sk-paperbot-v1.js
          node --check research/sk-research-v2.js
          node --check research/documented-edge-v1.js
          node --check research/tsmom-holdout-v1.js
      - name: Frozen research lineage
        run: node scripts/frozen-research-guard.mjs
      - name: Research and auth regression tests
        run: node --test test/*.test.js
      - name: Release authority consistency
        run: |
          node scripts/release-sync.mjs --check
          node scripts/release-check.mjs
      - name: Public privacy regression
        run: node scripts/privacy-check.mjs
      - name: High-confidence secret scan
        run: node scripts/secret-check.mjs
      - name: Assert paper-only invariant
        run: |
          grep -F 'if(!config.paperTrading||config.liveTrading) throw new Error("Unsafe configuration: PAPER only required.");' server.js
