name: MERIDIAN Backend Safety

on:
  pull_request:
  push:
    branches:
      - main
      - codex/**

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - run: node --check server.js
      - run: node --check server-gateway.js
      - run: node --check cloud-backtest.js
      - run: node --test test/*.test.js
      - name: Assert paper-only invariant
        run: |
          grep -F 'if(!config.paperTrading||config.liveTrading) throw new Error("Unsafe configuration: PAPER only required.");' server.js
