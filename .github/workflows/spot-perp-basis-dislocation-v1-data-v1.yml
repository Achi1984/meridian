name: MERIDIAN Spot-Perp Basis Dislocation V1 Data Foundation

on:
  push:
    branches:
      - research/spot-perp-basis-dislocation-v1-data-v1
    paths:
      - "research/SPOT-PERP-BASIS-DISLOCATION-V1-DATA-V1-FROZEN.md"
      - "scripts/audit-spot-perp-basis-dislocation-v1-data-v1.py"
      - ".github/workflows/spot-perp-basis-dislocation-v1-data-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spot-perp-basis-dislocation-v1-data-v1
  cancel-in-progress: true

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python3 -m py_compile scripts/audit-spot-perp-basis-dislocation-v1-data-v1.py
      - name: Run frozen full-row public-data audit
        run: python3 scripts/audit-spot-perp-basis-dislocation-v1-data-v1.py
      - name: Upload untouched foundation evidence
        uses: actions/upload-artifact@v4
        with:
          name: spot-perp-basis-dislocation-v1-data-v1
          path: research/results/spot-perp-basis-dislocation-v1-data-v1.json
          if-no-files-found: error
          retention-days: 30
