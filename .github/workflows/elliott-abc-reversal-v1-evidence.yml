name: Elliott ABC Reversal V1 Evidence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'elliott-abc-reversal-v1.js'
      - 'scripts/elliott-abc-reversal-v1-evidence.mjs'
      - 'test/elliott-abc-reversal-v1.test.js'
      - 'research/elliott-abc-reversal-v1-design.md'
      - '.github/workflows/elliott-abc-reversal-v1-evidence.yml'

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify frozen contract
        run: node --test test/elliott-abc-reversal-v1.test.js
      - name: Run historical evidence
        run: node scripts/elliott-abc-reversal-v1-evidence.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: elliott-abc-reversal-v1-evidence
          path: artifacts/elliott-abc-reversal-v1-evidence.json
          if-no-files-found: error
