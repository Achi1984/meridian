name: FIB DCA Research Backtest
on:
  workflow_dispatch:
  push:
    branches: [feature/fib-dca-futures-long]
    paths: ['research/**', '.github/workflows/fib-dca-backtest.yml']
jobs:
  backtest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Unit tests
        run: |
          node research/fib-dca-futures-long.test.mjs
          node research/mtf-sync.test.mjs
      - name: BTC walk-forward
        run: node research/run-btc-matrix.mjs | tee btc-backtest.json
      - name: Multi-asset walk-forward
        run: node research/run-multiasset-matrix.mjs | tee multiasset-backtest.json
      - name: v0.2 multi-timeframe backtest
        run: node research/run-v02-mtf.mjs | tee v02-mtf-backtest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fib-dca-backtest-results
          path: |
            btc-backtest.json
            multiasset-backtest.json
            v02-mtf-backtest.json
