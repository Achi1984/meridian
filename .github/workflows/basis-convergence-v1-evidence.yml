name: Basis Convergence V1 Evidence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'basis-convergence-v1.js'
      - 'scripts/basis-convergence-v1-evidence.mjs'
      - 'test/basis-convergence-v1.test.js'
      - 'research/basis-convergence-v1-design.md'
      - '.github/workflows/basis-convergence-v1-evidence.yml'

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify frozen basis contract
        run: node --test test/basis-convergence-v1.test.js
      - name: Run historical evidence
        run: node scripts/basis-convergence-v1-evidence.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: basis-convergence-v1-evidence
          path: artifacts/basis-convergence-v1-evidence.json
          if-no-files-found: error
