name: MERIDIAN v7.47 Finalize Once
on:
  push:
    branches: [codex/meridian-v7-47-research-telemetry]
permissions:
  contents: write
jobs:
  finalize:
    if: "!contains(github.event.head_commit.message, '[v7.47-finalized]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/meridian-v7-47-research-telemetry
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Deterministic install
        run: npm ci
      - name: Sync release files
        run: node scripts/release-sync.mjs --write
      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify release and tests
        run: |
          npm test
          npm run release:check
      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/v747-finalize-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize MERIDIAN v7.47 [v7.47-finalized]"
          git push
