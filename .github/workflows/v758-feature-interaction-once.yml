name: MERIDIAN v7.58 Feature Interaction Once

on:
  push:
    branches:
      - codex/meridian-v7-57-feature-edge-map
    paths:
      - .github/workflows/v758-feature-interaction-once.yml

permissions:
  contents: write

jobs:
  interaction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/meridian-v7-57-feature-edge-map
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify
        run: npm test && node --check scripts/feature-interaction-v758.mjs
      - name: Use Binance public market-data endpoint in CI
        run: sed -i "s#https://api.binance.com#https://data-api.binance.vision#g" cloud-backtest.js
      - name: Run Feature Interaction Lab
        run: node scripts/feature-interaction-v758.mjs
      - name: Restore canonical endpoint and commit report
        run: |
          git checkout -- cloud-backtest.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v758-feature-interaction-once.yml
          git add scripts/feature-interaction-v758.mjs research/feature-interaction-v758.json research/feature-interaction-v758.md
          git commit -m "MERIDIAN v7.58: feature interaction evidence"
          git push origin HEAD:codex/meridian-v7-57-feature-edge-map
