name: MERIDIAN v7.38 Integrate Once
on:
  push:
    branches: [codex/meridian-v7-38-regime-v1]
    paths:
      - '.github/workflows/v738-integrate.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/meridian-v7-38-regime-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply Regime integration
        run: node scripts/v738-integrate.mjs
      - name: Sync release artifacts
        run: |
          node scripts/release-sync.mjs --write
          npm install --package-lock-only --ignore-scripts
      - name: Validate
        run: |
          node --check server.js
          node --check cloud-backtest.js
          node --check regime-v1.js
          node --check app-v7.38-regime-ui.js
          node --test test/*.test.js
          node scripts/release-sync.mjs --check
          node scripts/release-check.mjs
          node scripts/privacy-check.mjs
          node scripts/secret-check.mjs
          grep -F 'if(!config.paperTrading||config.liveTrading) throw new Error("Unsafe configuration: PAPER only required.");' server.js
      - name: Commit final v7.38 tree
        run: |
          rm .github/workflows/v738-integrate.yml scripts/v738-integrate.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'MERIDIAN v7.38: integrate Regime V1 research bot'
          git push origin HEAD:codex/meridian-v7-38-regime-v1
# rerun after release-sync anchor alignment
