name: Agent Workflow Governance Writer
on:
  push:
    branches: [infra/process-governance-r6]
    paths: [.github/workflows/agent-workflow-governance-writer.yml]
permissions: {contents: write}
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: ${{ github.sha }}, fetch-depth: 2}
      - name: Patch
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          EXPECTED_PARENT: c64050f70b7035a346d6106d33304e279d9eead1
        run: |
          set -euo pipefail
          test "$EVENT_BEFORE" = "$EXPECTED_PARENT"
          test "$(git hash-object MERIDIAN_AGENT_WORKFLOW.md)" = ed9b808e4340563826079ed1473363a6fca314f9
          python3 - <<'PY'
          from pathlib import Path
          p=Path("MERIDIAN_AGENT_WORKFLOW.md"); s=p.read_text()
          def r(a,b):
              global s
              assert s.count(a)==1,s.count(a); s=s.replace(a,b)
          a="The repository enforces this with `scripts/release-coordinator.mjs`, the Release Safety guard, and the post-main stale-PR sweep workflow.\n\n### 14.2 Interruption / Streaming Recovery"
          b="""The repository enforces this with `scripts/release-coordinator.mjs`, the Release Safety guard, and the post-main stale-PR sweep workflow.

### 14.1A UI Release Bundling
- Small UI/presentation changes accumulate on one active release branch instead of separate rNN releases.
- Maximum one UI/presentation terminal release merge per GitHub UTC calendar day.
- Exception: a genuine bugfix or trust/safety defect that should not wait.
- The bundle gets one exact-head review, one release-identity bump and one merge.
- Infrastructure/docs/process PRs do not count and must not bump `terminalBuild`.

### 14.2 Interruption / Streaming Recovery"""
          r(a,b)
          r("## 17. Final Result Format","""### 16.1 Mandatory User Escalation
Post `CROSS_MODEL_STATUS NEEDS_USER_DECISION` with `@Achi1984` in #571 before proceeding for:
- Stage/lock changes, canonical V2 run, strategy PnL, Discovery, Validation, Holdout, Paper or Live.
- A new strategy or research direction.
- Agent-rule changes: Lead lease, protocols, STREAM-SAFE version, bootstrap, review duties or workflow permissions.
- Secrets, material costs or external services.
- Review loop 3/3 without GREEN LIGHT.

UI, tests, ordinary bugfixes and housekeeping remain autonomous when none applies.

## 17. Final Result Format""")
          r("5. Before a repository mutation, journal a unique `CROSS_MODEL_STATUS <op-id> INTENT` with target, expected pre-write head, expected blob/state and exact scope. Pure status/review comments are exempt.",
            "5. Before a repository mutation, journal op-id, target, expected head/blob/state and scope in the single continuously edited PR-local lead-status comment. Before a PR exists, carry the op-id in branch/commit and seed that status comment immediately after PR creation. Never post per-step INTENT/progress to the mailbox.")
          p.write_text(s)
          PY
          node scripts/continuity-audit.mjs
          python3 scripts/validate-agent-orchestration.py
          git diff --check
          rm .github/workflows/agent-workflow-governance-writer.yml
          git diff --name-only | sort > /tmp/a
          printf '%s\n' .github/workflows/agent-workflow-governance-writer.yml MERIDIAN_AGENT_WORKFLOW.md | sort > /tmp/e
          diff -u /tmp/e /tmp/a
          git config user.name "MERIDIAN Governance Writer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Infra: codify release batching and escalation"
          git push origin HEAD:infra/process-governance-r6
