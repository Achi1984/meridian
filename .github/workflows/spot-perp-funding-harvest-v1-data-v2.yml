name: MERIDIAN Spot-Perp Funding Harvest V1 Data Foundation V2

on:
  push:
    branches:
      - research/spot-perp-funding-harvest-v1-data-v2
    paths:
      - "research/SPOT-PERP-FUNDING-HARVEST-V1-DATA-V2-FROZEN.md"
      - "scripts/audit-spot-perp-funding-harvest-v1-data-v2.py"
      - ".github/workflows/spot-perp-funding-harvest-v1-data-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spot-perp-funding-harvest-v1-data-v2
  cancel-in-progress: true

jobs:
  coverage-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Run frozen Spot-Perp V2 public-data audit
        run: python3 scripts/audit-spot-perp-funding-harvest-v1-data-v2.py
      - name: Upload untouched foundation evidence
        uses: actions/upload-artifact@v4
        with:
          name: spot-perp-funding-harvest-v1-data-v2
          path: research/results/spot-perp-funding-harvest-v1-data-v2.json
          if-no-files-found: error
          retention-days: 30
