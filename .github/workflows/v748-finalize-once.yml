name: MERIDIAN v7.48 Finalize Once

on:
  push:
    branches:
      - codex/meridian-v7-48-exit-lab-v1
    paths:
      - .github/workflows/v748-finalize-once.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/meridian-v7-48-exit-lab-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Deterministic install
        run: npm ci
      - name: Sync release files
        run: node scripts/release-sync.mjs --write
      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify release and tests
        run: |
          npm test
          node scripts/release-sync.mjs --check
          node scripts/release-check.mjs
      - name: Remove one-time workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v748-finalize-once.yml
          git add index.html app-v6.06.js app-v7.33-hardening.js manifest.webmanifest package.json package-lock.json
          git commit -m "Finalize MERIDIAN v7.48 [v7.48-finalized]"
          git push origin HEAD:codex/meridian-v7-48-exit-lab-v1
# retry after regression fixture correction
