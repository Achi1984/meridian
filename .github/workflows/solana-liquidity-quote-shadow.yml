name: Solana pool liquidity and full-size exit quotes
on:
  push:
    branches: [research/entry-flow-edge-audit-20261125]
    paths: ['.github/workflows/solana-liquidity-quote-shadow.yml']
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: python -m unittest discover -s scripts/memecoin-paper/research -p test_liquidity_quote_shadow.py
      - run: python -u scripts/memecoin-paper/research/liquidity_quote_shadow.py pool-quotes.json
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: liquidity-and-exit-quotes, path: pool-quotes.json, if-no-files-found: error}
