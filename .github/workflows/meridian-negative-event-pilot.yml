# Temporary listener once merged to default main; explicitly owner-approved.
# Negative transport probe only; remove after the single authorized observation.
# Procedure: docs/autonomy/event-receiver/NEGATIVE-PILOT-20261012.md.
name: MERIDIAN Bounded Read Only Event Pilot
on:
  workflow_run:
    workflows: [MERIDIAN Release Safety]
    types: [completed]
permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read
jobs:
  reconcile:
    # Installed listener; only the approved source attempt may reach the collector.
    # The pin is one independently verified CI run; no caller-selected inputs.
    if: >-
      github.repository == 'Achi1984/meridian' &&
      github.event_name == 'workflow_run' &&
      github.run_attempt == 1 &&
      github.event.workflow_run.repository.full_name == 'Achi1984/meridian' &&
      github.event.workflow_run.head_repository.full_name == 'Achi1984/meridian' &&
      github.event.workflow_run.id == 38210241542 &&
      github.event.workflow_run.head_sha == '514819aeb5d97afe00263ed433550e8788f4761e' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.run_attempt == 2
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Verify collector runtime without starting production gateway
        run: python3 -I -B -c "import sys, ssl; assert sys.version_info >= (3, 12); print('Python collector runtime available')"
      - name: Load collector from this immutable default-branch control SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(gh api repos/Achi1984/meridian/commits/main --jq .sha)" = "$GITHUB_SHA"
          gh api "repos/Achi1984/meridian/contents/docs/autonomy/event-receiver/collector.py?ref=$GITHUB_SHA" -H 'Accept:application/vnd.github.raw+json' > "$RUNNER_TEMP/collector.py"
          test "$(wc -c < "$RUNNER_TEMP/collector.py")" -le 262144
      - name: Read bounded source metadata and write local receipt only
        env:
          GH_TOKEN: ${{ github.token }}
          RECEIPT_PATH: ${{ runner.temp }}/meridian-event-receipt.json
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -I -B "$RUNNER_TEMP/collector.py"
