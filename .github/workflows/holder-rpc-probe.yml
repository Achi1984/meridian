name: Bounded holder RPC sample
on:
  push:
    branches: [paper/holder-rpc-probe-20261125]
    paths: ['.github/workflows/holder-rpc-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - env:
          HOLDER_RPC_PROVIDER: helius
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        working-directory: scripts/memecoin-paper/research
        run: |
          python -m unittest test_holder_signal
          python -u - <<'PY'
          import json
          import time
          import holder_signal as holder
          import re
          mints = (
              '6hEQjd3hPGkhr9JH6mBzHqGdJEDiRRWFwgbqFRpxAQeK',
              'D4xDAWoc6rCgt72ia7CmSjyDgbQ5EmJRk9SHE4vkMme5',
              '8kP8xVjVhDMdUaXEbJSsS8WcXP3X7rRPkBwzqeH1pump',
              'EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v',
          )
          passed = 0
          for mint in mints:
              started = time.time()
              try:
                  result = holder.measure(mint)
                  if time.time()-started > holder.MAX_AGE:
                      raise ValueError('stale sample')
              except Exception as exc:
                  reason = str(exc)
                  if not isinstance(exc, ValueError) or not re.fullmatch(r'[a-zA-Z0-9 -]{1,70}', reason):
                      reason = type(exc).__name__
                  print(mint, reason)
                  continue
              print(json.dumps(dict(result, mint=mint, provider='helius')))
              passed += 1
          if not passed:
              raise SystemExit('No qualified sample')
          PY
