name: Bounded holder RPC sample
on:
  push:
    branches: [paper/holder-rpc-probe-20261125]
    paths: ['.github/workflows/holder-rpc-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - env:
          HOLDER_RPC_PROVIDER: helius
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        working-directory: scripts/memecoin-paper/research
        run: |
          python -m unittest test_holder_signal
          python -u - <<'PY'
          import json
          import time
          import holder_signal as holder
          mint = '6hEQjd3hPGkhr9JH6mBzHqGdJEDiRRWFwgbqFRpxAQeK'
          started = time.time()
          try:
              result = holder.measure(mint)
          except Exception as exc:
              raise SystemExit('Holder sample failed: %s %s' % (type(exc).__name__, getattr(exc, 'code', ''))) from None
          if time.time()-started > holder.MAX_AGE:
              raise SystemExit('Stale sample')
          print(json.dumps(dict(result, provider='helius', startedAt=started, receivedAt=time.time())))
          PY
