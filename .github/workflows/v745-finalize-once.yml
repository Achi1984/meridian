name: MERIDIAN v7.45 Finalize Once

on:
  push:
    branches:
      - codex/meridian-v7-45-header-brand-fix

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/meridian-v7-45-header-brand-fix
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Deterministic install
        run: npm ci
      - name: Sync release files
        run: node scripts/release-sync.mjs --write
      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify release and tests
        run: |
          npm run release:check
          npm test
          node scripts/privacy-check.mjs
          node scripts/secret-check.mjs
      - name: Remove one-time workflow and commit
        run: |
          rm -f .github/workflows/v745-finalize-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "MERIDIAN v7.45: finalize release cache tags" || exit 0
          git push origin HEAD:codex/meridian-v7-45-header-brand-fix
