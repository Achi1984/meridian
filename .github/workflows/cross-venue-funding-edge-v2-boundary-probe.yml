name: MERIDIAN Cross-Venue Funding Edge V2 Boundary Probe PRE-CONTRACT

on:
  pull_request:
    paths:
      - "scripts/probe-cross-venue-funding-edge-v2-boundaries.mjs"
      - ".github/workflows/cross-venue-funding-edge-v2-boundary-probe.yml"

permissions:
  contents: read

concurrency:
  group: cross-venue-v2-boundary-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax
        run: node --check scripts/probe-cross-venue-funding-edge-v2-boundaries.mjs
      - name: Probe provider coverage only
        run: node scripts/probe-cross-venue-funding-edge-v2-boundaries.mjs
