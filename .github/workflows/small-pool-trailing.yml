name: Compare small-pool fixed and trailing exits
on:
  workflow_run:
    workflows: ['Meridian holder concentration paper test']
    types: [completed]
permissions:
  contents: read
  actions: read
jobs:
  compare:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.path == '.github/workflows/holder-concentration.yml'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python -m unittest discover -s scripts/memecoin-paper/research -p test_small_pool_trailing.py
      - name: Verify the final journal from the triggering attempt
        id: journal
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run
            const source = {...context.repo, run_id: run.id, per_page: 100}
            const jobs = await github.paginate(
              'GET /repos/{owner}/{repo}/actions/runs/{run_id}/attempts/{attempt_number}/jobs',
              {...source, attempt_number: run.run_attempt}
            )
            const finishes = jobs.filter(job => job.name === 'finish' &&
              job.run_attempt === run.run_attempt && job.conclusion === 'success')
            if (finishes.length !== 1) throw new Error('Expected one successful finish job for this attempt')
            const [finish] = finishes
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts,
              {...source, name: 'abc-final'})
            const matches = artifacts.filter(a => a.name === 'abc-final' &&
              Date.parse(a.created_at) >= Date.parse(finish.started_at) &&
              Date.parse(a.created_at) <= Date.parse(finish.completed_at))
            if (matches.length !== 1 || matches[0].expired) throw new Error('Missing, expired or ambiguous final journal')
            const [artifact] = matches
            const response = await github.rest.actions.downloadArtifact({
              ...context.repo, artifact_id: artifact.id, archive_format: 'zip'
            })
            const archive = Buffer.from(response.data)
            const hash = require('node:crypto').createHash('sha256').update(archive).digest('hex')
            if (artifact.digest !== 'sha256:' + hash) throw new Error('Final journal digest mismatch')
            require('node:fs').writeFileSync('journal.zip', archive)
            core.info('Verified abc-final ' + artifact.id + ' for run ' + run.id + ', attempt ' + run.run_attempt)
            core.setOutput('artifact_id', String(artifact.id))
            core.setOutput('digest', artifact.digest)
      - name: Compare recorded exits and identify the source journal
        env:
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
          SOURCE_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_ARTIFACT: ${{ steps.journal.outputs.artifact_id }}
          SOURCE_DIGEST: ${{ steps.journal.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p journal
          unzip -p journal.zip status.json > journal/status.json
          unzip -p journal.zip events.jsonl > journal/events.jsonl
          python scripts/memecoin-paper/research/small_pool_trailing.py journal |
            jq --argjson run "$SOURCE_RUN" --argjson attempt "$SOURCE_ATTEMPT" \
               --argjson artifact "$SOURCE_ARTIFACT" --arg digest "$SOURCE_DIGEST" \
               '. + {source: {runId: $run, attempt: $attempt, artifactId: $artifact, digest: $digest}}' > comparison.json
      - uses: actions/upload-artifact@v4
        with:
          name: small-pool-exits-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: comparison.json
