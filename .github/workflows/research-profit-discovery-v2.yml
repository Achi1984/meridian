name: MERIDIAN Paper Bot Profit Discovery V2

on:
  push:
    branches:
      - fix/v10-r69-profit-agent-v2
    paths:
      - "research/PAPERBOT-PROFIT-SPECIAL-AGENT-V2.md"
      - "research/paperbot-profit-special-agent-v2.js"
      - "research/run-paperbot-profit-discovery-v2.mjs"
      - "test/paperbot-profit-special-agent-v2.test.js"
      - ".github/workflows/research-profit-discovery-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run V2 invariant tests
        run: node --test test/paperbot-profit-special-agent-v2.test.js
      - name: Run frozen 1460-day V2 discovery
        run: node research/run-paperbot-profit-discovery-v2.mjs
      - name: Upload untouched V2 discovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: paperbot-profit-discovery-v2
          path: |
            research/results/paperbot-profit-discovery-v2-summary.json
            research/results/paperbot-profit-discovery-v2-full.json
            research/results/paperbot-profit-discovery-v2.md
          if-no-files-found: error
          retention-days: 30
