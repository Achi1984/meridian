name: Mailbox R5 Bootstrap Writer V2
on:
  push:
    branches: [infra/claude-mailbox-r5]
    paths: [.github/workflows/mailbox-r5-bootstrap-writer-v2.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Guard patch verify self-delete
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          EXPECTED_PARENT: 261147f403af43ac8eed1b6a56308c2d37c30c87
          WF_BLOB: bf55068ca7e434f5c7cd6d789d1cdef87fb00e1d
          RESUME_BLOB: 6ab261ec78c250f3ceeee941c184e050fed3fff0
          TARGET_BRANCH: infra/claude-mailbox-r5
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          test "$EVENT_BEFORE" = "$EXPECTED_PARENT"
          test "$(git hash-object MERIDIAN_AGENT_WORKFLOW.md)" = "$WF_BLOB"
          test "$(git hash-object MERIDIAN_RESUME.json)" = "$RESUME_BLOB"
          python3 - <<'PY'
          from pathlib import Path
          def rep(path, old, new):
              p=Path(path); s=p.read_text()
              assert s.count(old)==1,(path,s.count(old))
              p.write_text(s.replace(old,new))
          rep("MERIDIAN_AGENT_WORKFLOW.md",
              "1. Before every Meridian work step, read Issue #539 comments since the last seen durable comment and all open `CROSS_MODEL_REQUEST` / `REVISION_REQUIRED` items.",
              "1. Before every Meridian work step, read `mailboxIssue` from `MERIDIAN_LIVE_CHECKPOINT.json`, then read that mailbox since the last seen durable comment and all open `CROSS_MODEL_REQUEST` / `REVISION_REQUIRED` items.")
          rep("MERIDIAN_RESUME.json",
              "For CROSS-VENUE-FUNDING-EDGE-V2: read Issue #539, then MERIDIAN_LIVE_CHECKPOINT.json, then live main/CI/related PRs. Expand large continuity files only on mismatch or when historical detail is required. Canonical execution/PnL/Discovery still requires explicit user authorization plus exact-head Claude review.",
              "For CROSS-VENUE-FUNDING-EDGE-V2: read `mailboxIssue` from MERIDIAN_LIVE_CHECKPOINT.json, then read that mailbox, then live main/CI/related PRs. Expand large continuity files only on mismatch or when historical detail is required. Canonical execution/PnL/Discovery still requires explicit user authorization plus exact-head Claude review.")
          rep("MERIDIAN_RESUME.json",
              "User only needs to say: 'Meridian fortsetzen'. Read Issue #539 first, then MERIDIAN_RESUME.json + MERIDIAN_AGENT_STATE.json, inspect main/PRs/CI, and continue the first incomplete durable step without repeating merged work.",
              "User only needs to say: 'Meridian fortsetzen'. Read `mailboxIssue` from MERIDIAN_LIVE_CHECKPOINT.json first, then read that mailbox, then MERIDIAN_RESUME.json + MERIDIAN_AGENT_STATE.json, inspect main/PRs/CI, and continue the first incomplete durable step without repeating merged work.")
          PY
          node -e "JSON.parse(require('fs').readFileSync('MERIDIAN_RESUME.json'))"
          python3 test/test_claude_mailbox_bridge.py
          python3 scripts/validate-agent-orchestration.py
          node scripts/continuity-audit.mjs
          node scripts/frozen-research-guard.mjs
          rm .github/workflows/mailbox-r5-bootstrap-writer-v2.yml
          git diff --check
          printf '%s\n' .github/workflows/mailbox-r5-bootstrap-writer-v2.yml MERIDIAN_AGENT_WORKFLOW.md MERIDIAN_RESUME.json | sort >/tmp/e
          git diff --name-only | sort >/tmp/a
          diff -u /tmp/e /tmp/a
          git config user.name "MERIDIAN R5 Writer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Infra: make mailbox bootstrap checkpoint-driven"
          git push origin HEAD:"$TARGET_BRANCH"
