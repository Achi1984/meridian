name: Funding Carry V2 Repeatability Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'funding-carry-paper-v2.js'
      - 'scripts/funding-carry-v2-repeatability-audit.mjs'
      - 'research/funding-carry-v2-repeatability-design.md'
      - 'test/funding-carry-v2-r40.test.js'
      - '.github/workflows/funding-carry-v2-repeatability-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify frozen production V2 rules
        run: node --test test/funding-carry-v2-r40.test.js
      - name: Run repeatability audit
        run: node scripts/funding-carry-v2-repeatability-audit.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: funding-carry-v2-repeatability-audit
          path: artifacts/funding-carry-v2-repeatability-audit.json
          if-no-files-found: error
