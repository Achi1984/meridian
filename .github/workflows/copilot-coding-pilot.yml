name: MERIDIAN One Packet Coding Pilot
on:
  workflow_run:
    workflows: [MERIDIAN Release Safety]
    types: [completed]
permissions: {}
concurrency:
  group: meridian-one-packet-coding-pilot
  cancel-in-progress: false
jobs:
  claim:
    if: >-
      github.repository == 'Achi1984/meridian' &&
      github.event.workflow_run.head_sha == '2b267ecc0f94565fe005156bf45e8f0ae139eb9b' &&
      github.event.workflow_run.conclusion == 'success' &&
      (github.run_attempt == 1 || github.run_attempt == 2) &&
      github.triggering_actor == 'Achi1984'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
      actions: read
      pull-requests: read
    outputs:
      claim: ${{ steps.claim.outputs.claim }}
    steps:
      - name: Load only trusted control helper
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/Achi1984/meridian/contents/scripts/copilot-coding-pilot.py?ref=$GITHUB_SHA" -H 'Accept:application/vnd.github.raw+json' > "$RUNNER_TEMP/pilot.py"
      - id: claim
        name: Validate live scope and atomically claim fixed packet
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$RUNNER_TEMP/pilot.py" claim
  generate:
    needs: claim
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions:
      contents: read
      actions: read
      pull-requests: read
      copilot-requests: write
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Load trusted helper
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/Achi1984/meridian/contents/scripts/copilot-coding-pilot.py?ref=$GITHUB_SHA" -H 'Accept:application/vnd.github.raw+json' > "$RUNNER_TEMP/pilot.py"
      - name: Install and verify pinned CLI bytes without token
        run: |
          set -euo pipefail
          node -e 'if (Number(process.versions.node.split(".")[0]) < 22) throw Error("Node 22+ required")'
          npm install --prefix "$RUNNER_TEMP/coding-pilot/cli" --ignore-scripts --no-audit --no-fund @github/copilot@1.0.95
          python3 "$RUNNER_TEMP/pilot.py" verify-cli
          "$RUNNER_TEMP/coding-pilot/cli/node_modules/@github/copilot-linux-x64/copilot" --no-auto-update --version | grep -F 'GitHub Copilot CLI 1.0.95.'
      - name: Verify actual tool surface locally, then generate ledger JSON
        env:
          GH_TOKEN: ${{ github.token }}
          CLAIM_SHA: ${{ needs.claim.outputs.claim }}
        run: python3 "$RUNNER_TEMP/pilot.py" generate
      - name: Recheck expiry before artifact transport
        run: python3 -c 'import os, runpy; runpy.run_path(os.environ["RUNNER_TEMP"] + "/pilot.py", run_name="expiry_check")["remaining"]()'
      - id: upload
        name: Upload only generated packet
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: version-history-ledger-packet
          path: ${{ runner.temp }}/coding-pilot/packet.json
          if-no-files-found: error
          retention-days: 1
          overwrite: false
  publish:
    needs: [claim, generate]
    environment: meridian-draft-publisher
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
      actions: read
      pull-requests: read
    steps:
      - name: Load and verify immutable trusted publisher files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          mkdir "$RUNNER_TEMP/trusted-publisher"
          cd "$RUNNER_TEMP/trusted-publisher"
          gh api 'repos/Achi1984/meridian/contents/scripts/copilot-coding-pilot.py?ref=30c351bc12f623de69d2d9f6862a0238c7cc572a' -H 'Accept:application/vnd.github.raw+json' > copilot-coding-pilot.py
          gh api 'repos/Achi1984/meridian/contents/scripts/copilot-publisher-broker.py?ref=30c351bc12f623de69d2d9f6862a0238c7cc572a' -H 'Accept:application/vnd.github.raw+json' > copilot-publisher-broker.py
          gh api 'repos/Achi1984/meridian/contents/scripts/copilot-publisher-runner.py?ref=30c351bc12f623de69d2d9f6862a0238c7cc572a' -H 'Accept:application/vnd.github.raw+json' > copilot-publisher-runner.py
          printf '%s\n' '778d235a4101a57af7a16020b9dd0e1d6041010d699aea983ca0fc17b82526b2  copilot-coding-pilot.py' 'cc06195689da4f1fa8bf63aa8cce55cd98fdfd603f4b395009c9fce9a418dd38  copilot-publisher-broker.py' 'c8dcad6a9e205fec71100a4f22a8f2923bfc0357e932a4ec12277b360e0d2f4d  copilot-publisher-runner.py' | sha256sum --check --strict -
      - name: Validate artifact and create one Draft with scoped App token
        env:
          GH_TOKEN: ${{ github.token }}
          CLAIM_SHA: ${{ needs.claim.outputs.claim }}
          ARTIFACT_ID: ${{ needs.generate.outputs.artifact }}
          MERIDIAN_PUBLISHER_APP_PRIVATE_KEY: ${{ secrets.MERIDIAN_PUBLISHER_APP_PRIVATE_KEY }}
        run: exec python3 -I "$RUNNER_TEMP/trusted-publisher/copilot-publisher-runner.py"
