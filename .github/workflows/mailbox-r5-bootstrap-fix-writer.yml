name: Mailbox R5 Bootstrap Fix Writer
on:
  push:
    branches: [infra/claude-mailbox-r5]
    paths: [.github/workflows/mailbox-r5-bootstrap-fix-writer.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Guard patch verify push
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          EXPECTED_PARENT: c7515165eff75dfb9d2f3ab26763a8c99c7c6483
          TARGET_BRANCH: infra/claude-mailbox-r5
        run: |
          set -euo pipefail
          test "$EVENT_BEFORE" = "$EXPECTED_PARENT"
          test "$(git hash-object MERIDIAN_AGENT_WORKFLOW.md)" = bf55068ca7e434f5c7cd6d789d1cdef87fb00e1d
          test "$(git hash-object MERIDIAN_RESUME.json)" = 6ab261ec78c250f3ceeee941c184e050fed3fff0
          python3 - <<'PY'
          from pathlib import Path
          def rep(path, old, new):
              p=Path(path); s=p.read_text()
              assert s.count(old)==1,(path,s.count(old),old)
              p.write_text(s.replace(old,new))
          rep("MERIDIAN_AGENT_WORKFLOW.md",
              "Before every Meridian work step, read Issue #539 comments since the last seen durable comment and all open `CROSS_MODEL_REQUEST` / `REVISION_REQUIRED` items.",
              "Before every Meridian work step, read the issue referenced by `MERIDIAN_LIVE_CHECKPOINT.json.mailboxIssue` since the last seen durable comment and all open `CROSS_MODEL_REQUEST` / `REVISION_REQUIRED` items.")
          rep("MERIDIAN_RESUME.json",
              "For CROSS-VENUE-FUNDING-EDGE-V2: read Issue #539, then MERIDIAN_LIVE_CHECKPOINT.json, then live main/CI/related PRs.",
              "For CROSS-VENUE-FUNDING-EDGE-V2: read `mailboxIssue` from MERIDIAN_LIVE_CHECKPOINT.json, read that mailbox, then live main/CI/related PRs.")
          rep("MERIDIAN_RESUME.json",
              "Read Issue #539 first, then MERIDIAN_RESUME.json + MERIDIAN_AGENT_STATE.json, inspect main/PRs/CI,",
              "Read `mailboxIssue` from MERIDIAN_LIVE_CHECKPOINT.json and that mailbox first, then MERIDIAN_RESUME.json + MERIDIAN_AGENT_STATE.json, inspect main/PRs/CI,")
          PY
          python3 -m json.tool MERIDIAN_RESUME.json >/dev/null
          python3 test/test_claude_mailbox_bridge.py
          python3 scripts/validate-agent-orchestration.py
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' MERIDIAN_AGENT_WORKFLOW.md MERIDIAN_RESUME.json | sort)"
          git config user.name "MERIDIAN R5 Bootstrap Writer"
          git config user.email "actions@users.noreply.github.com"
          git add MERIDIAN_AGENT_WORKFLOW.md MERIDIAN_RESUME.json
          git commit -m "Infra R5: make remaining bootstrap mailbox routing dynamic"
          git push origin HEAD:"$TARGET_BRANCH"
