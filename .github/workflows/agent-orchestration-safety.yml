name: MERIDIAN Agent Orchestration Safety

on:
  pull_request:
    paths:
      - "docs/AGENT_ORCHESTRATION.md"
      - "MERIDIAN_AGENT_STATE.json"
      - "MERIDIAN_RESUME.json"
      - "MERIDIAN_LEAD_LEASE.json"
      - "MERIDIAN_AGENT_WORKFLOW.md"
      - "MERIDIAN_DECISIONS.md"
      - "scripts/validate-agent-orchestration.py"
      - "scripts/lead_lease_validation.py"
      - "test/test_lead_lease_validation.py"
      - ".github/workflows/agent-orchestration-safety.yml"
  push:
    branches:
      - main
    paths:
      - "docs/AGENT_ORCHESTRATION.md"
      - "MERIDIAN_AGENT_STATE.json"
      - "MERIDIAN_RESUME.json"
      - "MERIDIAN_LEAD_LEASE.json"
      - "MERIDIAN_AGENT_WORKFLOW.md"
      - "MERIDIAN_DECISIONS.md"
      - "scripts/validate-agent-orchestration.py"
      - "scripts/lead_lease_validation.py"
      - "test/test_lead_lease_validation.py"
      - ".github/workflows/agent-orchestration-safety.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-orchestration-safety-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test lead lease protocol states
        run: python3 -m unittest test/test_lead_lease_validation.py
      - name: Validate orchestration contract and durable state
        run: python3 scripts/validate-agent-orchestration.py
