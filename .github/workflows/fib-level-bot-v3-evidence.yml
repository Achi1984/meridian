name: FIB Level Bot V3 Daily Anchor

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'fib-level-bot-v3-daily-anchor.js'
      - 'scripts/fib-level-bot-v3-evidence.mjs'
      - 'test/fib-level-bot-v3-daily-anchor.test.js'
      - 'research/fib-level-bot-v3-daily-anchor-design.md'
      - 'research/fib-level-bot-v3-daily-anchor-evidence-20260906.md'
      - '.github/workflows/fib-level-bot-v3-evidence.yml'

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify frozen V3 contract
        run: node --test test/fib-level-bot-v3-daily-anchor.test.js
      - name: Run locked V3 historical evidence
        run: node scripts/fib-level-bot-v3-evidence.mjs
      - name: Upload V3 evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: fib-level-bot-v3-evidence
          path: artifacts/fib-level-bot-v3-evidence.json
          if-no-files-found: error
