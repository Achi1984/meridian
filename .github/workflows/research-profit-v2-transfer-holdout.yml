name: MERIDIAN Paper Bot Profit V2 Transfer Holdout

on:
  push:
    branches:
      - fix/v10-r69-profit-agent-v2
    paths:
      - "research/PAPERBOT-PROFIT-V2-TRANSFER-HOLDOUT.md"
      - "research/paperbot-profit-special-agent-v2.js"
      - "research/run-paperbot-profit-v2-transfer-holdout.mjs"
      - "test/paperbot-profit-v2-transfer-holdout.test.js"
      - ".github/workflows/research-profit-v2-transfer-holdout.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run V2 transfer holdout invariants
        run: node --test test/paperbot-profit-v2-transfer-holdout.test.js
      - name: Run frozen transfer-universe holdout
        run: node research/run-paperbot-profit-v2-transfer-holdout.mjs
      - name: Upload untouched holdout evidence
        uses: actions/upload-artifact@v4
        with:
          name: paperbot-profit-v2-transfer-holdout
          path: |
            research/results/paperbot-profit-v2-transfer-holdout-summary.json
            research/results/paperbot-profit-v2-transfer-holdout-full.json
            research/results/paperbot-profit-v2-transfer-holdout.md
          if-no-files-found: error
          retention-days: 30
