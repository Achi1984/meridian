name: MTF Pullback Continuation V1 Evidence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'mtf-pullback-continuation-v1.js'
      - 'scripts/mtf-pullback-continuation-v1-evidence.mjs'
      - 'test/mtf-pullback-continuation-v1.test.js'
      - 'research/mtf-pullback-continuation-v1-design.md'
      - '.github/workflows/mtf-pullback-continuation-v1-evidence.yml'

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify frozen contract
        run: node --test test/mtf-pullback-continuation-v1.test.js
      - name: Run historical evidence
        run: node scripts/mtf-pullback-continuation-v1-evidence.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: mtf-pullback-continuation-v1-evidence
          path: artifacts/mtf-pullback-continuation-v1-evidence.json
          if-no-files-found: error
