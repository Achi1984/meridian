name: MERIDIAN v7.41 Finalize Once
on:
  push:
    branches: [codex/meridian-v7-41-header-paper-default]
    paths:
      - '.github/workflows/v7-41-finalize-once.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/meridian-v7-41-header-paper-default
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/release-sync.mjs --write
      - run: npm install --package-lock-only --ignore-scripts
      - run: node --check app-v7.37-ui-polish.js && node --check app-v7.39-paper-overview.js
      - run: npm test
      - run: npm run release:check
      - run: git rm .github/workflows/v7-41-finalize-once.yml
      - name: Commit finalized release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'MERIDIAN v7.41: finalize header and Paper UX release'
          git push origin HEAD:codex/meridian-v7-41-header-paper-default
