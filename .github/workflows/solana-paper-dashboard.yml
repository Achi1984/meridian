name: Publish Solana paper dashboard totals
on:
  workflow_run:
    workflows: ['Meridian Solana Meme Paper Bot']
    types: [completed]
    branches: [main]
permissions: {}
concurrency:
  group: solana-paper-dashboard
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: meme-paper-account-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: report
      - name: Read completed simulation totals
        id: dashboard
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          FINISHED: ${{ github.event.workflow_run.updated_at }}
        run: |
          python3 -I - <<'PY'
          import os, json, math
          from pathlib import Path
          session = Path('report/session')
          def read(name):
              path = session / name
              if path.stat().st_size > 65536:
                  raise ValueError('Unexpected report size')
              return json.loads(path.read_text())
          def count(value):
              if type(value) is not int or value < 0:
                  raise ValueError('Invalid count')
              return value
          def amount(value):
              if type(value) not in (float, int) or not math.isfinite(value):
                  raise ValueError('Invalid amount')
              return value
          summary = read('summary.json')
          account = summary['account']
          if account['startUsdc'] != 1000 or summary['ticks'] != 60:
              raise ValueError('Incomplete or unexpected paper session')
          funnel = {}
          comparison = None
          exceptions = {}
          if (session/'funnel.json').is_file():
              funnel = read('funnel.json')
              exceptions = funnel.get('decisionExceptions') or {}
              if 'liquidityFloorComparison' in funnel:
                  comparison = {}
                  for floor in ('10000', '5000'):
                      row = funnel['liquidityFloorComparison'][floor]
                      signals = count(row['signalPools'])
                      priced = count(row['pricedAtFiveMinutes'])
                      missing = count(row['missingAtFiveMinutes'])
                      median = row['medianPriceChangePct']
                      if priced + missing != signals or (median is None) != (priced == 0):
                          raise ValueError('Inconsistent five-minute observations')
                      comparison[floor] = dict(signals=signals, priced=priced, missing=missing,
                                              medianPct=None if median is None else amount(median))
          equity = account['equityUsdc']
          report = dict(schema=1, runId=int(os.environ['RUN_ID']), attempt=int(os.environ['ATTEMPT']),
                        at=os.environ['FINISHED'], pools=count(summary['pools']),
                        open=count(account['openPositions']), closed=count(account['closedTrades']),
                        realized=amount(account['realizedPnlUsdc']), equity=None if equity is None else amount(equity),
                        withdrawn=count(exceptions['signalWithdrawn']) if 'signalWithdrawn' in exceptions else None,
                        expired=count(exceptions['signalExpired']) if 'signalExpired' in exceptions else None)
          if 'earlyInflow' in summary:
              row = summary['earlyInflow']
              study = {key: count(row[key]) for key in
                       ('signals','entryQuotes','buyUnavailable','skipped','pricedExits','unresolved')}
              net = row['pricedNetUsdc']
              if (study['signals'] != study['entryQuotes'] + study['buyUnavailable'] + study['skipped']
                      or study['entryQuotes'] != study['pricedExits'] + study['unresolved']
                      or (net is None) != (study['pricedExits'] == 0)):
                  raise ValueError('Inconsistent early inflow totals')
              study['pricedNetUsdc'] = None if net is None else amount(net)
              report['earlyInflow'] = study
          if comparison is not None:
              report['fiveMinuteComparison'] = comparison
          if 'persistenceAt5000' in funnel:
              row = funnel['persistenceAt5000']
              study = {key: count(row[key]) for key in
                       ('signals','confirmed','rejected','missingConfirmation','priced','missingOutcome')}
              if (study['signals'] != study['confirmed'] + study['rejected'] + study['missingConfirmation']
                      or study['confirmed'] != study['priced'] + study['missingOutcome']
                      or (row['medianPct'] is None) != (study['priced'] == 0)):
                  raise ValueError('Inconsistent confirmation counts')
              study['medianPct'] = None if row['medianPct'] is None else amount(row['medianPct'])
              report['persistenceAt5000'] = study
          if 'exitWindowComparison' in funnel:
              row = funnel['exitWindowComparison']
              windows = {key: count(row[key]) for key in
                         ('observed','paired','incomplete','fourBetter','fiveBetter','equal')}
              diff = row['medianDifferenceUsdc']
              if (windows['observed'] != windows['paired'] + windows['incomplete']
                      or windows['paired'] != windows['fourBetter'] + windows['fiveBetter'] + windows['equal']
                      or (diff is None) != (windows['paired'] == 0)):
                  raise ValueError('Inconsistent paired exit observations')
              windows['medianDifferenceUsdc'] = None if diff is None else amount(diff)
              report['exitWindowComparison'] = windows
          execution = funnel.get('confirmationExecution')
          if execution is not None:
              failures = execution['unavailableBySide']
              metrics = {key: count(execution[key]) for key in ('quoted','passed','skipped')}
              metrics.update(buyMissing=count(failures.get('buy',0)),sellMissing=count(failures.get('sell',0)))
              median = execution['medianReturnUsdc']
              if (metrics['passed'] > metrics['quoted'] or (median is None) != (metrics['quoted'] == 0)
                      or metrics['quoted'] + metrics['buyMissing'] + metrics['sellMissing'] + metrics['skipped']
                      != report['persistenceAt5000']['confirmed']):
                  raise ValueError('Inconsistent confirmation quote totals')
              metrics['medianReturnUsdc'] = None if median is None else amount(median)
              if 'withinCostPct' in execution:
                  limits = {key: count(execution['withinCostPct'][key]) for key in ('1','2','5')}
                  if not limits['1'] <= limits['2'] <= limits['5'] == metrics['passed']:
                      raise ValueError('Inconsistent cost ceiling counts')
                  metrics['withinCostPct'] = limits
              report['confirmationExecution'] = metrics
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              print('report='+json.dumps(report,allow_nan=False),file=output)
          PY
      - uses: actions/github-script@v7
        env:
          REPORT: ${{ steps.dashboard.outputs.report }}
        with:
          script: |
            const report = JSON.parse(process.env.REPORT);
            const branch = 'paper-dashboard-data';
            const path = 'solana-meme.json';
            const { owner, repo } = context.repo;
            let sha;
            try {
              const { data } = await github.rest.repos.getContent({owner, repo, path, ref:branch});
              const previous = JSON.parse(Buffer.from(data.content,'base64').toString('utf8'));
              if (previous.runId > report.runId ||
                  (previous.runId === report.runId && previous.attempt >= report.attempt)) return;
              sha = data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path,branch,sha,
              message:'Update completed Solana paper account totals',
              content:Buffer.from(JSON.stringify(report)+'\n').toString('base64')});
