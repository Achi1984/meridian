name: Solana guarded remainder paper comparison
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: solana-guarded-remainder-paper
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: scripts/memecoin-paper/research
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify quote and receipt rules
        run: python3 -m unittest test_half_runner test_half_runner_report test_remainder_window_report
      - name: Collect one matched public-quote session
        shell: bash
        run: python3 newcomer_wave_pair.py --half-runner | tee wave-pair.jsonl
      - name: Compare H10 and guarded exits
        run: python3 remainder_window_report.py --protect-full-exit wave-pair.jsonl > guarded-exit-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guarded-paper-comparison
          path: |
            scripts/memecoin-paper/research/wave-pair.jsonl
            scripts/memecoin-paper/research/guarded-exit-results.json
