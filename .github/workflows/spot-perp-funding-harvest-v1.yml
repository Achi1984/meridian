name: MERIDIAN Spot-Perp Funding Harvest V1

on:
  push:
    branches:
      - research/spot-perp-funding-harvest-v1-strategy
    paths:
      - "research/SPOT-PERP-FUNDING-HARVEST-V1-FROZEN.md"
      - "research/spot-perp-funding-harvest-v1.js"
      - "research/run-spot-perp-funding-harvest-v1.mjs"
      - "scripts/collect-spot-perp-funding-harvest-v1.py"
      - "test/spot-perp-funding-harvest-v1.test.js"
      - ".github/workflows/spot-perp-funding-harvest-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spot-perp-funding-harvest-v1
  cancel-in-progress: true

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify frozen Spot-Perp V1 invariants
        run: node --test test/spot-perp-funding-harvest-v1.test.js
      - name: Collect discovery-only official Binance Vision archives
        run: python3 scripts/collect-spot-perp-funding-harvest-v1.py
      - name: Run first frozen Spot-Perp V1 discovery
        run: node research/run-spot-perp-funding-harvest-v1.mjs
      - name: Upload untouched discovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: spot-perp-funding-harvest-v1
          path: |
            research/results/spot-perp-funding-harvest-v1-summary.json
            research/results/spot-perp-funding-harvest-v1-full.json
            research/results/spot-perp-funding-harvest-v1.md
          if-no-files-found: error
          retention-days: 30
